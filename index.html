<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" id="metaTheme" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="Z Lift — دستیار حرفه‌ای تکنسین آسانسور: مدیریت پروژه، گزارش سرویس، چک‌لیست EN 81-20، محاسبات، عیب‌یابی و فاکتور. کاملاً آفلاین." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Z Lift" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>Z Lift — دستیار تکنسین آسانسور</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M10 8h12l-8 7h8L10 24l4-7h-6z' fill='white'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- ================= AUTH ================= -->
  <div id="authView" class="auth-wrap hidden">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-badge">
          <svg viewBox="0 0 32 32" width="34" height="34"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M10 8h12l-8 7h8L10 24l4-7h-6z" fill="#fff"/></svg>
        </div>
        <h1>Z Lift</h1>
        <p data-i18n="tagline">دستیار حرفه‌ای تکنسین آسانسور</p>
      </div>
      <div class="auth-tabs">
        <button id="tabLogin" class="active" data-i18n="login">ورود</button>
        <button id="tabRegister" data-i18n="register">ثبت‌نام</button>
      </div>
      <form id="authForm" autocomplete="off">
        <div id="nameField" class="field hidden">
          <label data-i18n="fullName">نام و نام خانوادگی</label>
          <input type="text" id="authName" placeholder="رضا محمدی" data-i18n-ph="phFullName" />
        </div>
        <div class="field">
          <label data-i18n="username">نام کاربری</label>
          <input type="text" id="authUsername" required autocomplete="username" />
        </div>
        <div class="field">
          <label data-i18n="password">رمز عبور</label>
          <input type="password" id="authPassword" required autocomplete="current-password" />
        </div>
        <div id="authError" class="auth-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-block" id="authSubmit" data-i18n="loginBtn">ورود به سامانه</button>
      </form>
      <div class="auth-demo">
        <span data-i18n="demoHint">حساب آزمایشی:</span>
        <code>tech / 123456</code>
        <div style="margin-top:8px;font-size:11.5px;opacity:.8" data-i18n="authLocalNote">ورود آزمایشی/محلی — داده‌ها فقط روی همین دستگاه ذخیره می‌شود</div>
      </div>
    </div>
  </div>

  <!-- ================= APP SHELL ================= -->
  <div id="appView" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="logo-badge sm">
          <svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M10 8h12l-8 7h8L10 24l4-7h-6z" fill="#fff"/></svg>
        </div>
        <div class="logo-text">
          <strong>Z Lift</strong>
          <span data-i18n="taglineShort">دستیار تکنسین آسانسور</span>
        </div>
        <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="close">✕</button>
      </div>
      <nav class="nav" id="mainNav"></nav>
      <div class="sidebar-foot">
        <div class="user-chip">
          <div class="avatar" id="userAvatar">ر</div>
          <div class="user-meta">
            <strong id="userName">—</strong>
            <span data-i18n="roleTech">تکنسین آسانسور</span>
          </div>
          <button class="icon-btn" id="backupBtn" aria-label="پشتیبان‌گیری" title="پشتیبان‌گیری">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </button>
          <button class="icon-btn" id="logoutBtn" aria-label="خروج" title="خروج">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h2 class="page-title" id="pageTitle">داشبورد</h2>
        <span id="offlineBadge" class="badge b-amber hidden" style="flex-shrink:0"></span>
        <div class="topbar-actions">
          <button class="icon-btn" id="tgChannelBtn" aria-label="کانال تلگرام Z Lift" title="کانال تلگرام Z Lift" style="color:#2AABEE">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
          </button>
          <button class="icon-btn" id="gSearchBtn" aria-label="جستجوی سراسری" title="جستجوی سراسری">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
          <button class="icon-btn hidden" id="installBtn" aria-label="نصب اپلیکیشن" onclick="promptInstall()" title="نصب اپلیکیشن" style="color:var(--accent-2);border-color:var(--accent-2)">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
          <button class="icon-btn" id="langBtn" aria-label="English / فارسی" title="English / فارسی"><span id="langLabel">EN</span></button>
          <button class="icon-btn" id="themeBtn" aria-label="حالت تیره/روشن" title="حالت تیره/روشن">
            <svg id="iconMoon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg id="iconSun" class="hidden" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
        </div>
      </header>
      <div class="content" id="content">
        <div class="page-loading"><div class="spinner"></div></div>
      </div>
    </main>
  </div>

  <!-- modal + toast roots -->
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>


  <!-- ===== DATA LAYER (must load first — modules depend on these) ===== -->
  <script src="js/data/translations.js"></script>
  <script src="js/data/checklist-data.js"></script>
  <script src="js/data/diagnostics-data.js"></script>
  <script src="js/data/knowledge.js"></script>
  <script src="js/data/calculator-data.js"></script>
  <script src="js/data/calc-categories.js"></script>
  <script src="js/data/measurement-fields.js"></script>
  <script src="js/data/vvvf-data.js"></script>

  <!-- ===== CORE (state, version, utilities — must load before database) ===== -->
  <script src="js/core/jalali.js"></script>
  <script src="js/core/app-core.js"></script>

  <!-- ===== DATABASE LAYER (depends on version constants from app-core) ===== -->
  <script src="js/database/structured-db.js"></script>
  <script src="js/database/photo-store.js"></script>
  <script src="js/database/offline-layer.js"></script>
  <script src="js/database/api-local.js"></script>

  <!-- ===== COMPONENTS ===== -->
  <script src="js/components/qrcode.js"></script>
  <script src="js/components/jdate-picker.js"></script>

  <!-- ===== AUTH ===== -->
  <script src="js/auth/auth.js"></script>

  <!-- ===== ROUTER + APP SHELL ===== -->
  <script src="js/router.js"></script>

  <!-- ===== MODULES ===== -->
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/projects.js"></script>
  <script src="js/modules/services.js"></script>
  <script src="js/modules/calendar.js"></script>
  <script src="js/modules/inventory.js"></script>
  <script src="js/modules/checklists.js"></script>
  <script src="js/modules/calculations.js"></script>
  <script src="js/modules/diagnostics.js"></script>
  <script src="js/modules/knowledge.js"></script>
  <script src="js/modules/standards.js"></script>
  <script src="js/modules/notes.js"></script>
  <script src="js/modules/vvvf.js"></script>
  <script src="js/modules/issues.js"></script>
  <script src="js/modules/tools.js"></script>
  <script src="js/modules/analytics.js"></script>
  <script src="js/modules/measurements.js"></script>
  <script src="js/modules/settings.js"></script>

  <!-- ===== ENGINEERING ===== -->
  <script src="js/engineering/measurement-engine.js"></script>

  <!-- ===== REPORTS ===== -->
  <script src="js/reports/monthly-report.js"></script>

  <!-- ===== CORE UTILITIES ===== -->
  <script src="js/core/share.js"></script>
  <script src="js/database/backup.js"></script>

  <!-- ===== APP ENTRY ===== -->
  <script src="js/app.js"></script>

  <!-- ===== PWA ===== -->
  <script src="js/pwa.js"></script>
</body>
</html>
