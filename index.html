      <p>${esc(k.summary[LANG] || k.summary.fa)}</p>
      <div class="kb-tags">${k.tags.slice(0, 4).map(tg => `<span class="badge b-gray">${esc(tg)}</span>`).join('')}</div>
    </div>`).join('');
}
function kbSection(icon, titleKey, content) {
  if (!content || (Array.isArray(content) && !content.length)) return '';
  const body = Array.isArray(content)
    ? `<ul style="padding-inline-start:20px">${content.map(x => `<li style="margin-bottom:3px">${esc(x)}</li>`).join('')}</ul>`
    : `<p>${esc(content)}</p>`;
  return `<h4 style="display:flex;align-items:center;gap:7px">${icon} ${t(titleKey)}</h4>${body}`;
}
function kbOpenRelated(name) {
  const q = name.toLowerCase();
  const hit = KNOWLEDGE.find(k => (k.title.fa + ' ' + (k.title.en || '')).toLowerCase().includes(q)) ||
              KNOWLEDGE.find(k => kbSearchText(k).includes(q));
  if (hit) { openKbArticle(hit.id); }
  else { closeModal(); kbQuery = name; navigate('/knowledge'); }
}
function openKbArticle(id) {
  const k = KNOWLEDGE.find(x => x.id === id);
  if (!k) return;
  let inner;
  if (k.what) {
    // structured component entry
    inner = `<div class="kb-article">
      ${kbSection('⚙️', 'kbWhat', k.what)}
      ${kbSection('📍', 'kbWhere', k.where)}
      ${kbSection('🚨', 'kbSymptoms', k.symptoms)}
      ${kbSection('👁️', 'kbInspect', k.inspect)}
      ${kbSection('🧪', 'kbTest', k.test)}
      ${kbSection('💥', 'kbCauses', k.causes)}
      ${k.related && k.related.length ? `<h4>🔗 ${t('kbRelated')}</h4><div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0">${k.related.map(r => `<span class="badge b-blue" style="cursor:pointer" title="${t('kbRelClick')}" onclick="kbOpenRelated('${esc(r).replace(/'/g, '')}')">${esc(r)} ←</span>`).join('')}</div>` : ''}
      ${k.safety ? `<div class="safety-banner" style="margin-top:14px"><span style="font-size:17px">⚠️</span><span>${esc(k.safety)}</span></div>` : ''}
      ${k.diag ? `<div class="note-block" style="margin-top:10px">🧭 <b>${t('kbDiag')}:</b> ${esc(k.diag)} — <a href="#/diagnostics" onclick="closeModal()">${t('diagnostics')} ←</a></div>` : ''}
    </div>`;
  } else {
    inner = `<div class="kb-article">${k.body[LANG] || k.body.fa}</div>`;
  }
  openModal(`
    <div class="modal-head"><h3>${k.icon} ${esc(k.title[LANG] || k.title.fa)}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${inner}
      <div class="kb-tags" style="margin-top:16px">${k.tags.map(tg => `<span class="badge b-gray">${esc(tg)}</span>`).join('')}</div>
    </div>
    <div class="modal-foot"><button class="btn btn-primary" onclick="closeModal()">${t('close')}</button></div>`, { size: 'lg' });
}

let stdQuery = '';
let stdCat = 'all';
function stdSearchText(s) {
  let str = s.title.fa + ' ' + (s.title.en || '') + ' ' + s.clause + ' ' + (s.note ? s.note.fa + ' ' + s.note.en : '');
  s.vals.forEach(v => { str += ' ' + v.fa + ' ' + (v.en || '') + ' ' + v.v + ' ' + (v.unit || ''); });
  return str.toLowerCase();
}
function renderStandards() {
  const c = $('#content');
  c.innerHTML = `
    <div class="safety-banner" style="background:var(--accent-soft);border-color:var(--accent-2);color:var(--accent-2)">
      <span style="font-size:18px">🛡️</span><span>${t('stdBanner')}</span>
    </div>
    <div class="toolbar">
      <div class="search">${IC.search}<input id="stdSearch" placeholder="${t('stdSearch')}" value="${esc(stdQuery)}" /></div>
      <div class="chip-row">
        ${STD81_CATS.map(ct => `<button class="chip ${stdCat === ct.id ? 'active' : ''}" data-sc="${ct.id}">${esc(ct[LANG] || ct.fa)}</button>`).join('')}
      </div>
    </div>
    <div id="stdList" class="grid-2"></div>
    <p class="calc-note" style="margin-top:16px">📖 ${t('stdDisclaimer')}</p>`;
  $('#stdSearch').oninput = debounce(e => { stdQuery = e.target.value; drawStd(); }, 200);
  $$('.chip[data-sc]').forEach(ch => ch.onclick = () => { stdCat = ch.dataset.sc; renderStandards(); });
  drawStd();
}
function drawStd() {
  const q = stdQuery.trim().toLowerCase();
  let list = STD81;
  if (stdCat !== 'all') list = list.filter(s => s.cat === stdCat);
  if (q) list = list.filter(s => stdSearchText(s).includes(q));
  const el = $('#stdList');
  if (!list.length) {
    el.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="e-icon">🔍</div><strong>${t('notFound')}</strong><p>${t('stdNoMatch')}</p></div>`;

  el.innerHTML = list.map(s => `

      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <h4><span style="font-size:19px">${s.icon}</span> ${esc(s.title[LANG] || s.title.fa)}</h4>

        ${s.vals.length > 2 ? `<div style="font-size:11.5px;color:var(--text-3);margin-top:2px">+ ${faNum(s.vals.length - 2)} ${LANG === 'fa' ? 'مورد دیگر' : 'more'} …</div>` : ''}

let noteQuery = '';
function renderNotes() {
  const c = $('#content');
  c.innerHTML = `
    <div class="toolbar">
      <div class="search">${IC.search}<input id="noteSearch" placeholder="${t('searchNotes')}" value="${esc(noteQuery)}" /></div>
      <button class="btn btn-primary" onclick="openNoteForm()">${IC.plus} ${t('newNote')}</button>
    </div>
    <div id="noteList" class="grid-2"></div>`;
  $('#noteSearch').oninput = debounce(e => { noteQuery = e.target.value; drawNotes(); }, 200);
  drawNotes();
}
function drawNotes() {
  const q = noteQuery.trim().toLowerCase();
  let list = state.notes;
  if (q) list = list.filter(n => (n.title + ' ' + n.content + ' ' + n.tags.join(' ')).toLowerCase().includes(q));
  const el = $('#noteList');
  if (!state.notes.length) {
    el.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="e-icon">📝</div><strong>${t('noNotes')}</strong><p>${t('noNotesSub')}</p><button class="btn btn-primary" onclick="openNoteForm()">${IC.plus} ${t('newNote')}</button></div>`;
    return;
  }
  if (!list.length) {
    el.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="e-icon">🔍</div><strong>${t('notFound')}</strong><p>${t('notFoundSub')}</p></div>`;
    return;
  }
  el.innerHTML = list.map(n => `
    <div class="card kb-card" onclick="openNoteForm('${n.id}')">
      <h4>📝 ${esc(n.title)}</h4>
      <p>${esc(n.content)}</p>
      <div class="kb-tags">
        ${n.tags.map(tg => `<span class="badge b-blue">#${esc(tg)}</span>`).join('')}
        <span class="badge b-gray">${fmtDate(n.createdAt)}</span>
      </div>
    </div>`).join('');
}
function openNoteForm(id) {
  const n = id ? state.notes.find(x => x.id === id) : null;
  const v = n || { title: '', content: '', tags: [] };
  openModal(`
    <div class="modal-head"><h3>${n ? '✏️ ' + t('editNote') : '📝 ' + t('newNote')}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>${t('noteTitle')} *</label><input id="n_title" value="${esc(v.title)}" /></div>
      <div class="field"><label>${t('noteContent')}</label><textarea id="n_content" style="min-height:140px">${esc(v.content)}</textarea></div>
      <div class="field"><label>${t('noteTags')}</label><input id="n_tags" value="${esc(v.tags.join('، '))}" /></div>
    </div>
    <div class="modal-foot">
      ${n ? `<button class="btn btn-soft-danger" onclick="deleteNote('${n.id}')">${IC.trash} ${t('delete')}</button>` : ''}
      <button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn btn-primary" id="noteSave">${n ? t('save') : t('create')}</button>
    </div>`);
  $('#noteSave').onclick = async () => {
    const title = $('#n_title').value.trim();
    if (!title) { toast(t('requiredTitle'), 'err'); return; }
    const body = {
      title, content: $('#n_content').value,
      tags: $('#n_tags').value.split(/[,،]/).map(x => x.trim()).filter(Boolean)
    };
    const btn = $('#noteSave'); btn.disabled = true;
    try {
      if (n) {
        const d = await api('/notes/' + n.id, { method: 'PUT', body });
        Object.assign(n, d.note);
        toast(t('saved'));
      } else {
        const d = await api('/notes', { method: 'POST', body });
        state.notes.unshift(d.note);
        toast(t('created'));
      }
      closeModal(); drawNotes();
    } catch (e) { toast(t('errGeneric'), 'err'); btn.disabled = false; }
  };
}
function deleteNote(id) {
  confirmDialog(t('confirmDeleteTitle'), t('confirmDeleteNoteMsg'), async () => {
    const idx = state.notes.findIndex(n => n.id === id);
    const [removed] = state.notes.splice(idx, 1);
    closeModal(); drawNotes();
    try { await api('/notes/' + id, { method: 'DELETE' }); toast(t('deleted')); }
    catch (e) { state.notes.splice(idx, 0, removed); toast(t('errGeneric'), 'err'); drawNotes(); }
  });
}

function deleteIssue(id) {

  });
}

/* ================= MEASUREMENT ENGINE ================= */
function measurePanelHTML(prefix) {
  return `
    <div class="card" style="margin-top:14px">
      <div class="card-title" style="margin-bottom:8px">📐 ${t('measures')}</div>
      <p style="font-size:11.8px;color:var(--text-3);margin-bottom:10px">${t('measNote')}</p>
      <div class="form-grid">
        ${MEASURE_FIELDS.map(f => `
          <div class="field" style="margin-bottom:8px">
            <label>${esc(f.fa)} <span style="color:var(--text-3);direction:ltr;display:inline-block">(${f.unit})</span></label>
            <input type="number" step="any" id="${prefix}_${f.id}" placeholder="—" />
          </div>`).join('')}
      </div>
      <button class="btn btn-ghost btn-sm" id="${prefix}_evalBtn">🧪 ${t('measCheck')}</button>
      <div id="${prefix}_evalOut"></div>
    </div>`;
}
function collectMeasures(prefix) {
  const out = [];
  MEASURE_FIELDS.forEach(f => {
    const el = $('#' + prefix + '_' + f.id);
    if (el && el.value !== '') out.push({ id: f.id, label: f.fa, value: parseFloat(el.value), unit: f.unit });
  });
  return out;
}
function evalMeasures(list) {
  const msgs = [];
  const g = id => { const m = list.find(x => x.id === id); return m ? m.value : null; };
  const rs = g('v_rs'), st = g('v_st'), rt = g('v_rt');
  if (rs != null && st != null && rt != null && rs > 0) {
    const avg = (rs + st + rt) / 3;
    const dev = Math.max(Math.abs(rs - avg), Math.abs(st - avg), Math.abs(rt - avg)) / avg * 100;
    const p = faNum(dev.toFixed(1));
    msgs.push(dev <= 2
      ? { ok: true, text: t('measBalanced').replace('{p}', p) }
      : { ok: false, text: t('measUnbalanced').replace('{p}', p) });
  }
  const dc = g('v_dcbus');
  if (dc != null && rs != null && rs > 100) {
    const expect = rs * Math.sqrt(2);
    const diff = Math.abs(dc - expect) / expect * 100;
    msgs.push({ ok: diff < 15, text: (LANG === 'fa' ? 'باس DC اندازه‌گیری‌شده ' : 'Measured DC bus ') + faNum(dc) + 'V — ' + (LANG === 'fa' ? 'مقدار مورد انتظار تقریبی ' : 'expected approx ') + faNum(expect.toFixed(0)) + 'V (√2×U)' });
  }
  const tmp = g('temp');
  if (tmp != null) msgs.push({ ok: tmp < 70, text: (LANG === 'fa' ? 'دما: ' : 'Temp: ') + faNum(tmp) + '°C' + (tmp >= 70 ? (LANG === 'fa' ? ' — بالای ~۷۰ درجه معمولاً بحرانی است؛ خنک‌کاری را بررسی کنید' : ' — above ~70 °C usually critical') : '') });
  const lvl = g('lvl_err');
  if (lvl != null) msgs.push({ ok: Math.abs(lvl) <= 10, text: (LANG === 'fa' ? 'خطای همسطحی: ' : 'Leveling error: ') + faNum(lvl) + 'mm' + (Math.abs(lvl) > 10 ? (LANG === 'fa' ? ' — خارج از دقت توقف ±۱۰ میلی‌متر (EN 81-20 §5.12.1.1.4)' : ' — beyond ±10 mm stopping accuracy (EN 81-20 §5.12.1.1.4)') : ' ✓') });
  /* ---- EN 81-20 field checks ---- */
  const df = g('door_force');
  if (df != null) msgs.push({ ok: df <= 150, text: (LANG === 'fa' ? 'نیروی بستن درب: ' : 'Door closing force: ') + faNum(df) + ' N' + (df > 150 ? (LANG === 'fa' ? ' — بیش از حد مجاز ۱۵۰ نیوتن (EN 81-20 §5.3.6.2)' : ' — above the 150 N limit (EN 81-20 §5.3.6.2)') : ' ✓') });
  const dg = g('door_gap');
  if (dg != null) msgs.push({ ok: dg <= 6, text: (LANG === 'fa' ? 'فاصله لته‌های درب: ' : 'Door panel gap: ') + faNum(dg) + ' mm' + (dg > 10 ? (LANG === 'fa' ? ' — بیش از ۱۰ میلی‌متر؛ مردود در هر شرایطی (EN 81-20 §5.3.1.4)' : ' — over 10 mm; fails in all cases (EN 81-20 §5.3.1.4)') : dg > 6 ? (LANG === 'fa' ? ' — بالای ۶ میلی‌متر؛ فقط بر اثر سایش تا ۱۰ قابل قبول است' : ' — over 6 mm; only acceptable from wear up to 10 mm') : ' ✓') });
  const le = g('lock_eng');
  if (le != null) msgs.push({ ok: le >= 7, text: (LANG === 'fa' ? 'درگیری قفل درب طبقه: ' : 'Landing lock engagement: ') + faNum(le) + ' mm' + (le < 7 ? (LANG === 'fa' ? ' — کمتر از ۷ میلی‌متر؛ مردود (EN 81-20 §5.3.9.1)' : ' — below 7 mm; fail (EN 81-20 §5.3.9.1)') : ' ✓') });
  const vr = g('v_rated'), vg = g('v_gov');
  if (vr != null && vr > 0) {
    const min = 1.15 * vr;
    if (vg != null) {
      const maxCap = vr > 1 ? (1.25 * vr + 0.25 / vr) : 1.5;
      msgs.push({ ok: vg >= min && vg < maxCap, text: (LANG === 'fa' ? 'گاورنر: ' : 'Governor: ') + faNum(vg) + ' m/s — ' + (LANG === 'fa' ? 'محدوده مجاز برای این سرعت: ' : 'allowed range for this speed: ') + faNum(min.toFixed(2)) + ' تا ' + faNum(maxCap.toFixed(2)) + ' m/s (EN 81-20 §5.6.2.2.2)' });
    }
  }
  return msgs;
}
function wireMeasurePanel(prefix) {
  const btn = $('#' + prefix + '_evalBtn');
  if (!btn) return;
  btn.onclick = () => {
    const list = collectMeasures(prefix);
    const msgs = evalMeasures(list);
    $('#' + prefix + '_evalOut').innerHTML = msgs.length
      ? `<div class="calc-result" style="margin-top:10px">${msgs.map(m => `<div class="r-row"><span class="r-label" style="font-size:12.8px">${m.ok ? '✅' : '⚠️'} ${esc(m.text)}</span></div>`).join('')}</div>`
      : `<p class="calc-note">—</p>`;
  };
}

/* ================= PHOTOS ================= */
function photoCats() { return t('photoCats').split('|'); }
/* only allow safe raster data-URIs — blocks javascript:/svg vectors from malicious backups */
function safePhotoSrc(d) {
  return (typeof d === 'string' && /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(d)) ? d : '';
}
function openPhotoForm(presetProject) {
  const cats = photoCats();
  openModal(`
    <div class="modal-head"><h3>📷 ${t('addPhoto')}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>${t('photoCat')}</label><select id="ph_cat">${cats.map(x => `<option>${esc(x)}</option>`).join('')}</select></div>
      <div class="field"><label>${t('diagSelProject')}</label><select id="ph_project">
        <option value="">—</option>
        ${state.projects.map(p => `<option value="${p.id}" ${presetProject === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
      </select></div>
      <div class="field"><label>${t('prNotes')}</label><input id="ph_note" /></div>
      <input type="file" id="ph_file" accept="image/*" capture="environment" style="width:100%" />
      <div id="ph_preview" style="margin-top:10px"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn btn-primary" id="phSave" disabled>💾 ${t('save')}</button>
    </div>`);
  let dataUrl = '';
  $('#ph_file').onchange = () => {
    const file = $('#ph_file').files[0];
    if (!file) return;
    const img = new Image();
    const fr = new FileReader();
    fr.onload = () => {
      img.onload = () => {
        // downscale to max 1280px to keep storage sane
        const max = 1280;
        let { width: w, height: h } = img;
        if (w > max || h > max) { const k = Math.min(max / w, max / h); w = Math.round(w * k); h = Math.round(h * k); }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        dataUrl = cv.toDataURL('image/jpeg', 0.75);
        if (dataUrl.length > 2000000) { toast(t('photoTooLarge'), 'err'); dataUrl = ''; return; }
        $('#ph_preview').innerHTML = `<img src="${dataUrl}" style="max-width:100%;border-radius:12px;border:1px solid var(--border)" />`;
        $('#phSave').disabled = false;
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  };
  $('#phSave').onclick = guard('#phSave', async () => {
    if (!dataUrl) return;
    try {
      const d = await api('/photos', { method: 'POST', body: { data: dataUrl, cat: $('#ph_cat').value, projectId: $('#ph_project').value, note: $('#ph_note').value } });
      state.photos.unshift(d.item);
      closeModal(); toast(t('saved')); render();
    } catch (e) { toast(e.code === 'too_large' ? t('photoTooLarge') : t('errGeneric'), 'err'); }
  });
}

/* ================= INVOICES ================= */
let invFilter = { q: '', status: 'all' };
let invDraft = null; // items being edited in the open form

function money(n) { return faNum((Math.round(+n || 0)).toLocaleString('en-US')); }
function invTotals(inv) {
  /* integer-safe: rials have no fractions; round every term to avoid FP drift */
  const items = (inv.items || []).reduce((a, it) => a + Math.round(+it.qty || 0) * Math.round(+it.price || 0), 0);
  const grand = Math.max(0, items + Math.round(+inv.labor || 0) - Math.round(+inv.discount || 0));
  const paid = (inv.payments || []).reduce((a, p) => a + (Math.round(+p.amount) || 0), 0);
  return { items, grand, paid, balance: Math.max(0, grand - paid) };
}
function invStatusMeta(inv) {
  const tt = invTotals(inv);
  if (tt.grand > 0 && tt.paid >= tt.grand) return { key: 'invPaidFull', cls: 'b-green', icon: '✅' };
  if (tt.paid > 0) return { key: 'invPartial', cls: 'b-amber', icon: '🟠' };
  return { key: 'invUnpaid', cls: 'b-red', icon: '🔴' };
}

  c.innerHTML = `

      ${'<div class="card stat-card"><div class="stat-icon" style="background:var(--danger-soft);font-size:21px">🧾</div><div class="stat-body"><div class="stat-value" style="font-size:17px">' + money(openBalance) + ' <span style="font-size:11px;color:var(--text-3)">' + t('rial') + '</span></div><div class="stat-label">' + t('invOpenBalance') + '</div></div></div>'}
    </div>
    <div class="toolbar">
      <div class="search">${IC.search}<input id="invSearch" placeholder="${t('searchInvoices')}" value="${esc(invFilter.q)}" /></div>
      <div class="chip-row">
        <button class="chip ${invFilter.status === 'all' ? 'active' : ''}" data-s="all">${t('all')}</button>
        <button class="chip ${invFilter.status === 'unpaid' ? 'active' : ''}" data-s="unpaid">🔴 ${t('invUnpaid')}</button>
        <button class="chip ${invFilter.status === 'partial' ? 'active' : ''}" data-s="partial">🟠 ${t('invPartial')}</button>
        <button class="chip ${invFilter.status === 'paid' ? 'active' : ''}" data-s="paid">✅ ${t('invPaidFull')}</button>
      </div>
      <button class="btn btn-primary" onclick="openInvoiceForm()">${IC.plus} ${t('newInvoice')}</button>
    </div>
    <div id="invList"></div>`;
  $('#invSearch').oninput = debounce(e => { invFilter.q = e.target.value; drawInvList(); }, 200);
  $$('.chip[data-s]').forEach(ch => ch.onclick = () => { invFilter.status = ch.dataset.s; renderInvoices(); });
  drawInvList();
}
function drawInvList() {
  const q = invFilter.q.trim().toLowerCase();
  let list = state.invoices;
  if (invFilter.status !== 'all') {
    list = list.filter(inv => {
      const m = invStatusMeta(inv);
      return (invFilter.status === 'paid' && m.key === 'invPaidFull') ||
             (invFilter.status === 'partial' && m.key === 'invPartial') ||
             (invFilter.status === 'unpaid' && m.key === 'invUnpaid');
    });
  }
  if (q) list = list.filter(inv => (inv.customer + ' ' + (inv.note || '') + ' ' + (inv.projectId ? projName(inv.projectId) : '') + ' ' + (inv.items || []).map(i => i.desc).join(' ')).toLowerCase().includes(q));
  const el = $('#invList');
  if (!state.invoices.length) {
    el.innerHTML = `<div class="empty"><div class="e-icon">🧾</div><strong>${t('noInvoices')}</strong><p>${t('noInvoicesSub')}</p><button class="btn btn-primary" onclick="openInvoiceForm()">${IC.plus} ${t('newInvoice')}</button></div>`;
    return;
  }
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="e-icon">🔍</div><strong>${t('notFound')}</strong><p>${t('notFoundSub')}</p></div>`;
    return;
  }
  el.innerHTML = list.map(inv => {
    const tt = invTotals(inv);
    const m = invStatusMeta(inv);
    return `<div class="row-item" onclick="openInvoiceForm('${inv.id}')">
      <div class="row-icon" style="background:var(--bg-soft);border:1px solid var(--border);font-size:18px">🧾</div>
      <div class="row-body">
        <strong>${esc(inv.customer || '—')}${inv.projectId ? ' · ' + esc(projName(inv.projectId)) : ''}</strong>
        <span class="sub">${t('invGrand')}: ${money(tt.grand)} ${t('rial')}${tt.balance ? ' · ' + t('invBalance') + ': ' + money(tt.balance) : ''}</span>
      </div>
      <div class="row-side">
        <span class="badge ${m.cls}">${m.icon} ${t(m.key)}</span>
        <span class="date">${fmtDate(inv.date || inv.createdAt)} · #${esc((inv.id || '').slice(0, 6).toUpperCase())}</span>
      </div>
    </div>`;
  }).join('');
}

function invItemsHTML() {
  return invDraft.items.map((it, i) => `
    <div style="display:flex;gap:7px;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap">
      <input placeholder="${t('invDesc')}" value="${esc(it.desc)}" data-if="desc" data-ix="${i}"
        style="flex:2;min-width:130px;background:var(--bg-soft);border:1.5px solid var(--border);border-radius:10px;padding:9px 11px;outline:none" />
      <input type="number" min="1" placeholder="${t('invQty')}" value="${it.qty}" data-if="qty" data-ix="${i}"
        style="width:64px;background:var(--bg-soft);border:1.5px solid var(--border);border-radius:10px;padding:9px 8px;outline:none" />
      <input type="number" min="0" placeholder="${t('invUnitPrice')}" value="${it.price}" data-if="price" data-ix="${i}"
        style="flex:1;min-width:100px;background:var(--bg-soft);border:1.5px solid var(--border);border-radius:10px;padding:9px 8px;outline:none" />
      <button class="icon-btn" style="width:36px;height:36px" onclick="invDelItem(${i})">✕</button>
      <div style="width:100%;font-size:11.5px;color:var(--text-3);direction:ltr;text-align:end">${money((+it.qty || 0) * (+it.price || 0))} ${t('rial')}</div>
    </div>`).join('');
}
function invRefreshItems() {
  const box = $('#invItemsBox');
  if (box) { box.innerHTML = invItemsHTML(); invWireItems(); invRefreshTotals(); }
}
function invWireItems() {
  $$('#invItemsBox [data-if]').forEach(inp => {
    inp.oninput = () => {
      const it = invDraft.items[+inp.dataset.ix];
      if (!it) return;
      if (inp.dataset.if === 'desc') it.desc = inp.value;
      else it[inp.dataset.if] = +inp.value || 0;
      invRefreshTotals();
    };
  });
}
function invDelItem(i) {
  const it = invDraft.items[i];
  if (it && it.partId) invDraft.releasedParts.push({ partId: it.partId, qty: +it.qty || 0 });
  invDraft.items.splice(i, 1);
  invRefreshItems();
}
function invAddItem(item) {
  invDraft.items.push(item || { desc: '', qty: 1, price: 0 });
  invRefreshItems();
}
function invRefreshTotals() {
  const items = invDraft.items.reduce((a, it) => a + (+it.qty || 0) * (+it.price || 0), 0);
  const labor = +($('#inv_labor') && $('#inv_labor').value) || 0;
  const disc = +($('#inv_discount') && $('#inv_discount').value) || 0;
  const grand = Math.max(0, items + labor - disc);
  const paid = (invDraft.payments || []).reduce((a, p) => a + (+p.amount || 0), 0);
  const el = $('#invTotalsBox');
  if (el) el.innerHTML = `
    <div class="calc-result">
      <div class="r-row"><span class="r-label">${t('invSubtotal')}</span><span class="r-val" style="font-size:14px">${money(items)} ${t('rial')}</span></div>
      <div class="r-row"><span class="r-label">${t('invLabor')}</span><span class="r-val" style="font-size:14px">${money(labor)} ${t('rial')}</span></div>
      ${disc ? `<div class="r-row"><span class="r-label">${t('invDiscount')}</span><span class="r-val" style="font-size:14px">−${money(disc)} ${t('rial')}</span></div>` : ''}
      <div class="r-row"><span class="r-label"><b>${t('invGrand')}</b></span><span class="r-val">${money(grand)} ${t('rial')}</span></div>
      ${paid ? `<div class="r-row"><span class="r-label">${t('invPaid')}</span><span class="r-val" style="font-size:14px;color:var(--ok)">${money(paid)} ${t('rial')}</span></div>
      <div class="r-row"><span class="r-label"><b>${t('invBalance')}</b></span><span class="r-val" style="color:${grand - paid > 0 ? 'var(--danger)' : 'var(--ok)'}">${money(Math.max(0, grand - paid))} ${t('rial')}</span></div>` : ''}
    </div>`;
}
function invPickPart() {
  const opts = state.parts.map(p => `
    <div class="row-item" style="margin-bottom:7px" onclick="invUsePart('${p.id}')">
      <div class="row-body"><strong style="font-size:13.5px">${esc(p.name)}</strong>
      <span class="sub">${t('partQty')}: ${faNum(p.qty)} ${esc(p.unit)} · ${money(p.price)} ${t('rial')}</span></div>
    </div>`).join('');
  openModal(`
    <div class="modal-head"><h3>📦 ${t('invAddPart')}</h3><button class="icon-btn" onclick="invBackToForm()">✕</button></div>
    <div class="modal-body">${opts || `<p style="color:var(--text-3)">${t('noParts')}</p>`}</div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="invBackToForm()">${t('cancel')}</button></div>`);
}
function invUsePart(partId) {
  const p = state.parts.find(x => x.id === partId);
  if (!p) return;
  invDraft.items.push({ desc: p.name, qty: 1, price: p.price || 0, partId: p.id });
  invDraft.consumedParts.push({ partId: p.id });
  invBackToForm();
}
function invBackToForm() { openInvoiceForm(invDraft.editingId, null, true); }

function openInvoiceForm(id, presetProject, keepDraft) {
  const inv = id ? state.invoices.find(x => x.id === id) : null;
  if (!keepDraft) {
    invDraft = {
      editingId: id || null,
      items: inv ? JSON.parse(JSON.stringify(inv.items || [])) : [],
      payments: inv ? JSON.parse(JSON.stringify(inv.payments || [])) : [],
      consumedParts: [], releasedParts: []
    };
  }
  const v = inv || { customer: '', projectId: presetProject || '', serviceId: '', date: Date.now(), labor: 0, discount: 0, note: '' };
  const dateTs = invDraft.dateOverride || v.date || Date.now();
  const laborVal = invDraft.laborOverride !== undefined ? invDraft.laborOverride : (v.labor || 0);
  const discountVal = invDraft.discountOverride !== undefined ? invDraft.discountOverride : (v.discount || 0);
  const noteVal = invDraft.noteOverride !== undefined ? invDraft.noteOverride : (v.note || '');
  const serviceOverride = invDraft.serviceOverride !== undefined ? invDraft.serviceOverride : v.serviceId;
  const svcOpts = state.services.slice(0, 40).map(s => `<option value="${s.id}" ${serviceOverride === s.id ? 'selected' : ''}>${esc(svcTarget(s))} — ${fmtDate(s.date)}</option>`).join('');
  openModal(`
    <div class="modal-head"><h3>${inv ? '✏️ ' + t('editInvoice') : '🧾 ' + t('newInvoice')}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field span2"><label>${t('invCustomer')} *</label><input id="inv_customer" value="${esc(invDraft.customerOverride !== undefined ? invDraft.customerOverride : v.customer)}" /></div>
        <div class="field"><label>${t('invDate')}</label>${jdateInput('inv_date', dateTs)}</div>
        <div class="field"><label>${t('diagSelProject')}</label><select id="inv_project">
          <option value="">—</option>
          ${state.projects.map(p => `<option value="${p.id}" ${(invDraft.projectOverride !== undefined ? invDraft.projectOverride : v.projectId) === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
        </select></div>
        <div class="field span2"><label>${t('invFromService')}</label><select id="inv_service">
          <option value="">—</option>${svcOpts}
        </select></div>
      </div>
      <div class="section-title" style="margin:8px 0 10px"><h3 style="font-size:14.5px">📋 ${t('invItems')}</h3></div>
      <p style="font-size:11.8px;color:var(--text-3);margin-bottom:9px">💡 ${t('invConsumeHint')}</p>
      <div id="invItemsBox">${invItemsHTML()}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        <button class="btn btn-ghost btn-sm" onclick="invAddItem()">${IC.plus} ${t('invAddItem')}</button>
        <button class="btn btn-ghost btn-sm" onclick="invPickPart()">📦 ${t('invAddPart')}</button>
      </div>
      <div class="form-grid">
        <div class="field"><label>${t('invLabor')}</label><input id="inv_labor" type="number" min="0" value="${laborVal}" /></div>
        <div class="field"><label>${t('invDiscount')}</label><input id="inv_discount" type="number" min="0" value="${discountVal}" /></div>
        <div class="field span2"><label>${t('invNote2')}</label><input id="inv_note" value="${esc(noteVal)}" /></div>
      </div>
      <div id="invTotalsBox"></div>
      ${invDraft.payments.length ? `
        <div class="section-title" style="margin:14px 0 8px"><h3 style="font-size:13.5px">💵 ${t('invPayments')}</h3></div>
        ${invDraft.payments.map((p, i) => `
          <div class="kv-cell" style="margin-bottom:6px;display:flex;align-items:center;gap:8px">
            <div style="flex:1"><div class="v" style="font-weight:600;font-size:13px">${money(p.amount)} ${t('rial')}</div>
            <div class="k">${fmtDate(p.date)}${p.note ? ' · ' + esc(p.note) : ''}</div></div>
            <button class="icon-btn" style="width:32px;height:32px" onclick="invDelPay(${i})">✕</button>
          </div>`).join('')}` : ''}
    </div>
    <div class="modal-foot">
      ${inv ? `<button class="btn btn-soft-danger" onclick="deleteInvoice('${inv.id}')">${IC.trash}</button>` : ''}
      ${inv ? `<button class="btn btn-ghost" style="color:#2AABEE" onclick="shareTelegram(buildInvoiceText(state.invoices.find(x=>x.id==='${inv.id}')))">${IC.telegram}</button>` : ''}
      ${inv ? `<button class="btn btn-ghost" onclick="printInvoice('${inv.id}')">${IC.print} ${t('invPrint')}</button>` : ''}
      <button class="btn btn-ghost" id="invPayBtn">💵 ${t('invAddPay')}</button>
      <button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn btn-primary" id="invSave">${inv ? t('save') : t('create')}</button>
    </div>`, { size: 'lg' });

  invWireItems();
  invRefreshTotals();
  $('#inv_labor').oninput = () => { invDraft.laborOverride = +$('#inv_labor').value || 0; invRefreshTotals(); };
  $('#inv_discount').oninput = () => { invDraft.discountOverride = +$('#inv_discount').value || 0; invRefreshTotals(); };
  $('#inv_note').oninput = () => { invDraft.noteOverride = $('#inv_note').value; };
  $('#inv_service').onchange = () => { invDraft.serviceOverride = $('#inv_service').value; };
  // keep field values across part-picker roundtrip
  ['inv_customer', 'inv_project'].forEach(fid => {
    const el = $('#' + fid);
    el.onchange = el.oninput = () => {
      if (fid === 'inv_customer') invDraft.customerOverride = el.value;
      else invDraft.projectOverride = el.value;
    };
  });
  $('#inv_date').addEventListener('change', () => { invDraft.dateOverride = jdateVal('inv_date') || Date.now(); });

  $('#invPayBtn').onclick = () => {
    openModal(`
      <div class="modal-head"><h3>💵 ${t('invAddPay')}</h3><button class="icon-btn" onclick="invBackToForm()">✕</button></div>
      <div class="modal-body">
        <div class="field"><label>${t('invPayAmount')} *</label><input id="pay_amount" type="number" min="1" /></div>
        <div class="field"><label>${t('invPayNote')}</label><input id="pay_note" /></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="invBackToForm()">${t('cancel')}</button>
        <button class="btn btn-primary" id="payOk">💵 ${t('invAddPay')}</button>
      </div>`, { size: 'sm' });
    let payConfirmedOver = false;
    $('#payOk').onclick = () => {
      const btn = $('#payOk');
      if (btn.disabled) return;
      const amount = Math.round(+$('#pay_amount').value || 0);
      if (amount <= 0) { toast(t('errGeneric'), 'err'); return; }
      // overpayment guard: compute balance from current draft
      const items = invDraft.items.reduce((a, it) => a + (Math.round(+it.qty || 0) * Math.round(+it.price || 0)), 0);
      const labor = Math.round(invDraft.laborOverride !== undefined ? +invDraft.laborOverride : 0);
      const disc = Math.round(invDraft.discountOverride !== undefined ? +invDraft.discountOverride : 0);
      const grand = Math.max(0, items + labor - disc);
      const paid = invDraft.payments.reduce((a, p) => a + (Math.round(+p.amount) || 0), 0);
      if (grand > 0 && paid + amount > grand && !payConfirmedOver) {
        payConfirmedOver = true;
        toast(t('payOverConfirm'), 'err');
        return; // second tap confirms
      }
      btn.disabled = true;
      invDraft.payments.push({ amount, note: $('#pay_note').value, date: Date.now() });
      invBackToForm();
    };
  };

  $('#invSave').onclick = async () => {
    const customer = $('#inv_customer').value.trim();
    if (!customer) { toast(t('requiredCustomer'), 'err'); return; }
    const body = {
      customer,
      projectId: $('#inv_project').value,
      serviceId: $('#inv_service').value,
      date: jdateVal('inv_date') || Date.now(),
      items: invDraft.items.filter(it => it.desc || it.price).map(it => ({
        desc: String(it.desc || ''), qty: Math.max(0, Math.round(+it.qty || 0)),
        price: Math.max(0, Math.round(+it.price || 0)), partId: it.partId || undefined
      })),
      labor: Math.max(0, Math.round(+$('#inv_labor').value || 0)),
      discount: Math.max(0, Math.round(+$('#inv_discount').value || 0)),
      note: $('#inv_note').value,
      payments: invDraft.payments
    };
    const btn = $('#invSave'); btn.disabled = true;
    try {
      let saved;
      if (inv) {
        const d = await api('/invoices/' + inv.id, { method: 'PUT', body });
        Object.assign(inv, d.item); saved = inv;
      } else {
        const d = await api('/invoices', { method: 'POST', body });
        state.invoices.unshift(d.item); saved = d.item;
      }
      // consume newly-added inventory parts (only once, on save)
      for (const cp of invDraft.consumedParts) {
        const it = body.items.find(x => x.partId === cp.partId);
        if (!it) continue;
        try {
          const d = await api('/parts-consume', { method: 'POST', body: { partId: cp.partId, qty: +it.qty || 1, projectId: body.projectId, note: t('invoice') + ' #' + saved.id.slice(0, 6).toUpperCase() } });
          const local = state.parts.find(x => x.id === cp.partId);
          if (local) Object.assign(local, d.part);
        } catch (e) {}
      }
      invDraft = null;
      closeModal(); toast(t('saved')); render();
    } catch (e) { toast(t('errGeneric'), 'err'); btn.disabled = false; }
  };
}
function invDelPay(i) {
  invDraft.payments.splice(i, 1);
  invBackToForm();
}
function deleteInvoice(id) {
  confirmDialog(t('confirmDeleteTitle'), t('confirmDeleteInvMsg'), async () => {
    const idx = state.invoices.findIndex(x => x.id === id);
    const [rm] = state.invoices.splice(idx, 1);
    invDraft = null;
    closeModal(); render();
    try { await api('/invoices/' + id, { method: 'DELETE' }); toast(t('deleted')); }
    catch (e) { state.invoices.splice(idx, 0, rm); toast(t('errGeneric'), 'err'); render(); }
  });
}
function printInvoice(id) {
  const inv = state.invoices.find(x => x.id === id);
  if (!inv) return;
  const st = state.settings || {};
  const tt = invTotals(inv);
  let sheet = document.getElementById('printSheet');
  if (!sheet) {
    sheet = document.createElement('div');
    sheet.id = 'printSheet';
    sheet.className = 'print-sheet';
    document.body.appendChild(sheet);
  }
  sheet.dir = I18N[LANG].dir;
  sheet.innerHTML = `
    <h1>🛗 ${esc(st.company || 'Z Lift')}</h1>
    <div class="ph-sub">${t('invoice')} — ${esc(st.phone || '')} ${st.address ? '· ' + esc(st.address) : ''}</div>
    <table>
      <tr><th>${t('invNo')}</th><td>${esc(inv.id.slice(0, 8).toUpperCase())}</td></tr>
      <tr><th>${t('invDate')}</th><td>${fmtDate(inv.date || inv.createdAt)}</td></tr>
      <tr><th>${t('invCustomer')}</th><td>${esc(inv.customer)}</td></tr>
      ${inv.projectId ? `<tr><th>${t('profile')}</th><td>${esc(projName(inv.projectId))}</td></tr>` : ''}
    </table>
    <table>
      <tr><th style="width:auto">${t('invDesc')}</th><th style="width:60px">${t('invQty')}</th><th style="width:120px">${t('invUnitPrice')}</th><th style="width:130px">${t('invRowTotal')}</th></tr>
      ${(inv.items || []).map(it => `<tr><td>${esc(it.desc)}</td><td>${faNum(it.qty)}</td><td>${money(it.price)}</td><td>${money((+it.qty || 0) * (+it.price || 0))}</td></tr>`).join('')}
      ${inv.labor ? `<tr><td colspan="3">${t('invLabor')}</td><td>${money(inv.labor)}</td></tr>` : ''}
      ${inv.discount ? `<tr><td colspan="3">${t('invDiscount')}</td><td>−${money(inv.discount)}</td></tr>` : ''}
      <tr><td colspan="3"><b>${t('invGrand')}</b></td><td><b>${money(tt.grand)} ${t('rial')}</b></td></tr>
      ${tt.paid ? `<tr><td colspan="3">${t('invPaid')}</td><td>${money(tt.paid)}</td></tr>
      <tr><td colspan="3"><b>${t('invBalance')}</b></td><td><b>${money(tt.balance)} ${t('rial')}</b></td></tr>` : ''}
    </table>
    ${inv.note ? `<p style="font-size:12px">${esc(inv.note)}</p>` : ''}
    <div class="sig-row">
      <div class="sig">${t('signTech')}</div>
      <div class="sig">${t('signCustomer')}</div>
    </div>`;
  window.print();
}


/* ================= GLOBAL SEARCH ================= */
function openGlobalSearch() {
  openModal(`
    <div class="modal-head"><h3>🔎 ${t('searchEverywhere')}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field" style="margin-bottom:10px">
        <input id="gsInput" placeholder="${t('globalSearch')}" autocomplete="off" style="font-size:16px" />
      </div>
      <div id="gsOut"><p style="font-size:12.5px;color:var(--text-3)">${t('searchEverywhere')} — ${t('srProjects')}، ${t('srServices')}، ${t('srParts')}، ${t('srNotes')}، ${t('srKb')}، ${t('srDiag')}، ${t('srInv')}، ${t('srCalc')}</p></div>
    </div>`, { size: 'lg' });
  const inp = $('#gsInput');
  inp.focus();
  inp.oninput = debounce(() => drawGlobalSearch(inp.value), 250);
}
function gsRow(icon, title, sub, onclick) {
  return `<div class="row-item" style="margin-bottom:7px" onclick="${onclick}">
    <div class="row-icon" style="background:var(--bg-soft);border:1px solid var(--border);font-size:17px;width:38px;height:38px">${icon}</div>
    <div class="row-body"><strong style="font-size:13.5px">${title}</strong><span class="sub">${sub}</span></div>
  </div>`;
}
function drawGlobalSearch(qRaw) {
  const q = qRaw.trim().toLowerCase();
  const out = $('#gsOut');
  if (q.length < 2) { out.innerHTML = `<p style="font-size:12.5px;color:var(--text-3)">…</p>`; return; }
  const S = [];
  const grp = (label, rows) => { if (rows.length) S.push(`<div class="nav-section" style="margin:10px 2px 6px">${label} (${faNum(rows.length)})</div>` + rows.join('')); };

  grp(t('srProjects'), state.projects
    .filter(p => (p.name + ' ' + p.customer + ' ' + p.location + ' ' + p.controller + ' ' + p.motor).toLowerCase().includes(q))
    .slice(0, 5).map(p => gsRow(p.elevatorType === 'hydraulic' ? '🛢️' : '⚙️', esc(p.name), esc(p.customer || p.location || ''), `closeModal();navigate('/projects/${p.id}')`)));

/* ================= CONTRACTS (monthly maintenance) ================= */
/* contract: { id, building, amount, startTs, months, projectId, note, paid: { 'jy-jm': true } } */
function ctMonthList(ct) {
  // list of {jy,jm,key,ts} for the contract duration
  const out = [];
  let { jy, jm } = tsToJalali(ct.startTs || ct.createdAt || Date.now());
  for (let i = 0; i < (ct.months || 12); i++) {
    out.push({ jy, jm, key: jy + '-' + jm, ts: jalaliToTs(jy, jm, 1) });
    jm++; if (jm > 12) { jm = 1; jy++; }
  }
  return out;
}
function ctStats(ct) {
  const now = Date.now();
  const list = ctMonthList(ct);
  const started = list.filter(m => m.ts <= now);
  const paidCount = list.filter(m => ct.paid && ct.paid[m.key]).length;
  const overdue = started.filter(m => !(ct.paid && ct.paid[m.key])).length;
  const active = list.length && list[list.length - 1].ts >= now && (list[0].ts <= now);
  const expired = list.length && list[list.length - 1].ts < now;
  return { list, paidCount, overdue, active, expired, total: list.length };
}
function renderContracts() {
  const c = $('#content');

  const curKey = nowJ.jy + '-' + nowJ.jm;

    if (cur) {
      expect += +ct.amount || 0;
      if (ct.paid && ct.paid[curKey]) collected += +ct.amount || 0;
    }
  });
  c.innerHTML = `

      <div class="card stat-card"><div class="stat-icon" style="background:var(--ok-soft);font-size:21px">💰</div>
        <div class="stat-body"><div class="stat-value" style="font-size:17px">${money(collected)} <span style="font-size:11px;color:var(--text-3)">${t('rial')}</span></div>

    </div>
    ${state.contracts.length ? state.contracts.map(ct => {

async function ctTogglePaid(ctId, key) {
  const ct = state.contracts.find(x => x.id === ctId);
  if (!ct) return;
  if (!ct.paid) ct.paid = {};
  if (ct.paid[key]) delete ct.paid[key];
  else ct.paid[key] = true;
  const box = $('#ctMonths');
  if (box) box.innerHTML = ctMonthsHTML(ct);
  try { await api('/contracts/' + ct.id, { method: 'PUT', body: { paid: ct.paid } }); }
  catch (e) { toast(t('errGeneric'), 'err'); }
}
function deleteContract(id) {
  confirmDialog(t('confirmDeleteTitle'), t('confirmDeleteCtMsg'), async () => {
    const idx = state.contracts.findIndex(x => x.id === id);
    const [rm] = state.contracts.splice(idx, 1);
    closeModal(); render();
    try { await api('/contracts/' + id, { method: 'DELETE' }); toast(t('deleted')); }
    catch (e) { state.contracts.splice(idx, 0, rm); toast(t('errGeneric'), 'err'); render(); }
  });
}

/* ================= SHARE (Telegram / system) ================= */
async function shareText(text) {
  try {
    if (navigator.share) { await navigator.share({ text }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  // fallback: copy to clipboard
  try {
    await navigator.clipboard.writeText(text);
    toast(t('shareCopied'));
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(t('shareCopied')); } catch (e2) {}
    ta.remove();
  }
}
function shareTelegram(text) {
  const url = 'https://t.me/share/url?url=' + encodeURIComponent('🛗 Z Lift') + '&text=' + encodeURIComponent(text);
  openExternal(url);
}

function validateBackup(bk) {
  if (!bk || typeof bk !== 'object') return { ok: false, why: 'format' };
  if (bk.app !== 'zlift') return { ok: false, why: 'app' };
  if (!Array.isArray(bk.projects)) return { ok: false, why: 'projects' };
  // structural checks on core collections (old backups may miss newer ones — fine)
  for (const k of ['projects', 'services', 'invoices', 'contracts', 'parts', 'notes', 'checklists']) {
    if (bk[k] !== undefined && !Array.isArray(bk[k])) return { ok: false, why: k };
  }
  // id sanity: every project/service must have a string id
  if (bk.projects.some(p => !p || typeof p.id !== 'string' || !p.id)) return { ok: false, why: 'project ids' };
  if (Array.isArray(bk.services) && bk.services.some(s => !s || typeof s.id !== 'string')) return { ok: false, why: 'service ids' };
  // prototype-pollution guard
  const poison = JSON.stringify(bk).includes('"__proto__"') || JSON.stringify(bk).includes('"constructor":{"prototype"');
  if (poison) return { ok: false, why: 'unsafe keys' };
  return { ok: true };
}

            if (safety) { await api('/backup', { method: 'PUT', body: { backup: safety } }); await loadAll(true); }

let _lsDB = null;
function _lsLoad() {
  if (_lsDB) return _lsDB;
  try { _lsDB = JSON.parse(localStorage.getItem('zlift_db')); } catch (e) { _lsDB = null; }
  if (!_lsDB || !_lsDB.users) {
    // primary lost — try the mirror before falling back to seed
    try {
      const mirror = JSON.parse(localStorage.getItem('zlift_db_mirror'));
      if (mirror && mirror.users && Array.isArray(mirror.projects)) {
        _lsDB = mirror;
        _lsSave();
      }
    } catch (e) {}
  }
  if (!_lsDB || !_lsDB.users) { _lsDB = _lsSeed(); _lsSave(); }
  if (!_lsDB.parts) _lsDB.parts = _lsSeed().parts;
  if (!_lsDB.settings) _lsDB.settings = { company: 'Z Lift', phone: '', address: '' };
  ['diagSessions', 'calcSaves', 'issues', 'tools', 'photos', 'invoices', 'contracts'].forEach(k => { if (!Array.isArray(_lsDB[k])) _lsDB[k] = []; });
  if (!_lsDB.schemaVersion) _lsDB.schemaVersion = 1;
  _lsMigrateServices();
  return _lsDB;
}

/* Migration: services = independent collection. Idempotent, no deletes, no duplicates. */
function _lsMigrateServices() {
  const db = _lsDB;
  if (!Array.isArray(db.services)) db.services = [];
  let changed = false;
  db.services.forEach(s => {
    if (s.customer === undefined) { s.customer = ''; changed = true; }
    if (s.elevatorInfo === undefined) { s.elevatorInfo = ''; changed = true; }
    if (s.projectId === undefined) { s.projectId = ''; changed = true; }
    if (s.projectId && (!s.customer || !s.elevatorInfo)) {
      const p = db.projects.find(x => x.id === s.projectId);
      if (p) {
        if (!s.customer && p.customer) { s.customer = p.customer; changed = true; }
        if (!s.elevatorInfo) { s.elevatorInfo = [p.name, p.elevatorType === 'hydraulic' ? 'هیدرولیک' : 'کششی'].filter(Boolean).join(' — '); changed = true; }
      } else { s.projectId = ''; changed = true; }
    }
  });
  db.projects.forEach(p => {
    if (Array.isArray(p.services) && p.services.length) {
      p.services.forEach(ns => {
        if (!db.services.find(x => x.id === ns.id)) {
          db.services.push(Object.assign({ projectId: p.id, customer: p.customer || '', elevatorInfo: p.name || '' }, ns));
        }
      });
      delete p.services;
      changed = true;
    }
  });
  if (changed) _lsSave();
}

let _lsMirrorTick = 0;
function _lsSave() {
  try {
    const raw = JSON.stringify(_lsDB);
    localStorage.setItem('zlift_db', raw);
    window._lsSaveFailed = false;
    // mirror copy every ~10th save (cheap data-loss protection against partial corruption)
    if (++_lsMirrorTick % 10 === 1) {
      try { localStorage.setItem('zlift_db_mirror', raw); } catch (e2) {}
    }
  }
  catch (e) {
    // storage full — warn loudly instead of silent data loss
    if (!window._lsSaveFailed) {
      window._lsSaveFailed = true;
      try { toast(t('storageFull'), 'err'); } catch (e2) { alert('Storage full! حافظه پر است — عکس‌های قدیمی را حذف و بکاپ بگیرید.'); }
    }
  }
}
function _lsUsage() {
  try {
    const raw = localStorage.getItem('zlift_db') || '';
    return { bytes: raw.length * 2, photos: (_lsDB && _lsDB.photos ? _lsDB.photos.length : 0) };
  } catch (e) { return { bytes: 0, photos: 0 }; }
}
function _lsErr(code, status) { const e = new Error(code); e.code = code; e.status = status || 400; return e; }

/* ---- OVERRIDES the server api() from app.js ---- */
async function api(path, opts = {}) {
  const db = _lsLoad();
  const method = (opts.method || 'GET').toUpperCase();
  const b = opts.body || {};
  const parts = path.split('?')[0].split('/').filter(Boolean);

  /* auth */
  if (path === '/auth/login' && method === 'POST') {
    const u = db.users.find(x => x.username === String(b.username || '').trim().toLowerCase());
    if (!u || u.password !== _lsHash(String(b.password || ''))) throw _lsErr('invalid_credentials', 401);
    const token = _lsUid() + _lsUid();
    db.sessions[token] = { userId: u.id, createdAt: Date.now() };
    _lsSave();
    return { token, user: { id: u.id, username: u.username, name: u.name, role: u.role } };
  }
  if (path === '/auth/register' && method === 'POST') {
    const username = String(b.username || '').trim().toLowerCase();
    if (!username || username.length < 3) throw _lsErr('bad_username');
    if (String(b.password || '').length < 6) throw _lsErr('weak_password');
    if (db.users.find(x => x.username === username)) throw _lsErr('username_taken', 409);
    const u = { id: _lsUid(), username, name: String(b.name || '').trim() || username, password: _lsHash(String(b.password)), role: 'technician', createdAt: Date.now() };
    db.users.push(u);
    const token = _lsUid() + _lsUid();
    db.sessions[token] = { userId: u.id, createdAt: Date.now() };
    _lsSave();
    return { token, user: { id: u.id, username: u.username, name: u.name, role: u.role } };
  }

  const sess = state.token && db.sessions[state.token];
  const me = sess ? db.users.find(u => u.id === sess.userId) : null;
  if (!me && !path.startsWith('/auth/')) { doLocalLogout(); throw _lsErr('unauthorized', 401); }

  if (path === '/auth/logout') { if (state.token) delete db.sessions[state.token]; _lsSave(); return { ok: true }; }
  if (path === '/auth/me') {
    if (!me) throw _lsErr('unauthorized', 401);
    return { user: { id: me.id, username: me.username, name: me.name, role: me.role } };
  }

  /* projects */
  if (path === '/projects' && method === 'GET') return { projects: [...db.projects].sort((a, c) => c.updatedAt - a.updatedAt) };
  if (path === '/projects' && method === 'POST') {
    if (!b.name || !String(b.name).trim()) throw _lsErr('name_required');
    const p = {
      id: _lsUid(), name: String(b.name).trim(), customer: String(b.customer || ''), phone: String(b.phone || ''),
      location: String(b.location || ''), elevatorType: b.elevatorType === 'hydraulic' ? 'hydraulic' : 'traction',
      capacityKg: +b.capacityKg || 0, persons: +b.persons || 0, floors: +b.floors || 0, stops: +b.stops || 0,
      speed: +b.speed || 0, controller: String(b.controller || ''), motor: String(b.motor || ''),
      drive: String(b.drive || ''), doorOperator: String(b.doorOperator || ''),
      roping: b.roping === '2:1' ? '2:1' : '1:1', encoder: String(b.encoder || ''), brake: String(b.brake || ''),
      status: b.status || 'contract', progress: Math.max(0, Math.min(100, +b.progress || 0)),
      serviceIntervalDays: +b.serviceIntervalDays || 0, notes: String(b.notes || ''),
      createdAt: Date.now(), updatedAt: Date.now()
    };
    db.projects.push(p); _lsSave();
    return { project: p };
  }
  if (parts[0] === 'projects' && parts[1]) {
    const p = db.projects.find(x => x.id === parts[1]);
    if (!p) throw _lsErr('not_found', 404);
    if (method === 'GET') return { project: p, services: db.services.filter(s => s.projectId === p.id), checklists: db.checklists.filter(c => c.projectId === p.id) };
    if (method === 'PUT') {
      ['name', 'customer', 'phone', 'location', 'elevatorType', 'controller', 'motor', 'drive', 'doorOperator', 'roping', 'encoder', 'brake', 'status', 'notes'].forEach(f => { if (b[f] !== undefined) p[f] = String(b[f]); });
      ['capacityKg', 'persons', 'floors', 'stops', 'speed', 'serviceIntervalDays'].forEach(f => { if (b[f] !== undefined) p[f] = +b[f] || 0; });
      if (b.progress !== undefined) p.progress = Math.max(0, Math.min(100, +b.progress || 0));
      if (p.elevatorType !== 'hydraulic') p.elevatorType = 'traction';
      p.updatedAt = Date.now(); _lsSave();
      return { project: p };
    }
    if (method === 'DELETE') {
      // services stay: independent module — detach optional reference
      db.services.forEach(s => {
        if (s.projectId === p.id) {
          if (!s.customer) s.customer = p.customer || p.name || '';
          if (!s.elevatorInfo) s.elevatorInfo = [p.name, p.location].filter(Boolean).join(' — ');
          s.projectId = '';
        }
      });
      db.projects = db.projects.filter(x => x.id !== p.id);
      db.checklists = db.checklists.filter(c => c.projectId !== p.id);
      _lsSave();
      return { ok: true };
    }
  }

  /* services */
  if (path === '/services' && method === 'GET') return { services: [...db.services].sort((a, c) => c.date - a.date) };
  if (path === '/services' && method === 'POST') {
    const projectId = b.projectId && db.projects.find(x => x.id === b.projectId) ? b.projectId : '';
    if (!projectId && !String(b.customer || '').trim()) throw _lsErr('customer_required');
    const s = {
      id: _lsUid(), projectId, customer: String(b.customer || ''), elevatorInfo: String(b.elevatorInfo || ''), date: +b.date || Date.now(),
      technician: String(b.technician || (me && me.name) || ''),
      serviceType: ['maintenance', 'repair', 'emergency', 'inspection'].includes(b.serviceType) ? b.serviceType : 'maintenance',
      complaint: String(b.complaint || ''), problem: String(b.problem || ''), diagnosis: String(b.diagnosis || ''),
      measurements: String(b.measurements || ''), workDone: String(b.workDone || ''), partsReplaced: String(b.partsReplaced || ''),
      recommendations: String(b.recommendations || ''), followUpDate: +b.followUpDate || 0,
      finalStatus: ['ok', 'followup', 'outoforder'].includes(b.finalStatus) ? b.finalStatus : 'ok',
      createdAt: Date.now()
    };
    db.services.push(s); _lsSave();
    return { service: s };
  }
  if (parts[0] === 'services' && parts[1]) {
    const s = db.services.find(x => x.id === parts[1]);
    if (!s) throw _lsErr('not_found', 404);
    if (method === 'PUT') {
      ['technician', 'customer', 'elevatorInfo', 'complaint', 'problem', 'diagnosis', 'measurements', 'workDone', 'partsReplaced', 'recommendations'].forEach(f => { if (b[f] !== undefined) s[f] = String(b[f]); });
      if (b.followUpDate !== undefined) s.followUpDate = +b.followUpDate || 0;
      if (b.projectId !== undefined) s.projectId = (b.projectId && db.projects.find(x => x.id === b.projectId)) ? b.projectId : '';
      if (b.date !== undefined) s.date = +b.date || s.date;
      if (b.serviceType && ['maintenance', 'repair', 'emergency', 'inspection'].includes(b.serviceType)) s.serviceType = b.serviceType;
      if (b.finalStatus && ['ok', 'followup', 'outoforder'].includes(b.finalStatus)) s.finalStatus = b.finalStatus;
      _lsSave();
      return { service: s };
    }
    if (method === 'DELETE') { db.services = db.services.filter(x => x.id !== s.id); _lsSave(); return { ok: true }; }
  }

  /* notes */
  if (path === '/notes' && method === 'GET') return { notes: [...db.notes].sort((a, c) => c.createdAt - a.createdAt) };
  if (path === '/notes' && method === 'POST') {
    if (!b.title || !String(b.title).trim()) throw _lsErr('title_required');
    const n = { id: _lsUid(), title: String(b.title).trim(), content: String(b.content || ''), tags: Array.isArray(b.tags) ? b.tags.map(String).slice(0, 10) : [], createdAt: Date.now() };
    db.notes.push(n); _lsSave();
    return { note: n };
  }
  if (parts[0] === 'notes' && parts[1]) {
    const n = db.notes.find(x => x.id === parts[1]);
    if (!n) throw _lsErr('not_found', 404);
    if (method === 'PUT') {
      if (b.title !== undefined) n.title = String(b.title);
      if (b.content !== undefined) n.content = String(b.content);
      if (Array.isArray(b.tags)) n.tags = b.tags.map(String).slice(0, 10);
      _lsSave();
      return { note: n };
    }
    if (method === 'DELETE') { db.notes = db.notes.filter(x => x.id !== n.id); _lsSave(); return { ok: true }; }
  }

  /* checklists */
  if (path === '/checklists' && method === 'GET') return { checklists: db.checklists };
  if (path === '/checklists' && method === 'POST') {
    if (!b.projectId || !b.templateId) throw _lsErr('bad_request');
    let c = db.checklists.find(x => x.projectId === b.projectId && x.templateId === b.templateId);
    if (!c) { c = { id: _lsUid(), projectId: b.projectId, templateId: String(b.templateId), checked: {}, updatedAt: Date.now() }; db.checklists.push(c); }
    if (b.checked && typeof b.checked === 'object') c.checked = b.checked;
    c.updatedAt = Date.now(); _lsSave();
    return { checklist: c };
  }

  /* parts */
  if (path === '/parts' && method === 'GET') return { parts: [...db.parts].sort((a, c) => a.name.localeCompare(c.name, 'fa')) };
  if (path === '/parts' && method === 'POST') {
    if (!b.name || !String(b.name).trim()) throw _lsErr('name_required');
    const part = { id: _lsUid(), name: String(b.name).trim(), category: String(b.category || 'عمومی'), unit: String(b.unit || 'عدد'), qty: +b.qty || 0, minQty: +b.minQty || 0, price: +b.price || 0, location: String(b.location || ''), note: String(b.note || ''), updatedAt: Date.now() };
    db.parts.push(part); _lsSave();
    return { part };
  }
  if (parts[0] === 'parts' && parts[1]) {
    const part = db.parts.find(x => x.id === parts[1]);
    if (!part) throw _lsErr('not_found', 404);
    if (method === 'PUT') {
      ['name', 'category', 'unit', 'location', 'note'].forEach(f => { if (b[f] !== undefined) part[f] = String(b[f]); });
      const prevQty = part.qty;
      ['qty', 'minQty', 'price'].forEach(f => { if (b[f] !== undefined) part[f] = Math.max(0, +b[f] || 0); });
      if (b.qty !== undefined && part.qty !== prevQty) {
        if (!Array.isArray(part.history)) part.history = [];
        part.history.unshift({ id: _lsUid(), qty: part.qty - prevQty, date: Date.now(), projectId: '', serviceId: '', note: 'adjustment', prevQty, newQty: part.qty });
        if (part.history.length > 100) part.history.length = 100;
      }
      part.updatedAt = Date.now(); _lsSave();
      return { part };
    }
    if (method === 'DELETE') { db.parts = db.parts.filter(x => x.id !== part.id); _lsSave(); return { ok: true }; }
  }



  /* generic collections */
  const GENERIC = ['diagSessions', 'calcSaves', 'issues', 'tools', 'photos', 'invoices', 'contracts'];
  if (parts[0] && GENERIC.includes(parts[0])) {
    const coll = db[parts[0]];
    if (!parts[1] && method === 'GET') return { items: [...coll].sort((a, c) => (c.createdAt || 0) - (a.createdAt || 0)) };
    if (!parts[1] && method === 'POST') {
      if (parts[0] === 'photos' && String(b.data || '').length > 2500000) throw _lsErr('too_large', 413);
      const item = Object.assign({}, b, { id: _lsUid(), createdAt: Date.now(), updatedAt: Date.now() });
      coll.push(item); _lsSave();
      return { item };
    }
    if (parts[1]) {
      const item = coll.find(x => x.id === parts[1]);
      if (!item) throw _lsErr('not_found', 404);
      if (method === 'PUT') {
        Object.keys(b).forEach(k => { if (k !== 'id' && k !== 'createdAt') item[k] = b[k]; });
        item.updatedAt = Date.now(); _lsSave();
        return { item };
      }
      if (method === 'DELETE') { db[parts[0]] = coll.filter(x => x.id !== item.id); _lsSave(); return { ok: true }; }
    }
  }

  /* parts consumption */
  if (path === '/parts-consume' && method === 'POST') {
    const part = db.parts.find(x => x.id === b.partId);
    if (!part) throw _lsErr('not_found', 404);
    const qty = Math.max(1, +b.qty || 1);
    part.qty = Math.max(0, part.qty - qty);
    part.updatedAt = Date.now();
    if (!Array.isArray(part.history)) part.history = [];
    const prevQ = part.qty + qty;
    part.history.unshift({ id: _lsUid(), qty: -qty, date: Date.now(), projectId: String(b.projectId || ''), serviceId: String(b.serviceId || ''), note: String(b.note || ''), prevQty: prevQ, newQty: part.qty });
    if (part.history.length > 100) part.history.length = 100;
    _lsSave();
    return { part };
  }

  /* backup / restore */
  if (path === '/backup' && method === 'GET') {
    return { backup: { app: 'zlift', version: 3, exportedAt: Date.now(),
      projects: db.projects, services: db.services, notes: db.notes,
      checklists: db.checklists, parts: db.parts, settings: db.settings,
      diagSessions: db.diagSessions, calcSaves: db.calcSaves, issues: db.issues, tools: db.tools, photos: db.photos, invoices: db.invoices, contracts: db.contracts } };
  }
  if (path === '/backup' && method === 'PUT') {
    const bk = b.backup || b;
    if (!bk || bk.app !== 'zlift' || !Array.isArray(bk.projects)) throw _lsErr('bad_backup');
    db.projects = bk.projects;
    db.services = Array.isArray(bk.services) ? bk.services : [];
    db.notes = Array.isArray(bk.notes) ? bk.notes : [];
    db.checklists = Array.isArray(bk.checklists) ? bk.checklists : [];
    db.parts = Array.isArray(bk.parts) ? bk.parts : [];
    if (bk.settings && typeof bk.settings === 'object') db.settings = bk.settings;
    ['diagSessions', 'calcSaves', 'issues', 'tools', 'photos', 'invoices', 'contracts'].forEach(k => { db[k] = Array.isArray(bk[k]) ? bk[k] : []; });
    _lsSave();
    return { ok: true };
  }

  /* settings */
  if (path === '/settings' && method === 'GET') return { settings: db.settings };
  if (path === '/settings' && method === 'PUT') {
    ['company', 'phone', 'address'].forEach(f => { if (b[f] !== undefined) db.settings[f] = String(b[f]); });
    _lsSave();
    return { settings: db.settings };
  }

  throw _lsErr('not_found', 404);
}

init();
</script>
  <script>
    /* PWA: service worker + install prompt */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
          function offer() { showUpdateBanner(); }
          if (reg.waiting && navigator.serviceWorker.controller) offer();
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              if ((nw.state === 'installed' || nw.state === 'activated') && navigator.serviceWorker.controller) offer();
            });
          });
        }).catch(() => {});
      });
    }
    function showUpdateBanner() {
      if (document.getElementById('updBanner')) return;
      const b = document.createElement('div');
      b.id = 'updBanner';
      b.style.cssText = 'position:fixed;bottom:14px;inset-inline:14px;z-index:500;background:#2563eb;color:#fff;padding:12px 16px;border-radius:14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.35);font-size:13.5px;font-weight:600';
      b.innerHTML = '<span style="flex:1">🔄 نسخه جدید Z Lift آماده است</span>';
      const btn = document.createElement('button');
      btn.textContent = 'بروزرسانی';
      btn.style.cssText = 'background:#fff;color:#2563eb;border:0;border-radius:9px;padding:8px 14px;font-weight:700;font-family:inherit;cursor:pointer';
      btn.onclick = () => {
        navigator.serviceWorker.getRegistration().then(reg => {
          if (reg && reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
        }).finally(() => setTimeout(() => location.reload(), 400));
      };
      b.appendChild(btn);
      document.body.appendChild(b);
    }
    let _deferredInstall = null;
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      _deferredInstall = e;
      const btn = document.getElementById('installBtn');
      if (btn) btn.classList.remove('hidden');
    });
    function promptInstall() {
      if (!_deferredInstall) return;
      _deferredInstall.prompt();
      _deferredInstall.userChoice.finally(() => {
        _deferredInstall = null;
        const btn = document.getElementById('installBtn');
        if (btn) btn.classList.add('hidden');
      });
    }
    window.addEventListener('appinstalled', () => {
      const btn = document.getElementById('installBtn');
      if (btn) btn.classList.add('hidden');
    });
  </script>
