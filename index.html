/* ================= SERVICE CALENDAR & REMINDERS ================= */
const REMINDER_META = {
  periodic: { key: 'reminderPeriodic', icon: '🔧', cls: 'b-teal' },
  followup: { key: 'reminderFollowup', icon: '🔎', cls: 'b-blue' },
  custom:   { key: 'reminderCustom', icon: '📌', cls: 'b-gray' }
};
let calState = { jy: 0, jm: 0 }; // initialized to current Jalali month on first render
let calSelDay = 0;                 // day highlighted in the grid (0 = none)

/* Pure derivation of every active reminder from projects + services + manual entries.
   periodic  → project.serviceIntervalDays elapsed since its last maintenance/repair
   followup  → service.followUpDate
   custom    → manual reminders stored in db.reminders (not done) */
function buildReminders() {
  const out = [];
  const DAY = 86400000;
  (state.projects || []).forEach(p => {
    if (!p.serviceIntervalDays) return;
    const info = dueInfo(p);
    if (!info) return;
    out.push({ id: 'per-' + p.id, kind: 'periodic', projectId: p.id, title: p.name,
      due: info.next, days: info.days, overdue: info.overdue, soon: info.soon, last: info.last, intervalDays: p.serviceIntervalDays });
  });
  (state.services || []).forEach(s => {
    if (!s.followUpDate) return;
    const days = Math.round((s.followUpDate - Date.now()) / DAY);
    out.push({ id: 'fu-' + s.id, kind: 'followup', serviceId: s.id, projectId: s.projectId,
      title: svcTarget(s), due: s.followUpDate, days, overdue: days < 0, soon: days >= 0 && days <= 7 });
  });
  (state.reminders || []).forEach(r => {
    if (r.done) return;
    const days = Math.round((r.due - Date.now()) / DAY);
    out.push({ id: 'rem-' + r.id, kind: r.kind === 'periodic' || r.kind === 'followup' ? r.kind : 'custom', reminderId: r.id, projectId: r.projectId || '',
      title: r.title, due: r.due, days, overdue: days < 0, soon: days >= 0 && days <= 7 });
  });
  return out.sort((a, b) => a.due - b.due);
}

function calCellsHTML() {
  const { jy, jm } = calState;
  const days = jalDaysInMonth(jy, jm);
  const firstTs = jalaliToTs(jy, jm, 1);
  const startCol = (new Date(firstTs).getDay() + 1) % 7; // Persian week starts Saturday
  const todayJ = tsToJalali(Date.now());
  // count services + reminders per day of the displayed month
  const dayCount = {};
  (state.services || []).forEach(s => {
    const j = tsToJalali(s.date);
    if (j.jy === jy && j.jm === jm) dayCount[j.jd] = (dayCount[j.jd] || 0) + 1;
  });
  buildReminders().forEach(r => {
    const j = tsToJalali(r.due);
    if (j.jy === jy && j.jm === jm) dayCount[j.jd] = (dayCount[j.jd] || 0) + 1;
  });
  let cells = '';
  for (let i = 0; i < startCol; i++) cells += '<span></span>';
  for (let d = 1; d <= days; d++) {
    const isToday = todayJ.jy === jy && todayJ.jm === jm && todayJ.jd === d;
    const isSel = calSelDay === d;
    const n = dayCount[d] || 0;
    cells += `<button class="cal-day ${isToday ? 'cal-today' : ''} ${isSel ? 'cal-sel' : ''}" data-d="${d}" onclick="calPickDay(${d})" aria-pressed="${isSel ? 'true' : 'false'}">
      <span class="cal-num">${faNum(d)}</span>
      ${n ? `<span class="cal-dot">${faNum(n)}</span>` : ''}
    </button>`;
  }
  return cells;
}

/* Critical-checklist safety gate: an explicit, recorded acknowledgement
   before safety-sensitive work. Dismissal returns to the checklist list.
   The ack is stored in sessionStorage (per browser session) and an entry
   is added to the offline safety log. */
function renderSafetyGate(tp, selectedProject, ackKey) {
  setTimeout(() => {
    const cb = document.getElementById('safetyAck');
    const btn = document.getElementById('safetyContinue');
    if (!cb || !btn) return;
    const sync = () => { btn.disabled = !cb.checked; };
    cb.addEventListener('change', sync); sync();
    btn.onclick = async () => {
      if (!cb.checked) return;
      try {
        const entry = {
          id: _lsUid(), checklistId: tp.id, projectId: selectedProject || '',
          ts: Date.now(), technician: (state.user && state.user.name) || '',
          appVersion: '27'
        };
        await api('/safetyLogs', { method: 'POST', body: entry });
        if (!Array.isArray(state.safetyLogs)) state.safetyLogs = [];
        state.safetyLogs.unshift(entry);
      } catch (e) { /* never block the technician on a log failure */ }
      try { sessionStorage.setItem(ackKey, '1'); } catch (e) {}
      navigate('/checklists/' + tp.id + (selectedProject ? '?project=' + selectedProject : ''));
    };
  }, 0);
  return `
    <button class="btn btn-ghost btn-sm" onclick="navigate('/checklists')" style="margin-bottom:14px">${IC.back} ${t('checklists')}</button>
    <div class="card" style="border:2px solid var(--danger);max-width:560px;margin:0 auto">
      <div class="card-title" style="color:var(--danger)">⚠️ ${t('safetyTitle')} — ${esc(tp.title[LANG] || tp.title.fa)}</div>

        <strong>${t('safetyCritical')}.</strong><br>
        ${esc(tp.desc[LANG] || tp.desc.fa)}

      <ul style="font-size:13.5px;line-height:1.9;padding-inline-start:20px;margin:0 0 14px">
        <li>${LANG === 'fa' ? 'همیشه قبل از کار، برق اصلی را قطع، قفل و برچسب‌گذاری کنید (LOTO) و بی‌برقی را تأیید کنید.' : 'Always isolate, lock out and tag out (LOTO) the main supply before work and verify zero energy.'}</li>
        <li>${LANG === 'fa' ? 'هیچ مدار ایمنی یا وسیلهٔ حفاظتی را پل، بای‌پس یا از کار نیندازید. تجهیز ناایمن باید خارج از سرویس بماند.' : 'Never bridge, bypass or defeat a safety circuit or protective device. Unsafe equipment must remain out of service.'}</li>
        <li>${LANG === 'fa' ? 'از دستورالعمل سازنده و مقررات محلی پیروی کنید؛ این اپ جای قضاوت تخصصی شما نیست.' : 'Follow manufacturer instructions and local regulations; this app does not replace professional judgment.'}</li>
      </ul>
      <label style="display:flex;gap:10px;align-items:flex-start;font-size:13.5px;cursor:pointer;margin-bottom:14px">
        <input type="checkbox" id="safetyAck" style="width:20px;height:20px;margin-top:2px" />
        <span>${t('safetyAck')}</span>
      </label>
      <div style="display:flex;gap:8px;justify-content:flex-end">

function renderChecklistDetail(idWithQuery) {
  const [tid, query] = idWithQuery.split('?');
  const params = new URLSearchParams(query || '');
  let selectedProject = params.get('project') || '';
  const tp = CHECKLIST_TEMPLATES.find(x => x.id === tid);
  const c = $('#content');
  if (!tp) {
    c.innerHTML = `<div class="empty"><div class="e-icon">🔍</div><strong>${t('notFound')}</strong><p>${t('notFoundSub')}</p>
      <button class="btn btn-primary" onclick="navigate('/checklists')">${t('checklists')}</button></div>`;
    return;
  }
  // Critical checklists require an explicit safety acknowledgement once per session
  if (tp.riskLevel === 'critical') {
    const ackKey = 'zlift_safety_ack_' + tp.id;
    if (!sessionStorage.getItem(ackKey)) {
      c.innerHTML = renderSafetyGate(tp, selectedProject, ackKey);
      return;
    }
  }
  const eligible = state.projects.filter(p => p.elevatorType === tp.type || tp.type === 'both');
  if (selectedProject && !eligible.find(p => p.id === selectedProject)) selectedProject = '';

  function getInst() {
    return selectedProject ? state.checklists.find(x => x.projectId === selectedProject && x.templateId === tid) : null;
  }

  /* 4-state items: undefined/false=blank, true|'pass'=pass, 'fail'=fail, 'na'=N/A */
  const stateOf = v => v === true || v === 'pass' ? 'pass' : v === 'fail' ? 'fail' : v === 'na' ? 'na' : 'blank';
  const nextState = { blank: 'pass', pass: 'fail', fail: 'na', na: 'blank' };
  const stIcon = { blank: '⬜', pass: '✅', fail: '❗', na: '➖' };
  let viewChecked = {}; // for no-project view mode

  function counts(checked) {
    const total = tp.groups.reduce((a, g) => a + g.items.length, 0);
    let pass = 0, fail = 0, na = 0;
    tp.groups.forEach(g => g.items.forEach(it => {
      const s = stateOf(checked[it.id]);
      if (s === 'pass') pass++; else if (s === 'fail') fail++; else if (s === 'na') na++;
    }));
    const done = pass + fail + na;
    return { total, pass, fail, na, done, pct: total ? Math.round(done / total * 100) : 0 };
  }

  function draw() {
    const inst = getInst();
    const checked = inst ? inst.checked : viewChecked;
    const cn = counts(checked);
    const failedItems = [];
    tp.groups.forEach(g => g.items.forEach(it => { if (stateOf(checked[it.id]) === 'fail') failedItems.push(it); }));

    c.innerHTML = `
      <button class="btn btn-ghost btn-sm" onclick="navigate('/checklists')" style="margin-bottom:14px">${IC.back} ${t('checklists')}</button>
      <div class="detail-head">
        <div class="grow">
          <h2 style="font-size:19px">${tp.kind === 'install' ? '🏗️' : '🔧'} ${esc(tp.title[LANG] || tp.title.fa)}</h2>
          <div class="sub">${typeBadge(tp.type)} ${inst ? `<span class="badge b-gray">${t('chLastUpdate')}: ${fmtDateTime(inst.updatedAt)}</span>` : ''}</div>
        </div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="field" style="margin-bottom:0">
          <label>${t('chSelectProject')}</label>
          <select id="chProject">
            <option value="">${t('chNoProject')}</option>
            ${eligible.map(p => `<option value="${p.id}" ${selectedProject === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="check-progress-wrap">

                <span><span class="ci-text" style="${s === 'na' ? 'text-decoration:line-through;color:var(--text-3)' : s === 'fail' ? 'color:var(--danger);font-weight:600' : ''}">${esc(it[LANG] || it.fa)}</span>${it.ref ? `<span class="ci-ref">📖 ${esc(it.ref)} · <b>${esc(it.verificationStatus || STANDARD_VERIFICATION.UNVERIFIED)}</b></span>` : ''}</span>
              </div>`;
            }).join('')}
          </div>`).join('')}

      </div>`;

    window._chCtx = { tid, selectedProject, tp, getInst, viewChecked };

      selectedProject = e.target.value;
      history.replaceState(null, '', '#/checklists/' + tid + (selectedProject ? '?project=' + selectedProject : ''));
      draw();
    };

    const save = debounce(async () => {
      const inst2 = getInst();
      if (!inst2) return;
      try { await api('/checklists', { method: 'POST', body: { projectId: selectedProject, templateId: tid, checked: inst2.checked } }); }
      catch (e) { toast(errMsg(e), 'err'); }
    }, 500);

    async function cycle(el) {
      const itemId = el.dataset.item;
      let store;
      if (selectedProject) {
        let inst2 = getInst();
        if (!inst2) {
          /* create the real record first, then keep its reference —
             state.checklists and the storage share the same array,
             so pushing a temporary object would poison the DB with a
             fake id ('tmp') that gets persisted. */
          try {
            const d = await api('/checklists', { method: 'POST', body: { projectId: selectedProject, templateId: tid, checked: {} } });
            inst2 = d.checklist;
            if (!state.checklists.includes(inst2)) state.checklists.push(inst2);
          } catch (e) {
            toast(errMsg(e), 'err');
            return;
          }
        }
        store = inst2.checked;
        inst2.updatedAt = Date.now();
      } else {
        store = viewChecked;
      }
      const cur = stateOf(store[itemId]);
      const nxt = nextState[cur];
      if (nxt === 'blank') delete store[itemId];
      else store[itemId] = nxt;
      // update this row in place
      const s = nxt;
      el.className = 'check-item ci-' + s;
      el.querySelector('.ci-state').textContent = stIcon[s];
      const txt = el.querySelector('.ci-text');
      txt.style.cssText = s === 'na' ? 'text-decoration:line-through;color:var(--text-3)' : s === 'fail' ? 'color:var(--danger);font-weight:600' : '';
      // update stats
      const cn2 = counts(store);
      $('#chStats').textContent = `✅ ${faNum(cn2.pass)} · ❗ ${faNum(cn2.fail)} · ➖ ${faNum(cn2.na)} — ${faNum(cn2.pct)}٪`;
      $('#chFill').style.width = cn2.pct + '%';
      // update failed box
      const failed = [];
      tp.groups.forEach(g => g.items.forEach(it => { if (stateOf(store[it.id]) === 'fail') failed.push(it); }));
      $('#chFailedBox').innerHTML = failed.length ? `
        <div class="card" style="border-inline-start:4px solid var(--danger);margin-bottom:14px">
          <div class="card-title" style="color:var(--danger);margin-bottom:8px">❗ ${t('chFailed')} (${faNum(failed.length)})</div>
          <ul style="padding-inline-start:20px;font-size:13.3px;color:var(--text-2)">${failed.map(it => `<li>${esc(it[LANG] || it.fa)}</li>`).join('')}</ul>
          ${selectedProject ? `<button class="btn btn-soft-danger btn-sm" style="margin-top:8px" onclick="chFailedToIssue('${tid}')">🔴 ${t('chFailToIssue')}</button>` : ''}
        </div>` : '';
      if (selectedProject) save();
    }

    c.querySelectorAll('.check-item[data-item]').forEach(el => {
      el.onclick = () => cycle(el);
      el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cycle(el); } };
    });
  }
  draw();
}

async function chFailedToIssue(tid) {
  const ctx = window._chCtx;
  if (!ctx || ctx.tid !== tid || !ctx.selectedProject) return;
  const inst = ctx.getInst();
  const checked = inst ? inst.checked : ctx.viewChecked;
  const stOf = v => v === true || v === 'pass' ? 'pass' : v === 'fail' ? 'fail' : v === 'na' ? 'na' : 'blank';
  const failed = [];
  ctx.tp.groups.forEach(g => g.items.forEach(it => { if (stOf(checked[it.id]) === 'fail') failed.push(it.fa); }));
  if (!failed.length) return;
  try {
    const d = await api('/issues', { method: 'POST', body: {
      title: (ctx.tp.title.fa || '') + ' — ' + faNum(failed.length) + ' ' + t('chFailed'),
      kind: 'open',
      projectId: ctx.selectedProject,
      note: failed.map((f, i) => faNum(i + 1) + '. ' + f).join('\n'),
      closed: false
    } });
    state.issues.unshift(d.item);
    toast(t('created'));
  } catch (e) { reportError(e, 'chFailedToIssue'); }
}

/* ================= CALCULATIONS ================= */
function computeCalc(cal) {
  const out = cal && $('#calcResult_' + cal.id);
  if (!cal || !out) return;                       // card not on screen — nothing to do
  const vals = {}, missing = [];
  cal.inputs.forEach(inp => {
    const el = $(`#calc_${cal.id}_${inp.id}`);
    const raw = el ? el.value : (inp.value != null ? inp.value : '');
    const parsed = parseNum(raw);
    if (parsed == null) missing.push(inp.label[LANG] || inp.label.fa || inp.id);
    else vals[inp.id] = parsed;
  });
  if (missing.length) {
    out.innerHTML = `<div class="error-box" style="padding:10px;margin-top:10px">⚠️ ${LANG === 'fa' ? 'ورودی‌های لازم را وارد کنید' : 'Enter the required inputs'}: ${esc(missing.join('، '))}</div>`;
    return;
  }
  try {
    const rows = cal.compute(vals);
    if (!Array.isArray(rows) || rows.some(r => !r || !r.label || r.val == null || /(?:NaN|Infinity)/.test(String(r.val)))) throw new Error('invalid-calculation');
    const inputLine = cal.inputs.map(inp => `${inp.id}=${vals[inp.id]}${inp.unit ? ' ' + inp.unit : ''}`).join(' · ');
    out.innerHTML = `<div class="calc-result">
      <div class="r-row"><span class="r-label">INPUTS</span><span class="r-val" style="font-size:12px">${esc(inputLine)}</span></div>
      <div class="r-row"><span class="r-label">FORMULA</span><span class="r-val" style="font-size:12px">${esc(cal.formula)}</span></div>
      <div class="r-row"><span class="r-label">CALCULATION</span><span class="r-val" style="font-size:12px">${esc(cal.formula + ' | ' + inputLine)}</span></div>
      ${rows.map(r => `<div class="r-row"><span class="r-label">RESULT · ${esc(r.label[LANG] || r.label.fa || r.label)}</span><span class="r-val">${esc(r.val)}</span></div>`).join('')}
      <div class="r-row"><span class="r-label">STATUS</span><span class="r-val" style="font-size:12px;color:var(--warn)">${esc(cal.resultClass)} · ENGINEERING VERIFICATION REQUIRED</span></div>
    </div>`;
  } catch (e) {
    out.innerHTML = `<div class="error-box" style="padding:10px;margin-top:10px">⚠️ ${LANG === 'fa' ? 'محاسبه با این ورودی‌ها معتبر نیست؛ ورودی‌ها و محدودیت‌ها را بررسی کنید.' : 'The calculation is invalid for these inputs; check inputs and limitations.'}</div>`;
  }
}

let diagFilter = { q: '', type: 'all' };
let diagSession = null; // { flowId, path:[nodeIds], current }

function renderDiagnostics() {
  const c = $('#content');
  if (diagSession) { renderDiagFlow(c); return; }
  c.innerHTML = `
    <div class="safety-banner"><span style="font-size:18px">⚠️</span><span>${t('diagSafety')}</span></div>

        <button class="chip ${diagFilter.type === 'traction' ? 'active' : ''}" data-t="traction">⚙️ ${t('traction')}</button>
        <button class="chip ${diagFilter.type === 'hydraulic' ? 'active' : ''}" data-t="hydraulic">🛢️ ${t('hydraulic')}</button>
      </div>
    </div>
    <p style="font-size:13px;color:var(--text-2);margin-bottom:14px">${t('diagPickSymptom')} — ${t('diagIntro')}</p>
    <div id="diagList"></div>`;
  $('#diagSearch').oninput = debounce(e => { diagFilter.q = e.target.value; drawDiagList(); }, 200);
  $$('#content .toolbar .chip[data-t]').forEach(ch => ch.onclick = () => { diagFilter.type = ch.dataset.t; renderDiagnostics(); });
  drawDiagList();
}
function flowSearchText(f) {
  let s = (f.symptom.fa || '') + ' ' + (f.symptom.en || '') + ' ' + (f.first ? f.first.fa : '');
  Object.values(f.nodes).forEach(n => {
    if (n.q) s += ' ' + n.q.fa;
    if (n.title) s += ' ' + n.title.fa;
    (n.causes || []).forEach(x => s += ' ' + x.fa);
    (n.parts || []).forEach(x => s += ' ' + x.fa);
  });
  return norm(s);
}
function drawDiagList() {
  const q = norm(diagFilter.q);
  let list = DIAG_FLOWS;
  if (diagFilter.type !== 'all') list = list.filter(d => d.type === 'both' || d.type === diagFilter.type);
  if (q) list = list.filter(d => flowSearchText(d).includes(q));
  const el = $('#diagList');
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="e-icon">🔍</div><strong>${t('notFound')}</strong><p>${t('notFoundSub')}</p></div>`;

  el.innerHTML = list.map(d => `

      <div class="row-body">

function _diagStepBackDom() {
  /* called by hardware back: one step back, or exit flow at first step */
  if (!diagSession) return;
  if (!diagSession.path.length) { diagSession = null; }
  else { diagSession.current = diagSession.path.pop(); }
  renderDiagnostics();
}
function startDiagFlow(id) {
  const f = DIAG_FLOWS.find(x => x.id === id);
  if (!f) return;
  diagSession = { flowId: id, path: [], current: f.start, evidence: [], startedAt: Date.now() };
  pushUiLayer('diag', _diagStepBackDom);
  renderDiagnostics();
  window.scrollTo(0, 0);
}
function _diagQuickObs(key, kind) {
  const f = DIAG_FLOWS.find(x => x.id === diagSession.flowId);
  const cur = f && f.nodes[diagSession.current];
  const q = cur && cur.q ? cur.q.fa : key;
  const txt = kind === 'ok'
    ? (LANG === 'fa' ? `تأیید شد: «${q}» نرمال است` : `Confirmed normal: "${q}"`)
    : (LANG === 'fa' ? `مشاهده غیرنرمال: «${q}»` : `Abnormal observation: "${q}"`);
  _diagEvidenceMark(kind, txt);
}
function _diagNoteObs() {
  const note = prompt(LANG === 'fa' ? 'ثبت یادداشت/اندازه‌گیری:' : 'Record a note/measurement:');
  if (note && note.trim()) _diagEvidenceMark('meas', note.trim());
}
function diagAnswer(nodeId, qText, aText) {
  if (!diagSession) return;                       // stale button after the flow was closed
  const f = DIAG_FLOWS.find(x => x.id === diagSession.flowId);
  if (!f || !f.nodes[nodeId]) return;
  // record answer in evidence trail
  if (qText) _diagEvidenceMark('hypo', (LANG === 'fa' ? 'پاسخ: ' : 'Answer: ') + qText + ' → ' + aText);
  diagSession.path.push(diagSession.current);
  diagSession.current = nodeId;
  pushUiLayer('diag', _diagStepBackDom);
  renderDiagnostics();
  window.scrollTo(0, 0);
}
function diagBack() {
  if (!diagSession) return;
  popTaggedLayer('diag');
  if (!diagSession.path.length) { diagSession = null; renderDiagnostics(); return; }
  diagSession.current = diagSession.path.pop();
  renderDiagnostics();
}
function diagExit() {
  while (popTaggedLayer('diag')) {}
  diagSession = null;
  renderDiagnostics();
}
function _diagEvidenceMark(kind, text) {
  if (!diagSession) return;
  diagSession.evidence = diagSession.evidence || [];
  diagSession.evidence.push({ kind, text: String(text || '').slice(0, 240), at: Date.now() });
  renderDiagnostics();
}

  if (!diagSession || !diagSession.evidence || !diagSession.evidence.length) return '';

        ${node.expectedResult ? `<div class="kv-cell" style="margin-bottom:9px;background:var(--ok-soft)"><div class="k">✅ EXPECTED RESULT</div><div class="v" style="font-weight:500">${esc(node.expectedResult.fa)}</div></div>` : ''}

/* Knowledge articles are retained, but their provenance is explicit. Embedded
   standard/clause claims are an UNVERIFIED index until an official source is
   attached; other general guidance is labelled ENGINEERING PRACTICE. */
const KNOWLEDGE_AUDIT_RECORDS = KNOWLEDGE.map(k => {
  const text = [k.summary && k.summary.fa, k.summary && k.summary.en, k.body && k.body.fa, k.body && k.body.en,
    k.what, k.where, k.safety, k.diag, ...(k.test || []), ...(k.inspect || [])].filter(Boolean).join(' ');
  const status = /EN\s*81|6303|ISIRI|§|استاندارد/i.test(text) ? 'UNVERIFIED' : 'ENGINEERING PRACTICE';
  k.verificationStatus = status;
  return { id: 'knowledge:' + k.id, title: k.title, source: null, edition: null, clause: null, verificationStatus: status };
});
let kbQuery = '';
let kbCat = 'all';
function kbSearchText(k) {
  let s = k.title.fa + ' ' + (k.title.en || '') + ' ' + k.summary.fa + ' ' + (k.summary.en || '') + ' ' + k.tags.join(' ');
  ['what', 'where', 'safety', 'diag'].forEach(f => { if (k[f]) s += ' ' + k[f]; });
  ['symptoms', 'inspect', 'test', 'causes', 'related'].forEach(f => { if (k[f]) s += ' ' + k[f].join(' '); });
  if (k.body) s += ' ' + (k.body.fa || '') + ' ' + (k.body.en || '');
  return norm(s);
}
function renderKnowledge() {
  const c = $('#content');
  c.innerHTML = `
    <div class="toolbar">
      <div class="search">${IC.search}<input id="kbSearch" placeholder="${t('searchKb')}" value="${esc(kbQuery)}" /></div>
      <div class="chip-row">
        ${KB_CATS.map(ct => `<button class="chip ${kbCat === ct.id ? 'active' : ''}" data-c="${ct.id}">${esc(ct[LANG] || ct.fa)}</button>`).join('')}
      </div>
    </div>
    <div id="kbList" class="grid-2"></div>`;
  $('#kbSearch').oninput = debounce(e => { kbQuery = e.target.value; drawKb(); }, 200);
  $$('#content .chip[data-c]').forEach(ch => ch.onclick = () => { kbCat = ch.dataset.c; renderKnowledge(); });
  drawKb();
}
function drawKb() {
  const q = norm(kbQuery);
  let list = KNOWLEDGE;
  if (kbCat !== 'all') list = list.filter(k => k.cat === kbCat);
  if (q) list = list.filter(k => kbSearchText(k).includes(q));
  const el = $('#kbList');
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="e-icon">🔍</div><strong>${t('notFound')}</strong><p>${t('notFoundSub')}</p></div>`;
    return;
  }
  el.innerHTML = list.map(k => `
    <div class="card kb-card" onclick="openKbArticle('${k.id}')">
      <h4><span style="font-size:20px">${k.icon}</span> ${esc(k.title[LANG] || k.title.fa)}</h4>
      <p>${esc(k.summary[LANG] || k.summary.fa)}</p>
      <div class="kb-tags">${k.tags.slice(0, 4).map(tg => `<span class="badge b-gray">${esc(tg)}</span>`).join('')}</div>
    </div>`).join('');
}
function kbSection(icon, titleKey, content) {
  if (!content || (Array.isArray(content) && !content.length)) return '';
  const body = Array.isArray(content)
    ? `<ul style="padding-inline-start:20px">${content.map(x => `<li style="margin-bottom:3px">${esc(x)}</li>`).join('')}</ul>`
    : `<p>${esc(content)}</p>`;
  return `<h4 style="display:flex;align-items:center;gap:7px">${icon} ${t(titleKey)}</h4>${body}`;
}
function kbOpenRelated(name) {
  const q = norm(name);
  const hit = KNOWLEDGE.find(k => hay(k.title.fa, k.title.en).includes(q)) ||
              KNOWLEDGE.find(k => kbSearchText(k).includes(q));

}

let noteQuery = '';
function renderNotes() {
  const c = $('#content');
  c.innerHTML = `

  $('#noteSearch').oninput = debounce(e => { noteQuery = e.target.value; drawNotes(); }, 200);

function drawNotes() {
  const q = norm(noteQuery);
  let list = state.notes;
  if (q) list = list.filter(n => hay(n.title, n.content, (n.tags || []).join(' ')).includes(q));
  const el = $('#noteList');
  if (!state.notes.length) {
    el.innerHTML = `<div class="empty"><div class="e-icon">📝</div><strong>${t('noNotes')}</strong><p>${t('noNotesSub')}</p><button class="btn btn-primary" onclick="openNoteForm()">${IC.plus} ${t('newNote')}</button></div>`;
    return;
  }
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="e-icon">🔍</div><strong>${t('notFound')}</strong><p>${t('notFoundSub')}</p></div>`;
    return;
  }
  el.innerHTML = list.map(n => `
    <div class="card kb-card" onclick="openNoteForm('${n.id}')">
      <h4>📝 ${esc(n.title)}</h4>
      <p>${esc(n.content)}</p>
      <div class="kb-tags">
        ${n.tags.map(tg => `<span class="badge b-blue">#${esc(tg)}</span>`).join('')}
        <span class="badge b-gray">${fmtDate(n.createdAt)}</span>

function openNoteForm(id) {

  openModal(`
    <div class="modal-head"><h3>${n ? '✏️ ' + t('editNote') : '📝 ' + t('newNote')}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>

/* ================= MEASUREMENT ENGINE ================= */
function measurePanelHTML(prefix) {
  return `
    <div class="card" style="margin-top:14px">
      <div class="card-title" style="margin-bottom:8px">📐 ${t('measures')}</div>
      <p style="font-size:11.8px;color:var(--text-3);margin-bottom:10px">${t('measNote')}</p>
      <div class="form-grid">
        ${MEASURE_FIELDS.map(f => `
          <div class="field" style="margin-bottom:8px">
            <label>${esc(f.fa)} <span style="color:var(--text-3);direction:ltr;display:inline-block">(${f.unit})</span></label>
            <input type="number" step="any" id="${prefix}_${f.id}" placeholder="—" />
          </div>`).join('')}
      </div>
      <button class="btn btn-ghost btn-sm" id="${prefix}_evalBtn">🧪 ${t('measCheck')}</button>
      <div id="${prefix}_evalOut"></div>
    </div>`;
}
function collectMeasures(prefix) {
  const out = [];
  MEASURE_FIELDS.forEach(f => {
    const el = $('#' + prefix + '_' + f.id);
    if (el && el.value !== '') out.push({ id: f.id, label: f.fa, value: parseFloat(el.value), unit: f.unit });
  });
  return out;
}
function evalMeasures(list, context) {
  /* Legacy diagnostic measurement panel now delegates to the same conservative
     engine as the measurement history. No duplicate hard-coded EN thresholds. */
  const ctx = context && typeof context === 'object' ? context : {};
  return (Array.isArray(list) ? list : []).map(entry => {
    const f = MEASURE_FIELDS_BY_ID[entry.id];
    const res = evalMeasurement({ typeId: entry.id, value: entry.value, context: ctx });
    const reason = res.reason && (res.reason[LANG] || res.reason.fa || res.reason.en);
    const statusLabel = MEAS_STATUS_META[res.status] ? t(MEAS_STATUS_META[res.status].key) : t('measStatusUnknown');
    return {
      ok: res.status === 'normal' ? true : (res.status === 'unknown' ? null : false),
      status: res.status,
      verificationStatus: res.thresholdClass || (f && f.thresholdClass) || THRESHOLD_CLASS.UNKNOWN,
      text: `${f ? (f[LANG] || f.fa) : entry.id}: ${faNum(entry.value)}${f && f.unit ? ' ' + f.unit : ''} — ${statusLabel}${reason ? ' · ' + reason : ''}`
    };
  });
}
function wireMeasurePanel(prefix) {
  const btn = $('#' + prefix + '_evalBtn');
  if (!btn) return;
  btn.onclick = () => {
    const list = collectMeasures(prefix);
    const msgs = evalMeasures(list);
    $('#' + prefix + '_evalOut').innerHTML = msgs.length
      ? `<div class="calc-result" style="margin-top:10px">${msgs.map(m => `<div class="r-row"><span class="r-label" style="font-size:12.8px">${m.status === 'normal' ? '✅' : m.status === 'critical' ? '⛔' : m.status === 'attention' ? '⚠️' : '❔'} ${esc(m.text)} · ${esc(m.verificationStatus)}</span></div>`).join('')}</div>`
      : `<p class="calc-note">—</p>`;
  };
}

function photoCats() { return t('photoCats').split('|'); }
/* only allow safe raster data-URIs — blocks javascript:/svg vectors from malicious backups */
/* 1×1 transparent PNG shown until an IndexedDB-backed photo hydrates */
const PHOTO_PLACEHOLDER = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNsaGj4DwAFhAJ/wlseKgAAAABJRU5ErkJggg==';
function safePhotoSrc(d) {
  return (typeof d === 'string' && /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(d)) ? d : '';
}
function openPhotoForm(presetProject) {
  const cats = photoCats();
  openModal(`
    <div class="modal-head"><h3>📷 ${t('addPhoto')}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>${t('photoCat')}</label><select id="ph_cat">${cats.map(x => `<option>${esc(x)}</option>`).join('')}</select></div>
      <div class="field"><label>${t('diagSelProject')}</label><select id="ph_project">
        <option value="">—</option>
        ${state.projects.map(p => `<option value="${p.id}" ${presetProject === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
      </select></div>
      <div class="field"><label>${t('prNotes')}</label><input id="ph_note" /></div>
      <input type="file" id="ph_file" accept="image/*" capture="environment" style="width:100%" />
      <div id="ph_preview" style="margin-top:10px"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn btn-primary" id="phSave" disabled>💾 ${t('save')}</button>
    </div>`);
  let dataUrl = '';
  $('#ph_file').onchange = () => {
    const file = $('#ph_file').files[0];
    if (!file) return;
    const img = new Image();
    const fr = new FileReader();
    fr.onerror = () => toast(t('photoReadFailed'), 'err');
    img.onerror = () => { dataUrl = ''; $('#phSave').disabled = true; toast(t('photoReadFailed'), 'err'); };
    fr.onload = () => {
      img.onload = () => {
        // downscale to max 1280px to keep storage sane
        const max = 1280;
        let { width: w, height: h } = img;
        if (w > max || h > max) { const k = Math.min(max / w, max / h); w = Math.round(w * k); h = Math.round(h * k); }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        dataUrl = cv.toDataURL('image/jpeg', 0.75);
        if (dataUrl.length > 2000000) { toast(t('photoTooLarge'), 'err'); dataUrl = ''; return; }
        $('#ph_preview').innerHTML = `<img src="${dataUrl}" style="max-width:100%;border-radius:12px;border:1px solid var(--border)" />`;
        $('#phSave').disabled = false;
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  };
  $('#phSave').onclick = guard('#phSave', async () => {
    if (!dataUrl) return;
    try {
      const d = await api('/photos', { method: 'POST', body: { data: dataUrl, cat: $('#ph_cat').value, projectId: $('#ph_project').value, note: $('#ph_note').value } });
      state.photos.unshift(d.item);
      closeModal(); toast(t('saved')); render();
    } catch (e) { toast(errMsg(e), 'err'); }
  });
}

/* ================= INVOICES ================= */
let invFilter = { q: '', status: 'all' };
let invDraft = null; // items being edited in the open form

function money(n) { return faNum((Math.round(+n || 0)).toLocaleString('en-US')); }
function invTotals(inv) {
  /* integer-safe: rials have no fractions; round every term to avoid FP drift.
     Tax is computed on the post-discount subtotal (items+labor-discount). */
  const items = (inv.items || []).reduce((a, it) => a + Math.round(+it.qty || 0) * Math.round(+it.price || 0), 0);
  const labor = Math.round(+inv.labor || 0);
  const discount = Math.round(+inv.discount || 0);
  const base = Math.max(0, items + labor - discount);
  const taxRate = inv.taxExempt ? 0 : Math.max(0, Math.min(100, Math.round(+inv.taxRate || 0)));
  const tax = Math.round(base * taxRate / 100);
  const grand = base + tax;
  const paid = (inv.payments || []).reduce((a, p) => a + (Math.round(+p.amount) || 0), 0);
  return { items, labor, discount, base, tax, taxRate, grand, paid, balance: Math.max(0, grand - paid), overpayment: Math.max(0, paid - grand) };
}
function invStatusMeta(inv) {
  const tt = invTotals(inv);
  if (tt.grand > 0 && tt.paid >= tt.grand) return { key: 'invPaidFull', cls: 'b-green', icon: '✅' };
  if (tt.paid > 0) return { key: 'invPartial', cls: 'b-amber', icon: '🟠' };
  return { key: 'invUnpaid', cls: 'b-red', icon: '🔴' };
}

function renderInvoices() {
  const c = $('#content');
  const month = Date.now() - 30 * 86400000;
  let incomeMonth = 0, openBalance = 0;
  state.invoices.forEach(inv => {
    (inv.payments || []).forEach(p => { if (p.date >= month) incomeMonth += +p.amount || 0; });
    openBalance += invTotals(inv).balance;
  });
  c.innerHTML = `
    <div class="grid-2" style="margin-bottom:16px">
      ${'<div class="card stat-card"><div class="stat-icon" style="background:var(--ok-soft);font-size:21px">💰</div><div class="stat-body"><div class="stat-value" style="font-size:17px">' + money(incomeMonth) + ' <span style="font-size:11px;color:var(--text-3)">' + t('rial') + '</span></div><div class="stat-label">' + t('invTotalsMonth') + '</div></div></div>'}
      ${'<div class="card stat-card"><div class="stat-icon" style="background:var(--danger-soft);font-size:21px">🧾</div><div class="stat-body"><div class="stat-value" style="font-size:17px">' + money(openBalance) + ' <span style="font-size:11px;color:var(--text-3)">' + t('rial') + '</span></div><div class="stat-label">' + t('invOpenBalance') + '</div></div></div>'}
    </div>
    <div class="toolbar">
      <div class="search">${IC.search}<input id="invSearch" placeholder="${t('searchInvoices')}" value="${esc(invFilter.q)}" /></div>
      <div class="chip-row">
        <button class="chip ${invFilter.status === 'all' ? 'active' : ''}" data-s="all">${t('all')}</button>
        <button class="chip ${invFilter.status === 'unpaid' ? 'active' : ''}" data-s="unpaid">🔴 ${t('invUnpaid')}</button>
        <button class="chip ${invFilter.status === 'partial' ? 'active' : ''}" data-s="partial">🟠 ${t('invPartial')}</button>
        <button class="chip ${invFilter.status === 'paid' ? 'active' : ''}" data-s="paid">✅ ${t('invPaidFull')}</button>
      </div>
      <button class="btn btn-primary" onclick="openInvoiceForm()">${IC.plus} ${t('newInvoice')}</button>
    </div>
    <div id="invList"></div>`;
  $('#invSearch').oninput = debounce(e => { invFilter.q = e.target.value; drawInvList(); }, 200);
  $$('#content .chip[data-s]').forEach(ch => ch.onclick = () => { invFilter.status = ch.dataset.s; renderInvoices(); });
  drawInvList();
}
function drawInvList() {
  if (!$('#invList')) return;
  const q = norm(invFilter.q);
  let list = state.invoices;
  if (invFilter.status !== 'all') {
    list = list.filter(inv => {
      const m = invStatusMeta(inv);
      return (invFilter.status === 'paid' && m.key === 'invPaidFull') ||
             (invFilter.status === 'partial' && m.key === 'invPartial') ||
             (invFilter.status === 'unpaid' && m.key === 'invUnpaid');
    });
  }
  if (q) list = list.filter(inv => hay(inv.customer, inv.note, inv.projectId ? projName(inv.projectId) : '', (inv.items || []).map(i => i.desc).join(' ')).includes(q));
  const el = $('#invList');
  if (!state.invoices.length) {
    el.innerHTML = `<div class="empty"><div class="e-icon">🧾</div><strong>${t('noInvoices')}</strong><p>${t('noInvoicesSub')}</p><button class="btn btn-primary" onclick="openInvoiceForm()">${IC.plus} ${t('newInvoice')}</button></div>`;
    return;
  }
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="e-icon">🔍</div><strong>${t('notFound')}</strong><p>${t('notFoundSub')}</p></div>`;
    return;
  }
  paintList(el, list, inv => {
    const tt = invTotals(inv);

      <div class="row-icon" style="background:var(--bg-soft);border:1px solid var(--border);font-size:18px">🧾</div>

        <strong>${esc(inv.customer || '—')}${inv.projectId ? ' · ' + esc(projName(inv.projectId)) : ''}</strong>

      </div>
      <div class="row-side">
        <span class="badge ${m.cls}">${m.icon} ${t(m.key)}</span>
        <span class="date">${fmtDate(inv.date || inv.createdAt)} · #${esc((inv.id || '').slice(0, 6).toUpperCase())}</span>
      </div>
    </div>`;
  });
}

    </div>`).join('');
}
function invRefreshItems() {
  const box = $('#invItemsBox');
  if (box) { box.innerHTML = invItemsHTML(); invWireItems(); invRefreshTotals(); }
}
function invWireItems() {
  $$('#invItemsBox [data-if]').forEach(inp => {
    inp.oninput = () => {
      const it = invDraft.items[+inp.dataset.ix];
      if (!it) return;
      if (inp.dataset.if === 'desc') it.desc = inp.value;
      else it[inp.dataset.if] = +inp.value || 0;
      invRefreshTotals();
    };
  });
}
function invDelItem(i) {
  if (!invDraft) return;
  const it = invDraft.items[i];
  if (it && it.partId) {
    /* a row added in THIS editing session was never taken from stock yet —
       just cancel its pending consumption. Rows that came from the saved
       invoice did consume stock, so removing them gives the parts back. */
    const pend = it.rowKey ? invDraft.consumedParts.findIndex(c => c.rowKey === it.rowKey) : -1;
    if (pend >= 0) invDraft.consumedParts.splice(pend, 1);
    else if (+it.qty > 0) invDraft.releasedParts.push({ partId: it.partId, qty: Math.round(+it.qty) });
  }
  invDraft.items.splice(i, 1);
  invRefreshItems();
}
function invAddItem(item) {
  if (!invDraft) return;
  invDraft.items.push(item || { desc: '', qty: 1, price: 0 });
  invRefreshItems();
}
function invRefreshTotals() {
  if (!invDraft) return;
  const items = invDraft.items.reduce((a, it) => a + Math.round((+it.qty || 0) * (+it.price || 0)), 0);
  const labor = Math.round(+($('#inv_labor') && $('#inv_labor').value) || 0);
  const disc = Math.round(+($('#inv_discount') && $('#inv_discount').value) || 0);
  const rate = Math.max(0, Math.min(100, Math.round(+($('#inv_taxrate') && $('#inv_taxrate').value) || 0)));
  const exempt = ($('#inv_taxexempt') && $('#inv_taxexempt').checked) || invDraft.taxExempt;
  invDraft.taxRate = rate; invDraft.taxExempt = !!exempt;
  const base = Math.max(0, items + labor - disc);
  const tax = exempt ? 0 : Math.round(base * rate / 100);
  const grand = base + tax;
  const paid = (invDraft.payments || []).reduce((a, p) => a + Math.round(+p.amount || 0), 0);
  invDraft.taxAmount = tax;
  const el = $('#invTotalsBox');
  if (el) el.innerHTML = `
    <div class="calc-result">
      <div class="r-row"><span class="r-label">${t('invSubtotal')}</span><span class="r-val" style="font-size:14px">${money(items)} ${t('rial')}</span></div>
      <div class="r-row"><span class="r-label">${t('invLabor')}</span><span class="r-val" style="font-size:14px">${money(labor)} ${t('rial')}</span></div>
      ${disc ? `<div class="r-row"><span class="r-label">${t('invDiscount')}</span><span class="r-val" style="font-size:14px">−${money(disc)} ${t('rial')}</span></div>` : ''}
      ${tax ? `<div class="r-row"><span class="r-label">${t('invTax')} (${faNum(rate)}٪)</span><span class="r-val" style="font-size:14px">${money(tax)} ${t('rial')}</span></div>` : ''}
      <div class="r-row"><span class="r-label"><b>${t('invGrand')}</b></span><span class="r-val">${money(grand)} ${t('rial')}</span></div>
      ${paid ? `<div class="r-row"><span class="r-label">${t('invPaid')}</span><span class="r-val" style="font-size:14px;color:var(--ok)">${money(paid)} ${t('rial')}</span></div>
      <div class="r-row"><span class="r-label"><b>${t('invBalance')}</b></span><span class="r-val" style="color:${grand - paid > 0 ? 'var(--danger)' : 'var(--ok)'}">${money(Math.max(0, grand - paid))} ${t('rial')}</span></div>
      ${paid > grand ? `<div class="r-row"><span class="r-label"><b>${t('invOverpayment')}</b></span><span class="r-val" style="color:var(--warn)">${money(paid - grand)} ${t('rial')}</span></div>` : ''}` : ''}
    </div>`;
}

  invSyncDraftFromForm();
  const opts = state.parts.map(p => `
    <div class="row-item" style="margin-bottom:7px" onclick="invUsePart('${p.id}')">

  openModal(`

}
function invUsePart(partId) {
  const p = state.parts.find(x => x.id === partId);
  if (!p || !invDraft) return;
  const rowKey = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  invDraft.items.push({ desc: p.name, qty: 1, price: p.price || 0, partId: p.id, rowKey });
  invDraft.consumedParts.push({ partId: p.id, rowKey });
  invBackToForm();
}
function invBackToForm() {
  if (!invDraft) { closeModal(); return; }
  openInvoiceForm(invDraft.editingId, null, true);
}
/* copy the values currently typed in the form into the draft, so they survive
   a round-trip through the part-picker / payment sub-modal */
function invSyncDraftFromForm() {
  if (!invDraft) return;
  const g = id => $('#' + id);
  if (g('inv_customer')) invDraft.customerOverride = g('inv_customer').value;
  if (g('inv_project')) invDraft.projectOverride = g('inv_project').value;
  if (g('inv_service')) invDraft.serviceOverride = g('inv_service').value;
  if (g('inv_note')) invDraft.noteOverride = g('inv_note').value;
  if (g('inv_labor')) invDraft.laborOverride = Math.max(0, Math.round(+g('inv_labor').value || 0));
  if (g('inv_discount')) invDraft.discountOverride = Math.max(0, Math.round(+g('inv_discount').value || 0));
  if (g('inv_taxrate')) invDraft.taxRate = Math.max(0, Math.min(100, Math.round(+g('inv_taxrate').value || 0)));
  if (g('inv_taxexempt')) invDraft.taxExempt = !!g('inv_taxexempt').checked;
  const dt = jdateVal('inv_date');
  if (dt) invDraft.dateOverride = dt;
}

      projectId: $('#inv_project').value,

        response = await api('/invoices/' + inv.id, { method: 'PUT', body });
        Object.assign(inv, response.item); saved = inv;
      } else {
        response = await api('/invoices', { method: 'POST', body });
        if (!state.invoices.some(x => x.id === response.item.id)) state.invoices.unshift(response.item);
        saved = response.item;
      }
      /* Inventory effects are committed atomically by the data layer. Mirror the
         returned records into UI state; never issue a second consumption call. */
      (response.changedParts || []).forEach(changed => {
        const local = state.parts.find(x => x.id === changed.id);
        if (local) Object.assign(local, changed);
      });
      invDraft.consumedParts = [];

function invDelPay(i) {

function deleteInvoice(id) {
  const inv = state.invoices.find(x => x.id === id);
  const partRows = inv ? (inv.items || []).filter(it => it && it.partId) : [];
  const partTotals = {};
  partRows.forEach(it => { partTotals[it.partId] = (partTotals[it.partId] || 0) + Math.max(0, Math.round(+it.qty || 0)); });
  const partCount = Object.values(partTotals).reduce((a, b) => a + b, 0);
  const extra = partCount > 0
    ? (LANG === 'fa' ? `\n\n⚠️ این فاکتور شامل ${faNum(partCount)} عدد قطعه از انبار می‌باشد — با حذف فاکتور، موجودی قطعات مربوطه بازگردانده می‌شود.`
                    : `\n\n⚠️ This invoice consumed ${partCount} part(s) from inventory — deleting it will return them to stock.`)
    : '';
  confirmDialog(t('confirmDeleteTitle'), t('confirmDeleteInvMsg') + extra, async () => {
    const rb = optimisticRemove(state.invoices, id);
    invDraft = null;
    if (!rb) { closeModal(); return; }
    closeModal(); render();
    try {
      const response = await api('/invoices/' + id, { method: 'DELETE' });
      (response.changedParts || []).forEach(changed => {
        const local = state.parts.find(x => x.id === changed.id);
        if (local) Object.assign(local, changed);
      });
      toast(t('deleted'));
      render();
    }
    catch (e) { rb.restore(); toast(errMsg(e), 'err'); render(); }
  });
}

/* ================= CONTRACTS (monthly maintenance) ================= */
/* contract: { id, building, amount, startTs, months, projectId, note, paid: { 'jy-jm': true } } */
function ctStartTs(ct) { return +ct.startTs || +ct.createdAt || Date.now(); }
function ctMonthList(ct) {
  // list of {jy,jm,key,ts} for the contract duration
  const out = [];
  let { jy, jm } = tsToJalali(ctStartTs(ct));
  const months = Math.max(1, Math.min(120, Math.round(+ct.months || 12)));
  for (let i = 0; i < months; i++) {
    out.push({ jy, jm, key: jy + '-' + jm, ts: jalDayStart(jy, jm, 1) });
    jm++; if (jm > 12) { jm = 1; jy++; }
  }
  return out;
}
function ctStats(ct) {
  const now = Date.now();
  const list = ctMonthList(ct);
  const started = list.filter(m => m.ts <= now);
  const paidCount = list.filter(m => ct.paid && ct.paid[m.key]).length;
  const overdue = started.filter(m => !(ct.paid && ct.paid[m.key])).length;
  /* a contract runs until the END of its last month, not its first day */
  const last = list[list.length - 1];
  const endTs = last ? jalMonthRange(last.jy, last.jm).to : 0;
  const active = !!list.length && endTs > now && list[0].ts <= now;
  const expired = !!list.length && endTs <= now;

/* A bird's-eye view of the business over a selectable window (3 / 6 / 12 months).
   Everything is derived from existing collections — no new storage. */
let anPeriod = +localStorage.getItem('zlift_anperiod') || 12;
function anSetPeriod(n) { anPeriod = n; localStorage.setItem('zlift_anperiod', String(n)); renderAnalytics(); }
/* trailing Jalali month buckets, oldest -> newest */
function anBuckets(n) {
  const out = [];
  const now = tsToJalali(Date.now());
  let jy = now.jy, jm = now.jm;
  const keys = [];
  for (let i = 0; i < n; i++) { keys.push({ jy, jm }); jm--; if (jm < 1) { jm = 12; jy--; } }
  keys.reverse().forEach(({ jy, jm }) => {
    const { from, to } = jalMonthRange(jy, jm);
    out.push({ jy, jm, key: jy + '-' + jm, from, to });
  });
  return out;
}
/* compact axis label so 12 columns still fit a phone */
function anMonthShort(jm) { const m = jalMonth(jm); return m.length > 4 ? m.slice(0, 3) : m; }
/* horizontal bar chart from per-bucket values (scrolls on narrow screens) */
function anBarChart(buckets, values, bg) {
  const max = Math.max(1, ...values.map(v => +v || 0));
  const cols = buckets.map((b, i) => {
    const v = +values[i] || 0;
    return `<div class="chart-col">
      <span class="bar-num">${v ? faNum(v) : ''}</span>
      <div class="bar-v" style="height:${Math.round(v / max * 100)}%;background:${bg || 'linear-gradient(180deg,var(--accent-2),var(--accent))'}"></div>
      <span class="bar-lbl">${anMonthShort(b.jm)}</span>
    </div>`;
  }).join('');
  return `<div style="overflow-x:auto"><div class="chart-bars" style="min-width:${buckets.length * 34}px">${cols}</div></div>`;
}
/* status-bars from [{label,value,color}] */
function anStatusBars(rows, def) {
  const max = Math.max(1, ...rows.map(r => +r.value || 0));
  return `<div class="status-bars">${rows.map(r => {
    const v = +r.value || 0; if (!v) return '';
    return `<div class="sb-row"><span class="sb-lbl">${r.label}</span>
      <div class="sb-track"><div class="sb-fill" style="width:${Math.round(v / max * 100)}%;background:${r.color || def || 'var(--accent)'}"></div></div>
      <span class="sb-val">${faNum(v)}</span></div>`;
  }).join('')}</div>`;
}
function svcColor(k) { return { maintenance: 'var(--teal)', repair: 'var(--accent-2)', emergency: 'var(--danger)', inspection: 'var(--purple)' }[k] || 'var(--accent)'; }
function anWindow() {
  const buckets = anBuckets(anPeriod);
  const from = buckets[0].from, to = buckets[buckets.length - 1].to;
  const inPeriod = ts => ts >= from && ts < to;
  const keySet = new Set(buckets.map(b => b.key));
  return { buckets, inPeriod, keySet };
}

function buildAnalyticsText() {
  const { inPeriod } = anWindow();
  const svcs = state.services.filter(s => inPeriod(s.date));
  let income = state.invoices.reduce((a, inv) => a + (inv.payments || []).reduce((b, p) => b + (inPeriod(p.date) ? +p.amount || 0 : 0), 0), 0);
  const openBalance = state.invoices.reduce((a, inv) => a + invTotals(inv).balance, 0);

  return `📊 ${t('anTitle')} — ${faNum(anPeriod)} ${LANG === 'fa' ? 'ماه' : 'months'}\n🏢 ${co}\n\n💰 ${t('anIncome')}: ${money(income)} ${t('rial')}\n🔧 ${t('anServices')}: ${faNum(svcs.length)}\n📈 ${t('anAvgMonth')}: ${faNum(Math.round(svcs.length / anPeriod))}\n🧾 ${t('anBalance')}: ${money(openBalance)} ${t('rial')}\n\n🛗 Z Lift`;
}
function printAnalytics() {
  const { inPeriod } = anWindow();
  const svcs = state.services.filter(s => inPeriod(s.date));
  let income = state.invoices.reduce((a, inv) => a + (inv.payments || []).reduce((b, p) => b + (inPeriod(p.date) ? +p.amount || 0 : 0), 0), 0);
  const byType = {}; svcs.forEach(s => byType[s.serviceType] = (byType[s.serviceType] || 0) + 1);

    ${printHeader(t('anTitle') + ' — ' + subtitle)}
    <table>
      <tr><th>${t('anIncome')}</th><td>${money(income)} ${t('rial')}</td></tr>

      <tr><th>${t('anByType')}</th><td>${Object.keys(byType).map(k => t(svcMeta(k).key) + ' ' + faNum(byType[k])).join('، ') || '—'}</td></tr>
    </table>
    <table>
      <tr><th>${t('anTopFaults')}</th><th style="width:80px">${t('anCount')}</th></tr>
      ${topFaults.length ? topFaults.map(([lbl, n]) => `<tr><td>${esc(lbl)}</td><td>${faNum(n)}</td></tr>`).join('') : `<tr><td>—</td><td></td></tr>`}

function exportAnalyticsCsv() {
  const buckets = anBuckets(anPeriod);
  const head = [t('anPeriod'), t('anRevenue'), t('anServices')];
  const rows = buckets.map(b => {
    const svcN = state.services.filter(s => { const j = tsToJalali(s.date); return j.jy === b.jy && j.jm === b.jm; }).length;
    let inc = 0;
    state.invoices.forEach(inv => (inv.payments || []).forEach(p => { const j = tsToJalali(p.date); if (j.jy === b.jy && j.jm === b.jm) inc += +p.amount || 0; }));
    state.contracts.forEach(ct => { if (ct.paid && ct.paid[b.key]) inc += +ct.amount || 0; });
    return [jalMonth(b.jm) + ' ' + b.jy, inc, svcN];
  });
  downloadCsv('zlift-analytics-' + new Date().toISOString().slice(0, 10) + '.csv', head, rows);
  toast(t('saved'));
}

function measFormatVal(m) {

/* ================= SHARE (Telegram / system) ================= */
async function shareText(text) {
  try {
    if (navigator.share) { await navigator.share({ text }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  // fallback: copy to clipboard
  try {
    await navigator.clipboard.writeText(text);
    toast(t('shareCopied'));
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(t('shareCopied')); } catch (e2) {}
    ta.remove();
  }
}
function shareTelegram(text) {
  const url = 'https://t.me/share/url?url=' + encodeURIComponent('🛗 Z Lift') + '&text=' + encodeURIComponent(text);
  openExternal(url);
}
const TG_CHANNEL_URL = 'https://t.me/+_2n4QjG6XpsxZGY0';
function openTgChannel() { openExternal(TG_CHANNEL_URL); }
function openExternal(url) {
  /* window.open از داخل onclick هندلرهای inline در PWA standalone گاهی توسط
     WebView مسدود می‌شود؛ لینک واقعی می‌سازیم و کلیک می‌کنیم — قابل اعتمادتر است */
  try {
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 500);
  } catch (e) {
    try { window.open(url, '_blank'); } catch (e2) { location.href = url; }
  }
}

function validateBackup(bk) {
  if (!bk || typeof bk !== 'object') return { ok: false, why: 'format' };
  if (bk.app !== 'zlift') return { ok: false, why: 'app' };
  if (!Array.isArray(bk.projects)) return { ok: false, why: 'projects' };
  // version compatibility: accept v1 and v2 backups; anything newer warns
  const ver = +(bk.formatVersion || bk.version || 1);
  if (ver > BACKUP_FORMAT_VERSION) return { ok: false, why: 'future-version' };
  // structural checks on core collections (old backups may miss newer ones — fine)
  for (const k of ['projects', 'archivedProjects', 'services', 'invoices', 'contracts', 'parts', 'notes', 'checklists', 'measurements', 'safetyLogs', 'reminders', 'photos', 'diagSessions', 'calcSaves', 'issues', 'tools']) {
    if (bk[k] !== undefined && !Array.isArray(bk[k])) return { ok: false, why: k };
  }
  if (bk.settings !== undefined && (!bk.settings || typeof bk.settings !== 'object' || Array.isArray(bk.settings))) return { ok: false, why: 'settings' };
  if (bk.dbSchemaVersion != null && +bk.dbSchemaVersion > DB_SCHEMA_VERSION) return { ok: false, why: 'future-schema' };
  // ids must be non-empty strings and unique within every collection
  const idsByCollection = {};
  for (const k of ['projects', 'archivedProjects', 'services', 'invoices', 'contracts', 'parts', 'notes', 'checklists', 'measurements', 'safetyLogs', 'reminders', 'photos', 'diagSessions', 'calcSaves', 'issues', 'tools']) {
    if (!Array.isArray(bk[k])) continue;
    const seen = new Set();
    for (const row of bk[k]) {
      if (!row || typeof row !== 'object' || typeof row.id !== 'string' || !row.id) return { ok: false, why: k + ':id' };
      if (seen.has(row.id)) return { ok: false, why: k + ':duplicate-id' };
      seen.add(row.id);
    }
    idsByCollection[k] = seen;
  }
  // relationships may be empty (standalone/history records), but a non-empty
  // project link must resolve in the same backup.
  const projectIds = idsByCollection.projects || new Set();
  for (const k of ['services', 'invoices', 'contracts', 'checklists', 'measurements', 'reminders', 'photos', 'diagSessions', 'issues']) {
    for (const row of (bk[k] || [])) if (row.projectId && !projectIds.has(row.projectId)) return { ok: false, why: k + ':project-relation' };
  }
  for (const ph of (bk.photos || [])) {
    if (ph.data && !safePhotoSrc(ph.data)) return { ok: false, why: 'photos:data' };
    /* A portable backup cannot rely on an IndexedDB blob that exists only on
       the source device. Export must hydrate it before this validator accepts it. */
    if (ph.inIdb && !ph.data) return { ok: false, why: 'photos:missing-data' };
  }
  // prototype-pollution guard
  const serial = JSON.stringify(bk);
  const poison = serial.includes('"__proto__"') || serial.includes('"constructor":{"prototype"');
  if (poison) return { ok: false, why: 'unsafe keys' };
  return { ok: true, version: ver, counts: Object.fromEntries(Object.keys(idsByCollection).map(k => [k, idsByCollection[k].size])) };
}

      if (!v.ok) { toast(t('restoreBad') + (v.why ? ' (' + v.why + ')' : ''), 'err'); return; }
      // restore summary + explicit confirmation
      const colls = ['projects', 'services', 'invoices', 'contracts', 'parts', 'notes', 'photos', 'issues'];
      const summary = colls.map(k => Array.isArray(bk[k]) ? faNum(bk[k].length) + ' ' + (I18N[LANG][
        { projects: 'projects', services: 'services', invoices: 'invoices', contracts: 'contracts', parts: 'parts', notes: 'notes', photos: 'photos', issues: 'issues' }[k]
      ] || k) : '').filter(Boolean).join(' · ');
      confirmDialog(t('restoreConfirmTitle'), t('restoreConfirmMsg') + '\n' + t('restoreOf') + ': ' + summary, async () => {
        let safety = null;
        try {
          // 1) verified local safety snapshot of CURRENT data before overwrite
          const cur = await api('/backup');
          safety = cur.backup;
          if (STRUCTURED_DB.status().mode === 'indexedDB') {
            await STRUCTURED_DB.putBackup({ id: 'pre-restore-' + Date.now(), app: 'zlift-auto', version: BACKUP_FORMAT_VERSION, appVersion: APP_VERSION, dbSchemaVersion: DB_SCHEMA_VERSION, createdAt: Date.now(), kind: 'PRE_RESTORE', data: safety });
          } else {
            localStorage.setItem('zlift_pre_restore_backup', JSON.stringify(safety));
          }
          // 2) validated, staged, atomic restore
          const restored = await api('/backup', { method: 'PUT', body: { backup: bk } });
          if (!restored || !restored.verified) throw new Error('restore-not-verified');
          // 3) read-back verification
          await loadAll(true);
          if (!Array.isArray(state.projects) || state.projects.length !== bk.projects.length) throw new Error('restore-count-verification');
          closeModal();
          toast(t('restoreDone'));
          render();
        } catch (e) {
          // 4) rollback to the in-memory safety snapshot; never silently continue
          try {
            if (!safety) safety = JSON.parse(localStorage.getItem('zlift_pre_restore_backup') || 'null');
            if (safety) { await api('/backup', { method: 'PUT', body: { backup: safety } }); await loadAll(true); }
          } catch (e2) { console.error('[ZLift] restore rollback failed', e2); }
          reportError(e, 'restore');
          render();
        }
      });
      const yesBtn = $('#confirmYes');
      if (yesBtn) { yesBtn.textContent = t('yesRestore'); yesBtn.classList.remove('btn-danger'); yesBtn.classList.add('btn-primary'); }
    };
    reader.readAsText(file);
  };
}

let _lsDB = null;

/* ================= STRUCTURED INDEXEDDB STORE (v29) =================
   IndexedDB is the primary store for structured application records. The old
   localStorage database is treated as a read-only migration source once a
   verified migration completes; it is never silently deleted. Small UI/session
   preferences remain in localStorage.

   Current domain note: the existing UI models one project as one elevator
   profile. Both `projects` and `elevators` stores therefore carry a deliberate
   1:1 projection with the same stable id. This preserves today's API while
   leaving a clean relationship seam for a future multi-elevator project model.

   Migration is fail-safe and idempotent:
     DETECT → VALIDATE → COPY (one transaction) → VERIFY → MARK COMPLETE.
   Any failure leaves zlift_db/zlift_db_mirror untouched and activates the
   localStorage fallback for that browser session. */
const STRUCTURED_DB = (() => {
  const NAME = 'zlift-data';
  const VERSION = 3;
  const MIGRATION_VERSION = 1;
  const ARRAY_STORES = {
    projects: 'projects', archivedProjects: 'archivedProjects', services: 'services', notes: 'notes',
    checklists: 'checklists', parts: 'inventory', diagSessions: 'diagnostics', calcSaves: 'calculations',
    issues: 'issues', tools: 'tools', photos: 'photos', invoices: 'invoices', contracts: 'contracts',
    reminders: 'reminders', measurements: 'measurements', safetyLogs: 'safetyLogs', users: 'users'
  };
  const STORES = ['elevators', ...new Set(Object.values(ARRAY_STORES)), 'settings', 'backups', 'metadata'];
  let dbp = null;
  let readyPromise = null;
  let mode = 'pending';
  let lastError = '';

  function available() {
    try { return typeof indexedDB !== 'undefined' && indexedDB && typeof indexedDB.open === 'function'; }
    catch (e) { return false; }
  }
  function open() {
    if (!available()) return Promise.reject(new Error('idb-unavailable'));
    if (dbp) return dbp;
    dbp = new Promise((resolve, reject) => {
      let req;
      try { req = indexedDB.open(NAME, VERSION); } catch (e) { reject(e); return; }
      req.onupgradeneeded = () => {
        const db = req.result;
        STORES.forEach(name => {
          if (!db.objectStoreNames.contains(name)) db.createObjectStore(name, { keyPath: name === 'metadata' || name === 'settings' ? 'key' : 'id' });
        });
      };
      req.onsuccess = () => {
        const db = req.result;
        db.onversionchange = () => { try { db.close(); } catch (e) {} dbp = null; };
        resolve(db);
      };
      req.onerror = () => { dbp = null; reject(req.error || new Error('idb-open-failed')); };
      req.onblocked = () => { dbp = null; reject(new Error('idb-blocked')); };
    });
    return dbp;
  }
  function request(req) {
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('idb-request-failed'));
    });
  }
  function transaction(storeNames, modeName, work) {
    return open().then(db => new Promise((resolve, reject) => {
      let tx, result;
      try { tx = db.transaction(storeNames, modeName); result = work(tx); }
      catch (e) { reject(e); return; }
      tx.oncomplete = () => resolve(result);
      tx.onerror = () => reject(tx.error || new Error('idb-transaction-failed'));
      tx.onabort = () => reject(tx.error || new Error('idb-transaction-aborted'));
    }));
  }
  function stableValue(value) {
    if (Array.isArray(value)) return value.map(stableValue);
    if (value && typeof value === 'object') {
      const out = {};
      Object.keys(value).sort().forEach(k => { if (value[k] !== undefined) out[k] = stableValue(value[k]); });
      return out;
    }
    return value;
  }
  function fingerprint(value) {
    let h = 2166136261;
    const text = JSON.stringify(stableValue(value));
    for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(16) + ':' + text.length;
  }
  function aggregateFingerprint(db) {
    const canonical = {};
    Object.keys(ARRAY_STORES).sort().forEach(k => {
      canonical[k] = (db[k] || []).slice().sort((a, b) => String(a.id).localeCompare(String(b.id))).map(stableValue);
    });
    canonical.settings = stableValue(db.settings || {});
    canonical.sessions = stableValue(db.sessions || {});
    canonical.schemaVersion = +db.schemaVersion || DB_SCHEMA_VERSION;
    return fingerprint(canonical);

  if (!me && !path.startsWith('/auth/')) { doLocalLogout(); throw _lsErr('unauthorized', 401); }

  if (path === '/auth/logout') { if (state.token) delete db.sessions[state.token]; await _lsSave(); return { ok: true }; }
  if (path === '/auth/me') {
    if (!me) throw _lsErr('unauthorized', 401);
    return { user: { id: me.id, username: me.username, name: me.name, role: me.role } };
  }

  /* projects */
  if (path === '/projects' && method === 'GET') return { projects: [...db.projects].sort((a, c) => c.updatedAt - a.updatedAt) };
  if (path === '/projects' && method === 'POST') {
    if (!b.name || !String(b.name).trim()) throw _lsErr('name_required');
    const p = {
      id: _lsUid(), name: String(b.name).trim(), customer: String(b.customer || ''), phone: String(b.phone || ''),
      location: String(b.location || ''), elevatorType: b.elevatorType === 'hydraulic' ? 'hydraulic' : 'traction',
      capacityKg: +b.capacityKg || 0, persons: +b.persons || 0, floors: +b.floors || 0, stops: +b.stops || 0,
      speed: +b.speed || 0, nominalVoltage: +b.nominalVoltage || 0,
      voltageTolerance: b.voltageTolerance == null || b.voltageTolerance === '' ? null : Math.max(0, +b.voltageTolerance || 0),
      controller: String(b.controller || ''), motor: String(b.motor || ''),
      drive: String(b.drive || ''), doorOperator: String(b.doorOperator || ''),
      roping: b.roping === '2:1' ? '2:1' : '1:1', encoder: String(b.encoder || ''), brake: String(b.brake || ''),
      status: b.status || 'contract', progress: Math.max(0, Math.min(100, +b.progress || 0)),
      serviceIntervalDays: +b.serviceIntervalDays || 0, notes: String(b.notes || ''),
      createdAt: Date.now(), updatedAt: Date.now()
    };
    db.projects.push(p); await _lsSave();
    return { project: p };
  }
  if (parts[0] === 'projects' && parts[1]) {
    const p = db.projects.find(x => x.id === parts[1]);
    if (!p) throw _lsErr('not_found', 404);
    if (method === 'GET') return { project: p, services: db.services.filter(s => s.projectId === p.id), checklists: db.checklists.filter(c => c.projectId === p.id) };
    if (method === 'PUT') {
      ['name', 'customer', 'phone', 'location', 'elevatorType', 'controller', 'motor', 'drive', 'doorOperator', 'roping', 'encoder', 'brake', 'status', 'notes'].forEach(f => { if (b[f] !== undefined) p[f] = String(b[f]); });
      ['capacityKg', 'persons', 'floors', 'stops', 'speed', 'serviceIntervalDays', 'nominalVoltage'].forEach(f => { if (b[f] !== undefined) p[f] = +b[f] || 0; });
      if (b.voltageTolerance !== undefined) p.voltageTolerance = b.voltageTolerance == null || b.voltageTolerance === '' ? null : Math.max(0, +b.voltageTolerance || 0);

    }
    if (method === 'DELETE') {
      /* Historical technical records are NEVER destroyed with the project:

         service history stays logically connected to the correct elevator. */
      const pInfo = [p.name, p.customer, p.location].filter(Boolean).join(' — ');
      const stamp = (rec) => { if (!rec.projectInfo) rec.projectInfo = pInfo; rec.projectId = ''; };
      db.services.forEach(s => {
        if (s.projectId === p.id) {
          if (!s.customer) s.customer = p.customer || p.name || '';
          if (!s.elevatorInfo) s.elevatorInfo = [p.name, p.location].filter(Boolean).join(' — ');

        }

        if (Array.isArray(db[k])) db[k].forEach(r => { if (r && r.projectId === p.id) stamp(r); });
      });
      db.projects = db.projects.filter(x => x.id !== p.id);
      await _lsSave();
      return { ok: true };
    }
  }

  /* services */
  if (path === '/services' && method === 'GET') return { services: [...db.services].sort((a, c) => c.date - a.date) };
  if (path === '/services' && method === 'POST') {
    const projectId = b.projectId && db.projects.find(x => x.id === b.projectId) ? b.projectId : '';
    if (!projectId && !String(b.customer || '').trim()) throw _lsErr('customer_required');

    db.settings = db.settings || {};
    const seq = Math.max(1, (+db.settings.reportSeq || 0) + 1);
    db.settings.reportSeq = seq;
    const s = {
      id: _lsUid(), reportNo: 'SR-' + String(seq).padStart(4, '0'), projectId, customer: String(b.customer || ''), elevatorInfo: String(b.elevatorInfo || ''), date: +b.date || Date.now(),
      technician: String(b.technician || (me && me.name) || ''),
      serviceType: ['maintenance', 'repair', 'emergency', 'inspection'].includes(b.serviceType) ? b.serviceType : 'maintenance',
      complaint: String(b.complaint || ''), problem: String(b.problem || ''), diagnosis: String(b.diagnosis || ''),
      measurements: String(b.measurements || ''), workDone: String(b.workDone || ''), partsReplaced: String(b.partsReplaced || ''),
      partsUsed: normSvcParts(b.partsUsed),
      recommendations: String(b.recommendations || ''), followUpDate: +b.followUpDate || 0,
      finalStatus: ['ok', 'followup', 'outoforder'].includes(b.finalStatus) ? b.finalStatus : 'ok',
      signTech: String(b.signTech || ''), signCustomer: String(b.signCustomer || ''),

    };
    db.services.push(s); await _lsSave();
    return { service: s };
  }
  if (parts[0] === 'services' && parts[1]) {
    const s = db.services.find(x => x.id === parts[1]);
    if (!s) throw _lsErr('not_found', 404);
    if (method === 'PUT') {
      ['technician', 'customer', 'elevatorInfo', 'complaint', 'problem', 'diagnosis', 'measurements', 'workDone', 'partsReplaced', 'recommendations'].forEach(f => { if (b[f] !== undefined) s[f] = String(b[f]); });
      if (b.followUpDate !== undefined) s.followUpDate = +b.followUpDate || 0;
      if (b.projectId !== undefined) s.projectId = (b.projectId && db.projects.find(x => x.id === b.projectId)) ? b.projectId : '';
      if (b.date !== undefined) s.date = +b.date || s.date;

      if (b.finalStatus && ['ok', 'followup', 'outoforder'].includes(b.finalStatus)) s.finalStatus = b.finalStatus;
      if (b.signTech !== undefined) s.signTech = String(b.signTech || '');
      if (b.signCustomer !== undefined) s.signCustomer = String(b.signCustomer || '');
