<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<meta name="description" content="Z Lift — دستیار حرفه‌ای تکنسین آسانسور: مدیریت پروژه، گزارش سرویس، چک‌لیست EN 81-20، محاسبات، عیب‌یابی و فاکتور. کاملاً آفلاین." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<title>Z Lift — دستیار تکنسین آسانسور</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
/* ============ Z Lift — styles ============ */
:root {
  --font: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
  --accent: #2563eb;
  --accent-2: #3b82f6;
  --accent-soft: rgba(37, 99, 235, .12);
  --ok: #16a34a;
  --ok-soft: rgba(22, 163, 74, .12);
  --warn: #d97706;
  --warn-soft: rgba(217, 119, 6, .14);
  --danger: #dc2626;
  --danger-soft: rgba(220, 38, 38, .12);
  --purple: #7c3aed;
  --purple-soft: rgba(124, 58, 237, .12);
  --teal: #0d9488;
  --teal-soft: rgba(13, 148, 136, .12);
  --radius: 16px;
  --radius-sm: 10px;
  --sidebar-w: 264px;
}
html[data-theme="light"] {
  color-scheme: light;
  --bg: #f1f5f9;
  --bg-card: #ffffff;
  --bg-soft: #f8fafc;
  --bg-hover: #eef2f7;
  --border: #e2e8f0;
  --text: #0f172a;
  --text-2: #475569;
  --text-3: #94a3b8;
  --shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 4px 16px rgba(15, 23, 42, .05);
  --shadow-lg: 0 8px 32px rgba(15, 23, 42, .14);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b1220;
  --bg-card: #131c2e;
  --bg-soft: #182339;
  --bg-hover: #1d2a44;
  --border: #253550;
  --text: #e8eefa;
  --text-2: #aab9d0;
  --text-3: #8598b4;
  --shadow: 0 1px 3px rgba(0, 0, 0, .35), 0 6px 20px rgba(0, 0, 0, .25);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, .5);
  --accent-soft: rgba(59, 130, 246, .18);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  background: var(--bg);
  color: var(--text);
  font-size: 14.5px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
html[dir="ltr"] body { letter-spacing: .1px; }
.hidden { display: none !important; }
body.scroll-lock { overflow: hidden; }
.input-error, .input-error:focus { border-color: var(--danger) !important; box-shadow: 0 0 0 3px var(--danger-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:focus-visible, .icon-btn:focus-visible, .chip:focus-visible { outline-offset: 3px; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
::placeholder { color: var(--text-3); opacity: 1; }
a { color: var(--accent-2); text-decoration: none; }
a:hover { text-decoration: underline; }
::selection { background: var(--accent-soft); color: var(--text); }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
::-webkit-scrollbar-track { background: transparent; }
* { scrollbar-color: var(--border) transparent; scrollbar-width: thin; }
/* touch devices: no sticky hover effects after a tap — use a press state instead */
@media (hover: none) {
  .row-item:hover, .tile:hover, .kb-card:hover, .btn-primary:hover { transform: none; }
  .row-item:hover, .diag-q:hover, .check-item:hover, .parts-table tr:hover td { background: inherit; }
  .chip:hover { border-color: var(--border); color: var(--text-2); }
}
.row-item:active, .tile:active, .kb-card:active { transform: scale(.995); }
.btn:active { transform: translateY(1px); }
/* respect the OS "reduce motion" setting */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important; animation-iteration-count: 1 !important;
    transition-duration: .001ms !important; scroll-behavior: auto !important;
  }
}

/* ============ auth ============ */
.auth-wrap {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background:
    radial-gradient(700px 400px at 85% -10%, var(--accent-soft), transparent),
    radial-gradient(600px 400px at 0% 110%, var(--purple-soft), transparent),
    var(--bg);
}
.auth-card {
  width: 100%; max-width: 400px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 34px 30px 26px;
  box-shadow: var(--shadow-lg);
}
.auth-logo { text-align: center; margin-bottom: 22px; }
.auth-logo h1 { font-size: 26px; margin-top: 10px; letter-spacing: .5px; }
.auth-logo p { color: var(--text-2); font-size: 13px; }
.logo-badge {
  display: inline-flex; align-items: center; justify-content: center;
  filter: drop-shadow(0 6px 14px rgba(37, 99, 235, .35));
}
.auth-tabs {
  display: flex; background: var(--bg-soft); border: 1px solid var(--border);
  border-radius: 12px; padding: 4px; margin-bottom: 20px;
}
.auth-tabs button {
  flex: 1; border: 0; background: transparent; color: var(--text-2);
  padding: 9px; border-radius: 9px; font-size: 14px; font-weight: 600;
  transition: all .18s;
}
.auth-tabs button.active { background: var(--bg-card); color: var(--text); box-shadow: var(--shadow); }
.auth-error {
  background: var(--danger-soft); color: var(--danger);
  border-radius: var(--radius-sm); padding: 9px 13px; font-size: 13px; margin-bottom: 12px;
}
.auth-demo {
  margin-top: 18px; text-align: center; font-size: 12.5px; color: var(--text-3);
  border-top: 1px dashed var(--border); padding-top: 14px;
}
.auth-demo code {
  background: var(--bg-soft); border: 1px solid var(--border);
  padding: 2px 9px; border-radius: 7px; margin-inline-start: 6px; direction: ltr; display: inline-block;
}

/* ============ fields & buttons ============ */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; background: var(--bg-soft); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 13px; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent-2); box-shadow: 0 0 0 3px var(--accent-soft);
}
.field textarea { resize: vertical; min-height: 84px; }
.field .hint { font-size: 12px; color: var(--text-3); margin-top: 4px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.form-sep {
  font-size: 12px; font-weight: 800; color: var(--text-3); letter-spacing: .4px;
  margin: 4px 0 12px; padding-bottom: 6px; border-bottom: 1px dashed var(--border);
}
.form-sep:first-child { margin-top: 0; }
.form-grid .span2 { grid-column: span 2; }
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } .form-grid .span2 { grid-column: span 1; } }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 1.5px solid transparent; border-radius: var(--radius-sm);
  padding: 9px 18px; font-size: 14px; font-weight: 600;
  transition: all .15s; white-space: nowrap;
}
.btn svg { flex-shrink: 0; }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(37, 99, 235, .3); }
.btn-primary:hover { background: var(--accent-2); transform: translateY(-1px); }
.btn-primary:disabled { opacity: .6; transform: none; cursor: wait; }
.btn-ghost { background: transparent; color: var(--text-2); border-color: var(--border); }
.btn-ghost:hover { background: var(--bg-hover); color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { filter: brightness(1.08); }
.btn-soft-danger { background: var(--danger-soft); color: var(--danger); }
.btn-soft-danger:hover { background: var(--danger); color: #fff; }
.btn-block { width: 100%; }
.btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-2); transition: all .15s; font-size: 13px; font-weight: 700;
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text); }

/* ============ app layout ============ */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--bg-card); border-inline-end: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
  z-index: 40;
}
.sidebar-head {
  display: flex; align-items: center; gap: 11px;
  padding: 20px 18px 16px; border-bottom: 1px solid var(--border);
}
.logo-text { display: flex; flex-direction: column; line-height: 1.35; }
.logo-text strong { font-size: 17px; letter-spacing: .4px; }
.logo-text span { font-size: 11px; color: var(--text-3); }
.sidebar-close { display: none; margin-inline-start: auto; }

.nav { flex: 1; overflow-y: auto; padding: 12px 12px; }
.nav-section { font-size: 11px; font-weight: 700; color: var(--text-3); margin: 14px 10px 6px; text-transform: uppercase; letter-spacing: .8px; }
.nav-item {
  display: flex; align-items: center; gap: 11px;
  width: 100%; border: 0; background: transparent; color: var(--text-2);
  padding: 10px 12px; border-radius: 11px; font-size: 14px; font-weight: 500;
  transition: all .14s; text-align: start; margin-bottom: 2px;
}
.nav-item svg { flex-shrink: 0; opacity: .85; }
.nav-item:hover { background: var(--bg-hover); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent-2); font-weight: 700; }
.sidebar-foot { border-top: 1px solid var(--border); padding: 12px; }
.user-chip { display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px;
}
.user-meta { flex: 1; min-width: 0; line-height: 1.35; }
.user-meta strong { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-meta span { font-size: 11.5px; color: var(--text-3); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 13px;
  padding: 14px 26px; position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.menu-btn { display: none; }
.page-title { font-size: 19px; font-weight: 800; flex: 1; }
.topbar-actions { display: flex; gap: 8px; }
.content { padding: 24px 26px 60px; max-width: 1180px; width: 100%; margin: 0 auto; }

.backdrop {
  display: none; position: fixed; inset: 0; z-index: 35;
  background: rgba(2, 6, 23, .5); backdrop-filter: blur(2px);
}
@media (max-width: 960px) {
  .sidebar {
    position: fixed; inset-inline-start: 0; top: 0; bottom: 0;
    transform: translateX(100%); transition: transform .25s ease;
    box-shadow: var(--shadow-lg);
  }
  html[dir="ltr"] .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0) !important; }
  .backdrop.show { display: block; }
  .menu-btn { display: inline-flex; }
  .sidebar-close { display: inline-flex; }
  .content { padding: 18px 14px 70px; }
  .topbar { padding: 12px 14px; }
}

/* ============ cards & grids ============ */
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px;
}
.card + .card { margin-top: 16px; }
.card-title { font-size: 16px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 9px; }
.card-title svg { color: var(--accent-2); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
@media (max-width: 1060px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } .grid-3 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }

/* stat card */
.stat-card { display: flex; align-items: center; gap: 14px; padding: 17px 18px; }
.stat-icon {
  width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.stat-body { line-height: 1.4; min-width: 0; }
.stat-value { font-size: 22px; font-weight: 800; }
.stat-label { font-size: 12.5px; color: var(--text-2); }

/* hero / latest project */
.hero {
  border-radius: 20px; padding: 24px;
  background: linear-gradient(135deg, var(--accent) 0%, #1d4ed8 55%, var(--purple) 130%);
  color: #fff; box-shadow: 0 10px 34px rgba(37, 99, 235, .35);
  position: relative; overflow: hidden;
}
.hero::after {
  content: ''; position: absolute; inset-inline-end: -60px; top: -60px;
  width: 220px; height: 220px; border-radius: 50%;
  background: rgba(255, 255, 255, .09);
}
.hero .eyebrow { font-size: 12px; opacity: .85; font-weight: 600; letter-spacing: .4px; }
.hero h3 { font-size: 22px; margin: 4px 0 2px; }
.hero .sub { font-size: 13.5px; opacity: .9; }
.hero-row { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 14px; font-size: 13px; }
.hero-row .kv { display: flex; align-items: center; gap: 6px; opacity: .95; }
.hero-progress { margin-top: 18px; }
.hero-progress .bar { height: 10px; background: rgba(255, 255, 255, .25); border-radius: 99px; overflow: hidden; }
.hero-progress .fill { height: 100%; background: #fff; border-radius: 99px; transition: width .6s ease; }
.hero-progress .row { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 6px; }
.hero-actions { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; position: relative; z-index: 1; }
.hero-actions .btn { background: rgba(255, 255, 255, .16); color: #fff; border-color: rgba(255, 255, 255, .35); backdrop-filter: blur(4px); }
.hero-actions .btn:hover { background: rgba(255, 255, 255, .28); }

/* quick access tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
.tile {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px 16px; text-align: center; box-shadow: var(--shadow);
  transition: all .16s; cursor: pointer; border-bottom-width: 3px;
}
.tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-bottom-color: var(--accent-2); }
.tile .t-icon {
  width: 50px; height: 50px; margin: 0 auto 10px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
}
.tile strong { display: block; font-size: 14.5px; }
.tile span { font-size: 12px; color: var(--text-3); }

/* badges */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 700; border-radius: 99px; padding: 3px 11px;
}
.badge.b-blue { background: var(--accent-soft); color: var(--accent-2); }
.badge.b-green { background: var(--ok-soft); color: var(--ok); }
.badge.b-amber { background: var(--warn-soft); color: var(--warn); }
.badge.b-red { background: var(--danger-soft); color: var(--danger); }
.badge.b-purple { background: var(--purple-soft); color: var(--purple); }
.badge.b-teal { background: var(--teal-soft); color: var(--teal); }
.badge.b-gray { background: var(--bg-soft); color: var(--text-2); border: 1px solid var(--border); }
.badge.badge-sm { font-size: 10.5px; padding: 2px 8px; vertical-align: middle; }

/* list rows */
.row-item {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; border: 1px solid var(--border); border-radius: 14px;
  background: var(--bg-card); box-shadow: var(--shadow);
  transition: all .15s; cursor: pointer; margin-bottom: 10px;
}
.row-item:hover { border-color: var(--accent-2); transform: translateY(-1px); }
.row-icon {
  width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.row-body { flex: 1; min-width: 0; line-height: 1.5; }
.row-body strong { display: block; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-body .sub { font-size: 12.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-side { text-align: end; flex-shrink: 0; line-height: 1.5; }
.row-side .date { font-size: 11.5px; color: var(--text-3); display: block; margin-top: 3px; }
.mini-progress { height: 6px; border-radius: 99px; background: var(--bg-soft); border: 1px solid var(--border); overflow: hidden; margin-top: 7px; }
.mini-progress .fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; }

/* toolbar */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.toolbar .search { flex: 1; min-width: 200px; position: relative; }
.toolbar .search input {
  width: 100%; background: var(--bg-card); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 10px 42px 10px 14px; outline: none; box-shadow: var(--shadow);
}
html[dir="ltr"] .toolbar .search input { padding: 10px 14px 10px 42px; }
.toolbar .search svg { position: absolute; inset-inline-start: auto; inset-inline-end: 14px; top: 11px; color: var(--text-3); }
html[dir="ltr"] .toolbar .search svg { inset-inline-end: auto; inset-inline-start: 14px; }
.toolbar .search input:focus { border-color: var(--accent-2); box-shadow: 0 0 0 3px var(--accent-soft); }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  border: 1.5px solid var(--border); background: var(--bg-card); color: var(--text-2);
  border-radius: 99px; padding: 6px 15px; font-size: 13px; font-weight: 600; transition: all .14s;
}
.chip:hover { border-color: var(--accent-2); color: var(--accent-2); }
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* empty / loading / error states */
.empty {
  text-align: center; padding: 54px 20px; color: var(--text-2);
  border: 2px dashed var(--border); border-radius: var(--radius); background: var(--bg-card);
  grid-column: 1 / -1;                      /* always full width inside a grid */
}
/* nested inside a card or a modal the dashed frame is noise */
.card .empty, .modal-body .empty, #calDayDetail .empty { border: 0; background: transparent; padding: 30px 14px; }
.empty .btn { margin-top: 2px; }
.empty .e-icon { font-size: 40px; margin-bottom: 10px; opacity: .9; }
.empty strong { display: block; font-size: 16px; color: var(--text); margin-bottom: 4px; }
.empty p { font-size: 13.5px; margin-bottom: 16px; }
.page-loading { display: flex; justify-content: center; padding: 80px 0; }
.spinner {
  width: 38px; height: 38px; border-radius: 50%;
  border: 3.5px solid var(--border); border-top-color: var(--accent);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-box {
  background: var(--danger-soft); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
  border-radius: var(--radius); padding: 18px; text-align: center;
}

/* skeleton */
.skel { border-radius: 10px; background: linear-gradient(90deg, var(--bg-soft) 25%, var(--bg-hover) 50%, var(--bg-soft) 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ============ modal ============ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(2, 6, 23, .55); backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; padding: 18px;
  animation: fadeIn .18s ease;
}
@keyframes fadeIn { from { opacity: 0; } }
.modal {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 20px; box-shadow: var(--shadow-lg);
  width: 100%; max-width: 640px; max-height: 90vh; display: flex; flex-direction: column;
  animation: popIn .22s cubic-bezier(.2, 1.2, .4, 1);
}
.modal.sm { max-width: 420px; }
.modal.lg { max-width: 780px; }
@keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(.98); } }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px 14px; border-bottom: 1px solid var(--border);
}
.modal-head h3 { font-size: 16.5px; font-weight: 800; }
.modal-body { padding: 20px 22px; overflow-y: auto; }
.modal-foot {
  display: flex; justify-content: flex-end; gap: 10px;
  padding: 14px 22px; border-top: 1px solid var(--border);
}

/* ============ toast ============ */
.toast-root {
  position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); inset-inline-start: 50%; transform: translateX(-50%);
  z-index: 200; display: flex; flex-direction: column; gap: 9px; align-items: center; pointer-events: none;
}
html[dir="rtl"] .toast-root { transform: translateX(50%); }
.toast {
  background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
  border-radius: 13px; padding: 11px 20px; box-shadow: var(--shadow-lg);
  font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 9px;
  animation: toastIn .25s ease;
}
.toast.ok { border-inline-start: 4px solid var(--ok); }
.toast.err { border-inline-start: 4px solid var(--danger); }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px); } }

/* ============ details page ============ */
.detail-head { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
.detail-head .grow { flex: 1; min-width: 220px; }
.detail-head h2 { font-size: 22px; }
.detail-head .sub { color: var(--text-2); font-size: 13.5px; margin-top: 3px; }
.detail-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.kv-cell { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px; line-height: 1.5; }
.kv-cell .k { font-size: 11.5px; color: var(--text-3); font-weight: 600; }
.kv-cell .v { font-size: 14px; font-weight: 700; margin-top: 1px; word-break: break-word; }
.note-block { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 25%, transparent); border-radius: 12px; padding: 13px 16px; font-size: 13.5px; white-space: pre-wrap; }
.section-title { display: flex; align-items: center; justify-content: space-between; margin: 26px 0 13px; }
.section-title h3 { font-size: 16px; font-weight: 800; }

/* progress editor */
.progress-edit { display: flex; align-items: center; gap: 14px; }
.progress-edit input[type=range] { flex: 1; accent-color: var(--accent); height: 28px; }
.progress-edit .val { font-weight: 800; font-size: 16px; min-width: 48px; text-align: center; }

/* ============ checklist ============ */
.check-group { margin-bottom: 20px; }
.check-group h4 {
  font-size: 13.5px; font-weight: 800; color: var(--accent-2);
  margin-bottom: 9px; padding-bottom: 6px; border-bottom: 1px dashed var(--border);
}
.check-item {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 9px 11px; border-radius: 10px; transition: background .12s; cursor: pointer;
}
.check-item:hover { background: var(--bg-hover); }
.check-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--bg-hover); }
.check-item input { margin-top: 5px; width: 17px; height: 17px; accent-color: var(--ok); flex-shrink: 0; cursor: pointer; }
.check-item.done .ci-text { text-decoration: line-through; color: var(--text-3); }
.ci-text { font-size: 13.8px; }
.ci-ref { font-size: 11px; color: var(--text-3); display: block; }
.check-progress-wrap { position: sticky; top: calc(66px + env(safe-area-inset-top)); z-index: 5; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 13px 18px; box-shadow: var(--shadow); margin-bottom: 16px; }

/* ============ calculators ============ */
.calc-result {
  background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  border-radius: 13px; padding: 14px 18px; margin-top: 14px;
}
.calc-result .r-row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; gap: 12px; }
.calc-result .r-row + .r-row { border-top: 1px dashed color-mix(in srgb, var(--accent) 25%, transparent); }
.calc-result .r-label { font-size: 13px; color: var(--text-2); }
.calc-result .r-val { font-size: 16.5px; font-weight: 800; color: var(--accent-2); direction: ltr; }
.calc-note { font-size: 12.3px; color: var(--text-3); margin-top: 10px; line-height: 1.8; }
.formula { direction: ltr; text-align: left; font-family: ui-monospace, monospace; font-size: 13px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 9px; padding: 8px 13px; margin: 8px 0; color: var(--text-2); overflow-x: auto; }

/* ============ diagnostics ============ */
.diag-item { border: 1px solid var(--border); border-radius: 14px; background: var(--bg-card); margin-bottom: 11px; overflow: hidden; box-shadow: var(--shadow); }
.diag-q { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: transparent; padding: 15px 17px; text-align: start; color: var(--text); font-size: 14.3px; font-weight: 700; }
.diag-q:hover { background: var(--bg-hover); }
.diag-q .chev { margin-inline-start: auto; transition: transform .2s; color: var(--text-3); flex-shrink: 0; }
.diag-item.open .chev { transform: rotate(180deg); }
.diag-a { display: none; padding: 3px 18px 17px; border-top: 1px dashed var(--border); }
.diag-item.open .diag-a { display: block; }
.diag-a h5 { font-size: 12.5px; color: var(--accent-2); margin: 13px 0 5px; }
.diag-a ul { padding-inline-start: 20px; font-size: 13.5px; color: var(--text-2); }
.diag-a li { margin-bottom: 4px; }
.safety-banner {
  display: flex; gap: 11px; align-items: flex-start;
  background: var(--danger-soft); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
  color: var(--danger); border-radius: 13px; padding: 13px 16px; margin-bottom: 18px; font-size: 13.3px; font-weight: 600;
}

/* ============ knowledge ============ */
.kb-card { cursor: pointer; transition: all .15s; }
.kb-card:hover { transform: translateY(-2px); border-color: var(--accent-2); }
.kb-card h4 { font-size: 15px; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
.kb-card p { font-size: 13px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.kb-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.kb-article { font-size: 14.2px; line-height: 2; }
.kb-article h4 { font-size: 15px; color: var(--accent-2); margin: 18px 0 7px; }
.kb-article table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
.kb-article th, .kb-article td { border: 1px solid var(--border); padding: 7px 11px; text-align: start; }
.kb-article th { background: var(--bg-soft); font-weight: 700; }
.kb-article ul { padding-inline-start: 22px; }
mark { background: color-mix(in srgb, var(--warn) 35%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }

/* ============ charts ============ */
.chart-bars { display: flex; align-items: flex-end; gap: 10px; height: 130px; padding-top: 8px; }
.chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.chart-col .bar-v {
  width: 100%; max-width: 44px; border-radius: 8px 8px 4px 4px;
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
  transition: height .5s ease; min-height: 3px; position: relative;
}
.chart-col .bar-num { font-size: 12px; font-weight: 800; color: var(--accent-2); }
.chart-col .bar-lbl { font-size: 10.5px; color: var(--text-3); white-space: nowrap; }
.status-bars .sb-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.status-bars .sb-lbl { font-size: 12.3px; color: var(--text-2); width: 110px; flex-shrink: 0; }
.status-bars .sb-track { flex: 1; height: 9px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 99px; overflow: hidden; }
.status-bars .sb-fill { height: 100%; border-radius: 99px; transition: width .5s; }
.status-bars .sb-val { font-size: 12px; font-weight: 800; width: 22px; text-align: center; }

/* ============ due list ============ */
.due-item { display: flex; align-items: center; gap: 12px; padding: 11px 13px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; background: var(--bg-soft); }
.due-item.overdue { border-color: color-mix(in srgb, var(--danger) 40%, transparent); background: var(--danger-soft); }
.due-item.soon { border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: var(--warn-soft); }
.due-item .grow { flex: 1; min-width: 0; line-height: 1.45; }
.due-item strong { font-size: 13.5px; display: block; }
.due-item .d-sub { font-size: 11.8px; color: var(--text-2); }

/* ============ service parts (stock linkage) ============ */
.spart { display: flex; align-items: center; gap: 8px; padding: 9px 11px; border: 1px solid var(--border); border-radius: 11px; margin-bottom: 7px; background: var(--bg-soft); }
.spart .grow { flex: 1; min-width: 0; line-height: 1.4; }
.spart strong { font-size: 13px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spart .meta { font-size: 11.5px; color: var(--text-3); }
.spart .qty { width: 64px; flex: 0 0 auto; }
.spart .tag { font-size: 10.5px; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-2); white-space: nowrap; }
.spart .tag.free { background: var(--warn-soft); color: var(--warn); }
.spart .tag.low { background: var(--danger-soft); color: var(--danger); }
.spart-add { display: flex; gap: 8px; flex-wrap: wrap; }
@media print { .spart-add, .spart .icon-btn { display: none !important; } }

/* ============ parts table ============ */
.parts-table { width: 100%; border-collapse: collapse; }
.parts-table th { text-align: start; font-size: 12px; color: var(--text-3); font-weight: 700; padding: 8px 12px; border-bottom: 2px solid var(--border); }
.parts-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); font-size: 13.5px; vertical-align: middle; }
.parts-table tr:hover td { background: var(--bg-hover); }
.parts-table tr { cursor: pointer; }
.parts-table .p-name { font-weight: 700; }
.parts-table .p-sub { font-size: 11.5px; color: var(--text-3); }
.qty-pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; }
.qty-dot { width: 9px; height: 9px; border-radius: 50%; }
.table-wrap { overflow-x: auto; }
@media (max-width: 720px) { .parts-table .hide-sm { display: none; } }

/* ============ print report ============ */
.print-sheet { display: none; }
@page { size: A4; margin: 14mm; }
@media print {
  html, body { background: #fff !important; }
  body * { visibility: hidden; }
  .print-sheet, .print-sheet * { visibility: visible; }
  .print-sheet {
    display: block; position: absolute; inset: 0; padding: 24px;
    background: #fff; color: #000; font-size: 13px;
  }
  .print-sheet h1 { font-size: 19px; text-align: center; margin-bottom: 4px; }
  .print-sheet .ph-sub { text-align: center; font-size: 12px; color: #444; margin-bottom: 18px; }
  .print-sheet table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
  .print-sheet th, .print-sheet td { border: 1px solid #999; padding: 7px 10px; text-align: start; }
  .print-sheet th { background: #f0f0f0; width: 160px; }
  .print-sheet thead { display: table-header-group; }          /* repeat headers across pages */
  .print-sheet tr, .print-sheet .sig-row { page-break-inside: avoid; break-inside: avoid; }
  .print-sheet h1, .print-sheet h2 { page-break-after: avoid; }
  .print-sheet .sig-row { display: flex; gap: 40px; margin-top: 50px; page-break-inside: avoid; }
  .print-sheet .sig { flex: 1; text-align: center; border-top: 1px solid #666; padding-top: 8px; font-size: 12px; }
  #updBanner, .toast-root, .modal-overlay { display: none !important; }
}

/* timeline for services in project detail */
.timeline { position: relative; padding-inline-start: 22px; }
.timeline::before { content: ''; position: absolute; inset-inline-start: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
.tl-item { position: relative; margin-bottom: 14px; }
.tl-item::before {
  content: ''; position: absolute; inset-inline-start: -22px; top: 7px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--accent); border: 2.5px solid var(--bg-card); box-shadow: 0 0 0 2px var(--accent);
}
.tl-card { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 12px; padding: 12px 15px; }
.tl-card .tl-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 5px; }
.tl-card .tl-head strong { font-size: 13.8px; }
.tl-card p { font-size: 13px; color: var(--text-2); }

/* ============ MOBILE POLISH (v4) ============ */
@media (max-width: 640px) {
  .content { padding: 14px 12px 80px; }
  /* stat cards: 2 columns on phones */
  .grid-4 { grid-template-columns: 1fr 1fr !important; gap: 10px; }
  .stat-card { padding: 12px; gap: 10px; }
  .stat-icon { width: 40px; height: 40px; font-size: 18px !important; }
  .stat-value { font-size: 18px; }
  .stat-label { font-size: 11.5px; }
  /* toolbar: search full-width, chips scroll horizontally, button full width */
  .toolbar { gap: 8px; }
  .toolbar .search { flex-basis: 100%; min-width: 0; order: 1; }
  .toolbar .chip-row {
    order: 3; width: 100%; overflow-x: auto; flex-wrap: nowrap;
    padding-bottom: 3px; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .toolbar .chip-row::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; }
  .toolbar > .btn { order: 2; flex: 1; }
  /* hero */
  .hero { padding: 18px 16px; border-radius: 16px; }
  .hero h3 { font-size: 19px; }
  .hero-row { gap: 8px 14px; font-size: 12.3px; }
  .hero-actions .btn { flex: 1; justify-content: center; }
  /* list rows: stack side info under the body */
  .row-item { flex-wrap: wrap; padding: 12px 13px; gap: 8px 12px; }
  .row-body { flex: 1 1 calc(100% - 58px); }
  .row-side {
    width: 100%; display: flex; align-items: center; gap: 8px;
    justify-content: space-between; text-align: start; margin-top: 2px;
  }
  .row-side .date { margin-top: 0; }
  /* detail page actions */
  .detail-head .actions { width: 100%; }
  .detail-head .actions .btn { flex: 1; }
  /* modals become bottom sheets */
  .modal-overlay { padding: 0; align-items: flex-end; }
  .modal { max-width: 100% !important; max-height: 93vh; border-radius: 22px 22px 0 0; animation: sheetIn .25s ease; }
  .modal::before { content: ''; display: block; width: 38px; height: 4px; border-radius: 99px; background: var(--border); margin: 8px auto 0; flex-shrink: 0; }
  @keyframes sheetIn { from { transform: translateY(48px); opacity: .5; } }
  .modal-body { padding: 16px 16px; }
  .modal-head { padding: 15px 16px 12px; }
  .modal-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); flex-wrap: wrap; }
  .modal-foot .btn { flex: 1; }
  /* charts & misc */
  .chart-bars { height: 105px; gap: 6px; }
  .status-bars .sb-lbl { width: 86px; font-size: 11.3px; }
  .tiles { gap: 10px; }
  .tile { padding: 14px 8px; }
  .tile strong { font-size: 13px; }
  .section-title { margin: 20px 0 10px; }
  .card { padding: 15px 14px; }
  .kb-article { font-size: 13.5px; }
  .check-progress-wrap { top: calc(60px + env(safe-area-inset-top)); }
  /* bigger touch targets */
  .btn { padding: 11px 16px; min-height: 44px; }
  .btn-sm { min-height: 38px; padding: 8px 13px; }
  .icon-btn { width: 42px; height: 42px; }
  .nav-item { padding: 12px 12px; }
  .check-item input { width: 20px; height: 20px; }
  .field input, .field select, .field textarea { padding: 12px 13px; font-size: 16px; }
  /* 16px prevents iOS/Android zoom-on-focus */
}
/* very narrow phones */
@media (max-width: 360px) {
  .grid-4 { grid-template-columns: 1fr !important; }
  .tiles { grid-template-columns: 1fr 1fr; }
}
/* safe areas when installed as PWA (notch / gesture bar) */
@media (display-mode: standalone) {
  .topbar { padding-top: calc(12px + env(safe-area-inset-top)); }
  .sidebar-head { padding-top: calc(20px + env(safe-area-inset-top)); }
  .content { padding-bottom: calc(70px + env(safe-area-inset-bottom)); }
}
/* fallbacks for older Android WebView without color-mix() */
@supports not (color: color-mix(in srgb, red 50%, blue)) {
  .topbar { background: var(--bg); }
  .note-block, .safety-banner, .calc-result, .error-box,
  .due-item.overdue, .due-item.soon { border-color: var(--border); }
  .calc-result .r-row + .r-row { border-top-color: var(--border); }
}

/* ============ v5: 4-state checklist + diag flow ============ */
.check-item.ci-pass { background: var(--ok-soft); }
.check-item.ci-fail { background: var(--danger-soft); }
.check-item.ci-na { opacity: .65; }
.check-item { cursor: pointer; border: 1px solid transparent; }
.check-item.ci-pass, .check-item.ci-fail { border-color: var(--border); }
.check-item:active { transform: scale(.995); }

/* ============ v6: kill horizontal page scroll (off-canvas sidebar overflow) ============ */
html, body { overflow-x: hidden; max-width: 100%; }
.app, .main { overflow-x: clip; max-width: 100vw; }
.content { overflow-x: hidden; }
.row-item, .card, .due-item { max-width: 100%; }
.row-body, .row-body strong, .row-body .sub { min-width: 0; }
/* long persian titles in list rows: wrap instead of clip on mobile */
@media (max-width: 640px) {
  .row-body strong { white-space: normal; line-height: 1.5; }
  .row-body .sub { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
}

/* ---------- service calendar ---------- */
.cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.cal-head strong { flex: 1; text-align: center; font-size: 15px; }
.cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal-week { font-size: 11px; color: var(--text-3); margin-bottom: 5px; }
.cal-day { position: relative; border: 1px solid var(--border); background: var(--bg-card); border-radius: 10px; padding: 8px 0 20px; font-family: inherit; font-size: 13px; cursor: pointer; color: var(--text); }
.cal-day:hover { border-color: var(--accent); }
.cal-day.cal-today { border-color: var(--accent); background: var(--accent-soft); }
.cal-day.cal-sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); background: var(--accent-soft); }
.cal-day:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.cal-num { font-weight: 600; }
.cal-dot { position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; font-size: 9.5px; font-weight: 700; min-width: 15px; height: 15px; line-height: 15px; border-radius: 8px; padding: 0 4px; }
.sub-title { font-size: 12.5px; font-weight: 700; color: var(--text-2); margin: 4px 0 6px; }

/* ============ v24: Services hub (reports + calendar) ============ */
/* segmented tab control */
.seg {
  display: flex; background: var(--bg-soft); border: 1px solid var(--border);
  border-radius: 13px; padding: 4px; gap: 4px;
}
.seg-btn {
  flex: 1; border: 0; background: transparent; color: var(--text-2);
  padding: 10px 8px; border-radius: 10px; font-size: 14px; font-weight: 700;
  font-family: inherit; transition: all .15s; cursor: pointer; white-space: nowrap;
}
.seg-btn:hover { color: var(--text); }
.seg-btn.active { background: var(--bg-card); color: var(--accent-2); box-shadow: var(--shadow); }
/* clickable KPI cards on the services hub */
.svc-kpi {
  cursor: pointer; transition: transform .12s, border-color .12s, box-shadow .12s;
}
.svc-kpi:hover { transform: translateY(-2px); border-color: var(--accent-2); box-shadow: var(--shadow-lg); }
.svc-kpi .stat-value { font-size: 19px; }
@media (hover: none) { .svc-kpi:hover { transform: none; } }
/* compact calendar legend */
.cal-legend {
  display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
  font-size: 11.5px; color: var(--text-3); margin-top: 12px;
  padding-top: 11px; border-top: 1px dashed var(--border);
}
.cal-legend .lg { display: inline-flex; align-items: center; gap: 6px; }
.cal-legend .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.cal-legend .sq { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
</style>
</head>
<body>
  <!-- ================= AUTH ================= -->
  <div id="authView" class="auth-wrap hidden">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-badge">
          <svg viewBox="0 0 32 32" width="34" height="34"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M10 8h12l-8 7h8L10 24l4-7h-6z" fill="#fff"/></svg>
        </div>
        <h1>Z Lift</h1>
        <p data-i18n="tagline">دستیار حرفه‌ای تکنسین آسانسور</p>
      </div>
      <div class="auth-tabs">
        <button id="tabLogin" class="active" data-i18n="login">ورود</button>
        <button id="tabRegister" data-i18n="register">ثبت‌نام</button>
      </div>

/* Standard civil Jalali<->Gregorian conversion (jalaali algorithm, well-established) */

  if (_mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;

/* Calculator audit metadata. Every card exposes the requested input/formula/
   result/assumptions/limitations/reference chain. A formula that mentions a
   standard remains usable as a mathematical what-if, but is not a compliance
   decision while its source is unavailable. */
CALCULATORS.forEach(cal => {
  cal.resultClass = 'PRELIMINARY ESTIMATE';
  cal.verificationRequired = true;
  cal.limit = cal.note || { fa: 'نتیجه به ورودی‌ها و فرضیات وابسته است.', en: 'The result depends on inputs and assumptions.' };
  const standardNamed = cal.cat === 'std' || /EN\s*81|6303|IEC\s*60364|استاندارد/i.test([cal.desc && cal.desc.fa, cal.desc && cal.desc.en, cal.formula, cal.assume && cal.assume.fa, cal.note && cal.note.fa].filter(Boolean).join(' '));
  cal.verificationStatus = standardNamed ? 'UNVERIFIED' : 'ENGINEERING PRACTICE';

/* parse Persian/Arabic/European numerals and thousands separators into a Number.
   Returns null when empty/invalid. */
function parseNum(s) {
  if (s == null) return null;
  if (typeof s === 'number') return isFinite(s) ? s : null;
  let str = String(s).trim();
  if (!str) return null;
  str = str.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
           .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  // accept both 1,234.5 and 1٫234٫5 (Arabic decimal)
  if (str.indexOf(',') !== -1 || str.indexOf('٬') !== -1) {
    const lastDot = Math.max(str.lastIndexOf('.'), str.lastIndexOf('٫'));
    const lastComma = Math.max(str.lastIndexOf(','), str.lastIndexOf('٬'));
    if (lastComma > lastDot) str = str.replace(/[.,٬]/g, m => (m === ',' || m === '٬') ? '.' : '');
    else str = str.replace(/,/g, '');
  }
  str = str.replace(/٫/g, '.').replace(/[^\d.\-]/g, '');
  if (str === '' || str === '-' || str === '.') return null;
  const n = Number(str);
  return isFinite(n) ? n : null;
}

  });
  if (!f) return unknown({ fa: 'نوع اندازه‌گیری شناخته‌شده نیست.', en: 'Unknown measurement type.' });
  const ctx = Object.assign({}, m.context || {}, {
    expectedMin: m.expectedMin != null ? m.expectedMin : (m.expectedRange && m.expectedRange.min != null ? m.expectedRange.min : (m.context && m.context.expectedMin)),
    expectedMax: m.expectedMax != null ? m.expectedMax : (m.expectedRange && m.expectedRange.max != null ? m.expectedRange.max : (m.context && m.context.expectedMax)),
    reference: m.reference || (m.context && m.context.reference) || '',
    testMethod: m.testMethod || (m.context && m.context.testMethod) || '',
    testVoltage: m.testVoltage || (m.context && m.context.testVoltage) || '',
    manufacturer: m.manufacturer || (m.context && m.context.manufacturer) || '',
    model: m.model || (m.context && m.context.model) || ''
  });
  let result;
  try {
    if (f.state) result = f.eval ? f.eval(m.value, ctx) : null;
    else if (f.text) result = unknown({ fa: 'اندازه‌گیری توصیفی است؛ قضاوت خودکار انجام نمی‌شود.', en: 'This is a descriptive measurement; no automatic judgement is made.' });
    else {
      const n = parseNum(m.value);
      if (n == null || isNaN(n)) return unknown({ fa: 'مقدار عددی معتبر نیست.', en: 'The numeric value is invalid.' });
      result = f.eval ? f.eval(n, ctx) : configuredRangeEval(n, ctx);

  if (result.status === 'unknown' && !result.reason) return unknown();
  return result;
}

/* ---------- DATA ACCESS LAYER ----------
   ARCHITECTURE (v2): Z Lift is a fully offline PWA — there is NO backend server.
   Every `api(path, opts)` call below resolves against the local persistence layer
   (see the "LOCAL PERSISTENCE" section near the end of this file):
     • structured data → localStorage['zlift_db'] (+ mirror + auto-snapshots)
     • photos (large blobs) → IndexedDB when available, inline fallback
   The function signature mimics a REST API on purpose: a future sync layer can be
   introduced by replacing only this single seam — the rest of the app stays as-is.
   No network request is made anywhere for application data. */
async function api(path, opts = {}) {
  return _apiLocal(path, opts);
}

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function toast(msg, type = 'ok') {
  const root = $('#toastRoot');
  if (!root) return;
  while (root.children.length >= 3) root.firstElementChild.remove();   // never cover the screen
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.setAttribute('role', type === 'ok' ? 'status' : 'alert');
  el.setAttribute('aria-live', type === 'ok' ? 'polite' : 'assertive');
  el.innerHTML = (type === 'ok' ? '✅' : '⚠️') + ' <span>' + esc(msg) + '</span>';
  const hide = () => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); };
  el.onclick = hide;                                                   // tap to dismiss
  root.appendChild(el);
  setTimeout(hide, 2600);
}
/* inline validation: say what is wrong, mark the field and put the cursor in it
   (a toast alone leaves the user hunting for the empty box) */
function fieldError(sel, msgKey) {
  toast(t(msgKey), 'err');
  const el = $(sel);
  if (!el) return false;
  el.classList.add('input-error');
  el.addEventListener('input', () => el.classList.remove('input-error'), { once: true });
  el.addEventListener('change', () => el.classList.remove('input-error'), { once: true });
  try { el.focus({ preventScroll: true }); } catch (e) { try { el.focus(); } catch (e2) {} }
  try { el.scrollIntoView({ block: 'center' }); } catch (e) {}
  return false;
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
/* inventory shortage notice: /parts-consume clamps stock at zero and reports a
   shortage — make sure the technician actually SEES that it happened */
function warnStockShort(res, partName) {
  try {
    if (res && +res.shortQty > 0) {
      toast(t('stockShortMsg').replace('{n}', partName || '?').replace('{q}', faNum(+res.shortQty)), 'err');
    }
  } catch (e) {}
}
/* wrap an async save handler: disables the button during the call and
   swallows double-clicks (duplicate-submission protection) */
function guard(btnSel, fn) {
  return async (...a) => {
    const b = $(btnSel);
    if (b && b.disabled) return;
    if (b) b.disabled = true;
    try { await fn(...a); }
    catch (e) { reportError(e, 'guard:' + btnSel); }
    finally { const b2 = $(btnSel); if (b2) b2.disabled = false; }
  };
}
/* turn an API error code into a message the technician can act on */
const ERR_KEYS = {
    name_required: 'requiredTitle', customer_required: 'requiredCustomer',
  not_found: 'errNotFound', invoice_part_not_found: 'errNotFound', insufficient_stock: 'stockAlert', too_large: 'photoTooLarge', bad_backup: 'restoreBad',
  unauthorized: 'errSessionExpired', invalid_credentials: 'errInvalidCred',
  username_taken: 'errUserTaken', weak_password: 'errWeakPass', bad_username: 'errBadUser'
};
function errMsg(e) {
  if (e && e.code && ERR_KEYS[e.code]) return t(ERR_KEYS[e.code]);
  if (typeof navigator !== 'undefined' && navigator.onLine === false) return t('errOffline');
  return t('errGeneric');
}
/* central error handler */
function reportError(e, ctx) {
  try {
    console.error('[ZLift]', ctx || '', e);
    toast(t('errUnexpected'), 'err');
  } catch (e2) {}
}

}
/* ---- Persian-aware text normalisation for every search box ----
   Arabic ي/ك typed by many keyboards must match Persian ی/ک, Persian & Arabic
   digits must match Latin ones, and ZWNJ / diacritics / tatweel must be ignored,
   otherwise «کليد» never finds «کلید» and «۱۲» never finds «12». */
const _NORM_MAP = {
  'ي': 'ی', 'ﻱ': 'ی', 'ﻲ': 'ی', 'ی': 'ی', 'ئ': 'ی', 'ى': 'ی',
  'ك': 'ک', 'ﻙ': 'ک', 'ﻚ': 'ک',
  'أ': 'ا', 'إ': 'ا', 'آ': 'ا', 'ٱ': 'ا', 'ا': 'ا',
  'ؤ': 'و', 'ة': 'ه', 'ۀ': 'ه',
  '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4', '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9',
  '۰': '0', '۱': '1', '۲': '2', '۳': '3', '۴': '4', '۵': '5', '۶': '6', '۷': '7', '۸': '8', '۹': '9'
};
function norm(s) {
  return String(s == null ? '' : s)
    .toLowerCase()
    .replace(/[\u200c\u200f\u200e\u0640]/g, '')          // ZWNJ, bidi marks, tatweel
    .replace(/[\u064b-\u0652]/g, '')                      // harakat
    .replace(/[يﻱﻲیئىكﻙﻚأإآٱاؤةۀ٠-٩۰-۹]/g, c => _NORM_MAP[c] || c)
    .replace(/\s+/g, ' ')
    .trim();
}
/* join any number of fields into one normalised haystack */
function hay(...parts) { return norm(parts.filter(v => v != null && v !== '').join(' ')); }

/* optimistic list removal with rollback — safe when the id is already gone
   (a stale button / double tap must never delete a random last row) */
function optimisticRemove(list, id) {
  const idx = list.findIndex(x => x && x.id === id);
  if (idx < 0) return null;
  const [removed] = list.splice(idx, 1);
  return { idx, removed, restore() { list.splice(idx, 0, removed); } };
}

}

/* ---------- theme & lang ---------- */
function applyTheme() {
  const th = localStorage.getItem('zlift_theme') || 'light';
  document.documentElement.setAttribute('data-theme', th);
  $('#iconMoon').classList.toggle('hidden', th === 'dark');
  $('#iconSun').classList.toggle('hidden', th !== 'dark');
  const meta = document.getElementById('metaTheme');
  if (meta) meta.setAttribute('content', th === 'dark' ? '#0b1220' : '#2563eb');
}
/* offline indicator — everything keeps working (data is local), but sharing,
   Telegram and map links need a connection, so say so quietly */
function updateOnlineBadge() {
  const el = document.getElementById('offlineBadge');
  if (!el) return;
  const off = navigator.onLine === false;
  el.classList.toggle('hidden', !off);
  el.textContent = '📴 ' + t('offlineMode');
}
function applyLang() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = I18N[LANG].dir;
  $('#langLabel').textContent = LANG === 'fa' ? 'EN' : 'فا';
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  $$('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
}

/* ---------- UI back-stack (phone back button support) ----------
   Every overlay (modal / date picker / sidebar / diag step) registers a
   "layer". Pressing hardware back pops the top layer instead of leaving
   the app. Closing via UI removes the matching history entry. */
let uiStack = [];
let _ignorePop = 0;
function pushUiLayer(type, closeFn) {
  // opening a fresh first layer invalidates any stale compensating-back counters
  // (they belong to popstates that were lost to route changes — see race fix)
  if (uiStack.length === 0) _ignorePop = 0;
  uiStack.push({ type, close: closeFn });
  try { history.pushState({ zl: uiStack.length }, ''); } catch (e) {}
}
function popTaggedLayer(type) {
  // remove the topmost layer of this type that was closed via UI
  for (let i = uiStack.length - 1; i >= 0; i--) {
    if (uiStack[i].type === type) {
      const isTop = i === uiStack.length - 1;
      uiStack.splice(i, 1);
      if (isTop) { _ignorePop++; try { history.back(); } catch (e) {} }
      return true;
    }
  }
  return false;
}
window.addEventListener('popstate', () => {
  if (_ignorePop > 0) { _ignorePop--; return; }
  if (uiStack.length) {
    const layer = uiStack.pop();
    try { layer.close(); } catch (e) {}
  }
  // else: hash-route back — handled by the hashchange listener
});
/* safety net: if a modal/picker overlay exists but its stack entry was lost,
   clicking back must still close it (never trap the user) */
window.addEventListener('popstate', () => {
  setTimeout(() => {
    const hasOverlay = document.getElementById('modalOverlay') || document.getElementById('jdOverlay');
    if (hasOverlay && !uiStack.length) {
      _closeModalDom();
      if (typeof _closeJdateDom === 'function') _closeJdateDom();
    }
  }, 30);
});

/* ---------- modal ----------
   Accessible dialog: aria roles, focus moved in and restored on close, Tab is
   trapped inside, the page behind cannot scroll, and Enter inside a form runs
   the primary action instead of doing an implicit submit (which reloaded the
   whole app and lost the typed data). */
const FOCUSABLE = 'button:not([disabled]), [href], input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
let _modalReturnFocus = null;
function _lockScroll(on) { document.body.classList.toggle('scroll-lock', !!on); }
function _closeModalDom() {
  $('#modalRoot').innerHTML = '';
  document.removeEventListener('keydown', escClose);
  if (!document.getElementById('jdOverlay')) _lockScroll(false);
  const back = _modalReturnFocus;
  _modalReturnFocus = null;
  if (back && document.contains(back)) { try { back.focus({ preventScroll: true }); } catch (e) {} }
}
function openModal(html, opts = {}) {
  const hadModal = !!document.getElementById('modalOverlay');
  if (!hadModal) _modalReturnFocus = document.activeElement;
  const keepFocus = _modalReturnFocus;
  _closeModalDom();
  _modalReturnFocus = keepFocus;
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal-overlay" id="modalOverlay"><div class="modal ${opts.size || ''}" role="dialog" aria-modal="true" aria-label="Z Lift">${html}</div></div>`;
  const box = root.querySelector('.modal');
  const head = box.querySelector('.modal-head h3');
  if (head) { head.id = 'modalTitle'; box.setAttribute('aria-labelledby', 'modalTitle'); box.removeAttribute('aria-label'); }
  $('#modalOverlay').addEventListener('mousedown', e => { if (e.target.id === 'modalOverlay') closeModal(); });
  document.addEventListener('keydown', escClose);
  _lockScroll(true);
  /* Enter anywhere in the form = the primary button (never an implicit submit) */
  box.querySelectorAll('form').forEach(f => {
    f.addEventListener('submit', e => {
      e.preventDefault();
      const primary = box.querySelector('.modal-foot .btn-primary:not([disabled])');
      if (primary) primary.click();
    });
  });
  /* keep Tab inside the dialog */
  box.addEventListener('keydown', e => {
    if (e.key !== 'Tab') return;
    const items = [...box.querySelectorAll(FOCUSABLE)].filter(el => el.offsetParent !== null || el === document.activeElement);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  /* move focus into the dialog — on phones don't pop the keyboard automatically */
  const wide = typeof matchMedia === 'function' && matchMedia('(min-width: 641px)').matches;
  const target = (wide && box.querySelector('input:not([readonly]):not([type="file"]), textarea, select')) ||
                 box.querySelector('.modal-foot .btn-primary') || box.querySelector('.modal-head .icon-btn');
  if (target) { try { target.focus({ preventScroll: true }); } catch (e) {} }
  if (!hadModal) pushUiLayer('modal', _closeModalDom);
}
function escClose(e) { if (e.key === 'Escape') closeModal(); }
function closeModal() {
  const had = !!document.getElementById('modalOverlay');
  _closeModalDom();
  if (had) popTaggedLayer('modal');
}
function confirmDialog(title, msg, onYes) {
  openModal(`
    <div class="modal-head"><h3>⚠️ ${esc(title)}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body"><p style="font-size:14px;color:var(--text-2)">${esc(msg)}</p></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn btn-danger" id="confirmYes">${t('yesDelete')}</button>
    </div>`, { size: 'sm' });
  $('#confirmYes').onclick = onYes;
}

/* ---------- printing ----------
   One pipeline for every printable document (service report, invoice, monthly
   report, QR label): build the sheet, print it, then take it out of the DOM so
   nothing stale is left behind for the next print. */
function printDoc(html) {
  let sheet = document.getElementById('printSheet');
  if (!sheet) {
    sheet = document.createElement('div');
    sheet.id = 'printSheet';
    sheet.className = 'print-sheet';
    document.body.appendChild(sheet);
  }
  sheet.dir = I18N[LANG].dir;
  sheet.innerHTML = html;
  const cleanup = () => {
    window.removeEventListener('afterprint', cleanup);
    const el = document.getElementById('printSheet');
    if (el) el.innerHTML = '';
  };
  window.addEventListener('afterprint', cleanup);
  setTimeout(cleanup, 60000);            // safety net for browsers without afterprint
  try { window.print(); } catch (e) { reportError(e, 'print'); }
}
/* shared header for printed documents */
function printHeader(subtitle) {
  const st = state.settings || {};
  return `<h1>🛗 ${esc(st.company || 'Z Lift')}</h1>
    <div class="ph-sub">${subtitle}${st.phone ? ' · ' + esc(st.phone) : ''}${st.address ? ' · ' + esc(st.address) : ''}</div>`;
}
/* ---------- file downloads ---------- */
function downloadBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
/* Excel-friendly CSV (UTF-8 BOM + CRLF) */
function downloadCsv(filename, head, rows) {
  const cell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const csv = '\ufeff' + [head, ...rows].map(r => r.map(cell).join(',')).join('\r\n');
  downloadBlob(new Blob([csv], { type: 'text/csv;charset=utf-8' }), filename);
}
/* paint long lists in chunks: the first screenful is instant even with hundreds
   of records, the rest is appended silently while the user scrolls */
function paintList(el, items, rowFn, chunk = 60) {
  if (!el) return;
  if (typeof IntersectionObserver !== 'function' || items.length <= chunk) {
    el.innerHTML = items.map(rowFn).join('');
    return;
  }
  el.innerHTML = items.slice(0, chunk).map(rowFn).join('');
  let i = chunk;
  const sentinel = document.createElement('div');
  sentinel.setAttribute('aria-hidden', 'true');
  sentinel.style.height = '1px';
  el.appendChild(sentinel);
  const io = new IntersectionObserver(entries => {
    if (!entries.some(e => e.isIntersecting)) return;
    if (!document.contains(sentinel)) { io.disconnect(); return; }
    sentinel.insertAdjacentHTML('beforebegin', items.slice(i, i + chunk).map(rowFn).join(''));
    i += chunk;
    if (i >= items.length) { io.disconnect(); sentinel.remove(); }
  }, { rootMargin: '600px' });
  io.observe(sentinel);
}

/* keywords used by the fault statistics (project profile + monthly report) */
const FAULT_WORDS = [
  ['درب', 'درب'], ['فتوسل', 'فتوسل'], ['ترمز', 'ترمز'], ['انکودر', 'انکودر'], ['درایو', 'درایو'],
  ['موتور', 'موتور'], ['بکسل', 'بکسل'], ['قفل', 'قفل درب'], ['روغن', 'روغن'], ['سیل', 'سیل جک'],
  ['شیر', 'شیرها'], ['پمپ', 'پمپ'], ['ریزش', 'ریزش'], ['همسطح', 'همسطح‌سازی'], ['برق', 'برق'],
  ['کنتاکتور', 'کنتاکتور'], ['لیمیت', 'لیمیت'], ['صدا', 'صدا'], ['لرزش', 'لرزش']
];
const FAULT_ICONS = { 'درب': '🚪', 'ترمز': '🛑', 'درایو': '🖥️', 'موتور': '⚙️', 'بکسل': '🔗', 'قفل درب': '🔒', 'روغن': '🛢️', 'همسطح‌سازی': '🎯', 'برق': '⚡', 'صدا': '🔊' };
function faultTally(services, icons) {
  const words = {};
  services.forEach(sv => {
    const txt = norm((sv.problem || '') + ' ' + (sv.diagnosis || '') + ' ' + (sv.complaint || ''));
    FAULT_WORDS.forEach(([w, lbl]) => { if (txt.includes(norm(w))) { const k = icons && icons[lbl] ? lbl + ' ' + icons[lbl] : lbl; words[k] = (words[k] || 0) + 1; } });
  });
  return Object.entries(words).sort((a, b) => b[1] - a[1]);
}

/* ---------- data loading ---------- */
async function loadAll(force) {
  if (state.projects && !force) return;
  const [p, s, n, c, pa, st, ds, cs, is_, tl, ph, inv, ct, rm, me, sl] = await Promise.all([
    api('/projects'), api('/services'), api('/notes'), api('/checklists'), api('/parts'), api('/settings'),
    api('/diagSessions'), api('/calcSaves'), api('/issues'), api('/tools'), api('/photos'), api('/invoices'), api('/contracts'),
    api('/reminders'), api('/measurements'), api('/safetyLogs')
  ]);
  state.projects = p.projects;
  state.services = s.services;
  state.notes = n.notes;
  state.checklists = c.checklists;
  state.parts = pa.parts;
  state.settings = st.settings;
  state.diagSessions = ds.items;
  state.calcSaves = cs.items;
  state.issues = is_.items;
  state.tools = tl.items;
  state.photos = ph.items;
  state.invoices = inv.items;
  state.contracts = ct.items;
  state.reminders = rm.reminders;
  state.measurements = me.items;
  state.safetyLogs = sl.items;
}

/* service-due calculation */
function dueInfo(p) {
  if (!p.serviceIntervalDays) return null;
  const svc = state.services.filter(s => s.projectId === p.id && (s.serviceType === 'maintenance' || s.serviceType === 'repair'));
  const last = svc.length ? Math.max(...svc.map(s => s.date)) : p.createdAt;
  const next = last + p.serviceIntervalDays * 86400000;
  const days = Math.round((next - Date.now()) / 86400000);
  return { last, next, days, overdue: days < 0, soon: days >= 0 && days <= 7 };
}

function checkBackupNag() {
  try {
    const last = +localStorage.getItem('zlift_last_backup') || 0;
    const snooze = +localStorage.getItem('zlift_backup_snooze') || 0;
    if (Date.now() < snooze) return;
    const days = last ? Math.floor((Date.now() - last) / 86400000) : 999;
    if (days < 7) return;
    setTimeout(() => {
      const txt = last ? faNum(days) + ' ' + t('backupNagMsg') : t('backupHint');
      openModal(`
        <div class="modal-head"><h3>💾 ${t('backupNagTitle')}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
        <div class="modal-body"><div class="note-block">⚠️ ${txt}</div></div>
        <div class="modal-foot">
          <button class="btn btn-ghost" onclick="localStorage.setItem('zlift_backup_snooze', String(Date.now() + 3 * 86400000));closeModal()">${t('backupNagLater')}</button>
          <button class="btn btn-primary" onclick="closeModal();openBackupModal()">💾 ${t('backupNagBtn')}</button>
        </div>`, { size: 'sm' });
    }, 1200);
  } catch (e) {}

/* ================= ROUTER ================= */
function flushUiLayers() {
  /* drop all overlay layers (modal / picker / sidebar / diag) without
     touching history — used on internal navigation & logout */
  if (!uiStack.length) return;
  uiStack = [];
  _closeModalDom();
  if (typeof _closeJdateDom === 'function') _closeJdateDom();
  _closeSidebarDom();
  diagSession = null;
}
/* remember where the user was on each page: opening a page starts at the top,
   coming back restores the previous scroll position (like a native app) */
const _scrollPos = {};
let _pendingScroll = 0;
function _saveScroll() { if (state.route) _scrollPos[state.route] = window.scrollY || window.pageYOffset || 0; }
function navigate(route) {
  if (route === state.route) { flushUiLayers(); render(); return; }
  _saveScroll();
  flushUiLayers();
  state.route = route;
  _pendingScroll = 0;                 // a freshly opened page starts at the top
  location.hash = route;
  render();
}
window.addEventListener('hashchange', () => {
  const r = location.hash.slice(1) || '/dashboard';
  if (r !== state.route) {
    _saveScroll();
    state.route = r;
    _pendingScroll = _scrollPos[r] || 0;   // back/forward → restore the old spot
    // route changed underneath any open overlays: close them & reset stack
    flushUiLayers();
    if (state.user) render();
  }
});

let _renderSeq = 0;
async function render() {
  const seq = ++_renderSeq;          // only the newest render may paint
  renderNav();
  const c = $('#content');
  const r = state.route;
  const titles = {
    '/dashboard': 'dashboard', '/projects': 'projects', '/services': 'services',
    '/parts': 'parts', '/checklists': 'checklists', '/calculations': 'calculations',
    '/diagnostics': 'diagnostics', '/knowledge': 'knowledge', '/notes': 'notes',
    '/vvvf': 'vvvf', '/issues': 'issues', '/tools': 'tools', '/invoices': 'invoices', '/contracts': 'contracts', '/report': 'monthlyReport', '/standards': 'standards', '/calendar': 'calendar', '/analytics': 'analytics', '/measurements': 'measures', '/settings': 'settings'
  };
  const baseRoute = '/' + r.split('/')[1];
  $('#pageTitle').textContent = t(titles[baseRoute] || 'dashboard');
  const spinner = setTimeout(() => {
    if (seq === _renderSeq) c.innerHTML = '<div class="page-loading"><div class="spinner"></div></div>';
  }, 160);                                   // no spinner flash on instant local data
  try {
    await loadAll();
    clearTimeout(spinner);
    if (seq !== _renderSeq) return;  // a newer navigation won the race
    if (r === '/dashboard') renderDashboard();
    else if (r === '/projects') renderProjects();
    else if (r.startsWith('/projects/')) renderProjectDetail(r.split('/')[2]);
    else if (r === '/services') renderServices();
    else if (r === '/parts') renderParts();
    else if (r === '/checklists') renderChecklists();
    else if (r.startsWith('/checklists/')) renderChecklistDetail(r.split('/')[2]);
    else if (r === '/calculations') renderCalculations();
    else if (r === '/diagnostics') renderDiagnostics();
    else if (r === '/vvvf') renderVVVF();
    else if (r === '/issues') renderIssues();
    else if (r === '/invoices') renderInvoices();
    else if (r === '/contracts') renderContracts();
    else if (r === '/report') renderMonthlyReport();
    else if (r === '/analytics') renderAnalytics();
    else if (r === '/settings') renderSettings();
    else if (r === '/tools') renderToolsPage();
    else if (r === '/knowledge') renderKnowledge();
    else if (r === '/standards') renderStandards();
    else if (r === '/notes') renderNotes();
    else if (r === '/calendar') renderCalendar();
    else if (r === '/measurements') renderMeasurements();
    else renderDashboard();
    const y = _pendingScroll; _pendingScroll = 0;
    if (typeof window.scrollTo === 'function') { try { window.scrollTo(0, y); } catch (e2) {} }
  } catch (e) {
    clearTimeout(spinner);
    if (seq !== _renderSeq) return;
    if (e && e.message === 'unauthorized') return;
    reportError(e, 'render:' + r);
    c.innerHTML = `<div class="error-box"><p style="font-weight:700;margin-bottom:10px">⚠️ ${t('loadError')}</p><button class="btn btn-primary" onclick="render()">${t('retry')}</button></div>`;
  }
}

function drawProjList() {
  if (!$('#projList')) return;

  else list = list.filter(p => !p.archived);
  if (projFilter.type !== 'all') list = list.filter(p => p.elevatorType === projFilter.type);
  if (projFilter.status !== 'all' && projFilter.status !== 'archived') list = list.filter(p => p.status === projFilter.status);
  if (q) list = list.filter(p => hay(p.name, p.customer, p.location, p.controller, p.motor).includes(q));
  list = [...list];
  if (projFilter.sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name, 'fa'));

function archiveProject(id) {

    (LANG === 'fa'
      ? 'پروژه به بایگانی منتقل می‌شود و از لیست فعال‌ها خارج می‌گردد. داده‌های تاریخی (سرویس، فاکتور، اندازه‌گیری و …) حفظ می‌شوند. ادامه؟'
      : 'Project will be moved to archive and removed from active lists. Historical data (services, invoices, measurements…) is preserved. Continue?'),
    async () => {

function deleteProject(id) {
  const p = state.projects.find(x => x.id === id);
  if (!p) return;
  const c = projectImpactCount(id);
  const anyLinked = c.services + c.measurements + c.photos + c.invoices + c.diagSessions + c.issues + c.contracts + c.reminders + c.checklists;
  // Show impact summary

    fmt(c.services, 'گزارش سرویس', 'service reports'),
    fmt(c.measurements, 'رکورد اندازه‌گیری', 'measurements'),
    fmt(c.photos, 'عکس', 'photos'),
    fmt(c.invoices, 'فاکتور', 'invoices'),
    fmt(c.diagSessions, 'جلسه عیب‌یابی', 'diagnostic sessions'),
    fmt(c.issues, 'ثبت خرابی', 'issues'),
    fmt(c.contracts, 'قرارداد', 'contracts'),
    fmt(c.reminders, 'یادآوری', 'reminders'),
    fmt(c.checklists, 'چک‌لیست', 'checklists')
  ].filter(Boolean);
  const warnTitle = LANG === 'fa' ? 'حذف دائمی پروژه' : 'Permanently delete project';
  const hasLinked = LANG === 'fa'
    ? `این پروژه شامل موارد زیر است (حذف دائمی):\n\n${lines.join('\n')}\n\n⚠️ پیشنهاد می‌شود به‌جای حذف، از «بایگانی» استفاده کنید. در صورت حذف دائمی، سوابق از بین نمی‌روند؛ از پروژه جدا و با نام/مشخصات همین آسانسور مهر می‌خورند («سوابق بدون پروژه»). حذف دائمی؟`
    : `This project contains (permanent delete):\n\n${lines.join('\n')}\n\n⚠️ Prefer Archive instead. On permanent delete, history records are preserved — detached from the project but stamped with this elevator's name/details. Delete permanently?`;
  const noneMsg = LANG === 'fa'
    ? 'این پروژه هیچ سابقه‌ای ندارد. آیا از حذف دائمی آن مطمئنید؟'
    : 'This project has no history. Permanently delete?';
  // custom modal with impact summary instead of default confirmDialog
  openModal(`
    <div class="modal-head"><h3>⚠️ ${esc(warnTitle)}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <p style="margin:0 0 8px"><b>${esc(p.name)}</b></p>
      ${anyLinked ? `
      <div class="note-block" style="background:var(--warn-soft);border-color:var(--warn);margin-bottom:10px">
        ${lines.map(l => `<div style="margin:3px 0">${esc(l)}</div>`).join('')}
      </div>
      <p style="font-size:12.5px;color:var(--text-3);margin:0 0 10px">${
        LANG === 'fa'
        ? 'پیشنهاد: به‌جای حذف، پروژه را بایگانی کنید. سوابق تکنسینی هرگز همراه پروژه حذف نمی‌شوند — فقط از پروژه جدا می‌شوند.'
        : 'Tip: Archive instead. Technical history is never destroyed with the project — it is only detached.'
      }</p>` : `<p style="margin:0 0 10px">${esc(noneMsg)}</p>`}
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
      ${anyLinked ? `<button class="btn" onclick="closeModal();archiveProject('${id}')">📦 ${LANG === 'fa' ? 'بایگانی پروژه' : 'Archive'}</button>` : ''}
      <button class="btn btn-soft-danger" id="pdYes">${IC.trash} ${LANG === 'fa' ? 'حذف دائمی' : 'Delete permanently'}</button>
    </div>
  `, { size: 'sm' });
  $('#pdYes').onclick = async () => {
    closeModal();
    await _doDeleteProject(id);
  };
}
async function _doDeleteProject(id) {
  const rb = optimisticRemove(state.projects, id);
  if (!rb) return;
  const p = rb.removed; // the removed project (for context stamping)
  const pInfo = p ? [p.name, p.customer, p.location].filter(Boolean).join(' — ') : '';
  const stampAll = (list) => { (list || []).forEach(r => { if (r && r.projectId === id) { if (pInfo && !r.projectInfo) r.projectInfo = pInfo; r.projectId = ''; } }); };
  navigate('/projects');
  try {
    await api('/projects/' + id, { method: 'DELETE' });
    // mirror the server-side detach-and-stamp in local state (records survive,
    // keeping the elevator context; checklists are detached, not destroyed)
    state.services.forEach(s => { if (s.projectId === id) { if (p && !s.customer) s.customer = p.customer || p.name || ''; if (p && !s.elevatorInfo) s.elevatorInfo = [p.name, p.location].filter(Boolean).join(' — '); } });
    stampAll(state.services); stampAll(state.measurements); stampAll(state.photos); stampAll(state.invoices);
    stampAll(state.diagSessions); stampAll(state.issues); stampAll(state.contracts); stampAll(state.reminders); stampAll(state.checklists);
    toast(t('deleted'));
  } catch (e) {
    rb.restore();
    toast(errMsg(e), 'err'); render();
  }
}

/* ================= DIGITAL SIGNATURE ================= */
function _sigInk() { return document.documentElement.getAttribute('data-theme') === 'dark' ? '#e5e7eb' : '#0b1220'; }
function sigPadMarkup(prefix, label, existing) {
  const prev = existing ? `<img class="sig-preview" src="${existing}" alt="${esc(label || '')}" style="max-height:64px;margin:6px 0 0;border:1px solid var(--border);border-radius:8px" />` : '';
  return `
    <div class="field span2" style="margin-bottom:10px">
      <label>🖊️ ${esc(label)}</label>
      <div class="sigpad">
        <canvas id="${prefix}_cv" width="640" height="180" style="display:block;width:100%;height:120px;background:var(--bg-soft);border:1.5px solid var(--border);border-radius:10px;touch-action:none;cursor:crosshair"></canvas>
        ${prev}
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px">
          <span style="font-size:11.5px;color:var(--text-3)">${t('signHint')}</span>
          <button type="button" class="btn btn-ghost btn-sm" onclick="clearSignature('${prefix}')">✕ ${t('signClear')}</button>
        </div>
      </div>
    </div>`;
}
function wireSignaturePad(prefix, existing) {
  const cv = document.getElementById(prefix + '_cv');
  if (!cv) return null;
  /* feature-detect 2D canvas without invoking getContext (which logs a
     "not implemented" error in headless/jsdom environments) */
  if (typeof CanvasRenderingContext2D === 'undefined') return null;
  const ctx = cv.getContext && cv.getContext('2d');
  if (!ctx) return null;                       // canvas unsupported → signature feature disabled
  cv.__hasData = !!existing;
  cv.__drawn = false;
  let drawing = false, last = null;
  const pos = e => {
    const r = cv.getBoundingClientRect();
    const px = (e.touches && e.touches.length) ? e.touches[0] : e;
    return { x: (px.clientX - r.left) * (cv.width / Math.max(1, r.width)),
             y: (px.clientY - r.top) * (cv.height / Math.max(1, r.height)) };
  };
  const seg = p => {
    ctx.strokeStyle = _sigInk(); ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  };
  const down = e => {
    drawing = true; last = pos(e); cv.__drawn = true; cv.__hasData = false;
    if (cv.setPointerCapture && e.pointerId != null) { try { cv.setPointerCapture(e.pointerId); } catch (e2) {} }
    e.preventDefault();
  };
  const move = e => { if (drawing) seg(pos(e)); };
  const up = () => { drawing = false; last = null; };
  cv.addEventListener('pointerdown', down);
  cv.addEventListener('pointermove', move);
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  if (existing) {
    const im = new Image();
    im.onload = () => { try { ctx.drawImage(im, 0, 0, cv.width, cv.height); } catch (e) {} };
    im.src = existing;
  }
  return cv;
}
function clearSignature(prefix) {
  const cv = document.getElementById(prefix + '_cv');
  if (!cv) return;
  if (typeof CanvasRenderingContext2D !== 'undefined') {
    const ctx = cv.getContext && cv.getContext('2d');
    if (ctx) ctx.clearRect(0, 0, cv.width, cv.height);
  }
  cv.__drawn = false; cv.__hasData = false;
}
function readSignature(prefix) {
  const cv = document.getElementById(prefix + '_cv');
  if (!cv || !(cv.__drawn || cv.__hasData)) return '';
  try { return cv.toDataURL('image/png'); } catch (e) { return ''; }
}

/* ---- service → stock linkage ----
   While a service form is open, svcPartsDraft holds the parts being recorded:
     { partId?, name, qty }  — partId present = deduct from stock on save.
   On save we only ever consume NEW stock (edits compare against the saved
   record), and a failed consumption never blocks saving the report. */
let svcPartsDraft = [];
let svcPartsOrig = [];        // parts as they were when editing (for diff)
let svcPartsEditingId = null;
function svcPartStock(partId) {
  const p = (state.parts || []).find(x => x.id === partId);
  return p ? +p.qty || 0 : 0;
}
function svcPartsHTML() {
  if (!svcPartsDraft.length) return `<p class="hint" style="margin:4px 0 2px">${t('svcNoParts')}</p>`;
  return svcPartsDraft.map((p, i) => {
    const stock = p.partId ? svcPartStock(p.partId) : null;
    const low = p.partId && (+p.qty || 0) > stock;
    const tag = p.partId
      ? `<span class="tag ${low ? 'low' : ''}">${t('svcStockHint')}: ${faNum(stock)} ${low ? '⚠️' : ''}</span>`
      : `<span class="tag free">${t('svcCustomPart')}</span>`;
    return `<div class="spart">

/* consume the newly-added stock parts for a saved/created service.
   Returns { consumed:[], released:[] } for the caller to update local state. */
async function svcApplyStock(serviceId, projectId) {
  const consumed = [], released = [];
  const origByPart = {};
  (svcPartsOrig || []).forEach(p => { if (p.partId) origByPart[p.partId] = (origByPart[p.partId] || 0) + (+p.qty || 0); });
  const newByPart = {};
  svcPartsDraft.forEach(p => { if (p.partId) newByPart[p.partId] = (newByPart[p.partId] || 0) + (+p.qty || 0); });
  const note = t('svcConsumedNote') + (svcPartsEditingId || serviceId || '').slice(0, 6).toUpperCase();
  for (const partId of Object.keys(newByPart)) {
    const delta = newByPart[partId] - (origByPart[partId] || 0);
    if (delta > 0) {
      try {
        const d = await api('/parts-consume', { method: 'POST', body: { partId, qty: delta, projectId: projectId || '', serviceId, note } });
        consumed.push(d.part);
        warnStockShort(d, d.part && d.part.name);
      } catch (e) { /* stock can't move on — report saved anyway */ }
    } else if (delta < 0) {
      const local = (state.parts || []).find(x => x.id === partId);
      if (local) {
        try {
          const d = await api('/parts/' + partId, { method: 'PUT', body: { qty: (+local.qty || 0) - delta } });
          released.push(d.part);
        } catch (e) {}
      }
    }
  }
  return { consumed, released };
}
