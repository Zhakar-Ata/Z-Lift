<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Z Lift" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>Z Lift — دستیار تکنسین آسانسور</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M10 8h12l-8 7h8L10 24l4-7h-6z' fill='white'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<style>
/* ============ Z Lift — styles ============ */
:root {
  --font: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
  --accent: #2563eb;
  --accent-2: #3b82f6;
  --accent-soft: rgba(37, 99, 235, .12);
  --ok: #16a34a;
  --ok-soft: rgba(22, 163, 74, .12);
  --warn: #d97706;
  --warn-soft: rgba(217, 119, 6, .14);
  --danger: #dc2626;
  --danger-soft: rgba(220, 38, 38, .12);
  --purple: #7c3aed;
  --purple-soft: rgba(124, 58, 237, .12);
  --teal: #0d9488;
  --teal-soft: rgba(13, 148, 136, .12);
  --radius: 16px;
  --radius-sm: 10px;
  --sidebar-w: 264px;
}
html[data-theme="light"] {
  --bg: #f1f5f9;
  --bg-card: #ffffff;
  --bg-soft: #f8fafc;
  --bg-hover: #eef2f7;
  --border: #e2e8f0;
  --text: #0f172a;
  --text-2: #475569;
  --text-3: #94a3b8;
  --shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 4px 16px rgba(15, 23, 42, .05);
  --shadow-lg: 0 8px 32px rgba(15, 23, 42, .14);
}
html[data-theme="dark"] {
  --bg: #0b1220;
  --bg-card: #131c2e;
  --bg-soft: #182339;
  --bg-hover: #1d2a44;
  --border: #253550;
  --text: #e6edf7;
  --text-2: #9fb0c9;
  --text-3: #64748b;
  --shadow: 0 1px 3px rgba(0, 0, 0, .35), 0 6px 20px rgba(0, 0, 0, .25);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, .5);
  --accent-soft: rgba(59, 130, 246, .18);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 14.5px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
html[dir="ltr"] body { letter-spacing: .1px; }
.hidden { display: none !important; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
a { color: var(--accent-2); text-decoration: none; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
::-webkit-scrollbar-track { background: transparent; }

/* ============ auth ============ */
.auth-wrap {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background:
    radial-gradient(700px 400px at 85% -10%, var(--accent-soft), transparent),
    radial-gradient(600px 400px at 0% 110%, var(--purple-soft), transparent),
    var(--bg);
}
.auth-card {
  width: 100%; max-width: 400px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 34px 30px 26px;
  box-shadow: var(--shadow-lg);
}
.auth-logo { text-align: center; margin-bottom: 22px; }
.auth-logo h1 { font-size: 26px; margin-top: 10px; letter-spacing: .5px; }
.auth-logo p { color: var(--text-2); font-size: 13px; }
.logo-badge {
  display: inline-flex; align-items: center; justify-content: center;
  filter: drop-shadow(0 6px 14px rgba(37, 99, 235, .35));
}
.auth-tabs {
  display: flex; background: var(--bg-soft); border: 1px solid var(--border);
  border-radius: 12px; padding: 4px; margin-bottom: 20px;
}
.auth-tabs button {
  flex: 1; border: 0; background: transparent; color: var(--text-2);
  padding: 9px; border-radius: 9px; font-size: 14px; font-weight: 600;
  transition: all .18s;
}
.auth-tabs button.active { background: var(--bg-card); color: var(--text); box-shadow: var(--shadow); }
.auth-error {
  background: var(--danger-soft); color: var(--danger);
  border-radius: var(--radius-sm); padding: 9px 13px; font-size: 13px; margin-bottom: 12px;
}
.auth-demo {
  margin-top: 18px; text-align: center; font-size: 12.5px; color: var(--text-3);
  border-top: 1px dashed var(--border); padding-top: 14px;
}
.auth-demo code {
  background: var(--bg-soft); border: 1px solid var(--border);
  padding: 2px 9px; border-radius: 7px; margin-inline-start: 6px; direction: ltr; display: inline-block;
}

/* ============ fields & buttons ============ */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; background: var(--bg-soft); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 13px; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent-2); box-shadow: 0 0 0 3px var(--accent-soft);
}
.field textarea { resize: vertical; min-height: 84px; }
.field .hint { font-size: 12px; color: var(--text-3); margin-top: 4px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.form-grid .span2 { grid-column: span 2; }
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } .form-grid .span2 { grid-column: span 1; } }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 1.5px solid transparent; border-radius: var(--radius-sm);
  padding: 9px 18px; font-size: 14px; font-weight: 600;
  transition: all .15s; white-space: nowrap;
}
.btn svg { flex-shrink: 0; }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(37, 99, 235, .3); }
.btn-primary:hover { background: var(--accent-2); transform: translateY(-1px); }
.btn-primary:disabled { opacity: .6; transform: none; cursor: wait; }
.btn-ghost { background: transparent; color: var(--text-2); border-color: var(--border); }
.btn-ghost:hover { background: var(--bg-hover); color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { filter: brightness(1.08); }
.btn-soft-danger { background: var(--danger-soft); color: var(--danger); }
.btn-soft-danger:hover { background: var(--danger); color: #fff; }
.btn-block { width: 100%; }
.btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-2); transition: all .15s; font-size: 13px; font-weight: 700;
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text); }

/* ============ app layout ============ */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--bg-card); border-inline-end: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
  z-index: 40;
}
.sidebar-head {
  display: flex; align-items: center; gap: 11px;
  padding: 20px 18px 16px; border-bottom: 1px solid var(--border);
}
.logo-text { display: flex; flex-direction: column; line-height: 1.35; }
.logo-text strong { font-size: 17px; letter-spacing: .4px; }
.logo-text span { font-size: 11px; color: var(--text-3); }
.sidebar-close { display: none; margin-inline-start: auto; }

.nav { flex: 1; overflow-y: auto; padding: 12px 12px; }
.nav-section { font-size: 11px; font-weight: 700; color: var(--text-3); margin: 14px 10px 6px; text-transform: uppercase; letter-spacing: .8px; }
.nav-item {
  display: flex; align-items: center; gap: 11px;
  width: 100%; border: 0; background: transparent; color: var(--text-2);
  padding: 10px 12px; border-radius: 11px; font-size: 14px; font-weight: 500;
  transition: all .14s; text-align: start; margin-bottom: 2px;
}
.nav-item svg { flex-shrink: 0; opacity: .85; }
.nav-item:hover { background: var(--bg-hover); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent-2); font-weight: 700; }
.sidebar-foot { border-top: 1px solid var(--border); padding: 12px; }
.user-chip { display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px;
}
.user-meta { flex: 1; min-width: 0; line-height: 1.35; }
.user-meta strong { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-meta span { font-size: 11.5px; color: var(--text-3); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 13px;
  padding: 14px 26px; position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.menu-btn { display: none; }
.page-title { font-size: 19px; font-weight: 800; flex: 1; }
.topbar-actions { display: flex; gap: 8px; }
.content { padding: 24px 26px 60px; max-width: 1180px; width: 100%; margin: 0 auto; }

.backdrop {
  display: none; position: fixed; inset: 0; z-index: 35;
  background: rgba(2, 6, 23, .5); backdrop-filter: blur(2px);
}
@media (max-width: 960px) {
  .sidebar {
    position: fixed; inset-inline-start: 0; top: 0; bottom: 0;
    transform: translateX(100%); transition: transform .25s ease;
    box-shadow: var(--shadow-lg);
  }
  html[dir="ltr"] .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0) !important; }
  .backdrop.show { display: block; }
  .menu-btn { display: inline-flex; }
  .sidebar-close { display: inline-flex; }
  .content { padding: 18px 14px 70px; }
  .topbar { padding: 12px 14px; }
}

/* ============ cards & grids ============ */
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px;
}
.card + .card { margin-top: 16px; }
.card-title { font-size: 16px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 9px; }
.card-title svg { color: var(--accent-2); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
@media (max-width: 1060px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } .grid-3 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }

/* stat card */
.stat-card { display: flex; align-items: center; gap: 14px; padding: 17px 18px; }
.stat-icon {
  width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.stat-body { line-height: 1.4; min-width: 0; }
.stat-value { font-size: 22px; font-weight: 800; }
.stat-label { font-size: 12.5px; color: var(--text-2); }

/* hero / latest project */
.hero {
  border-radius: 20px; padding: 24px;
  background: linear-gradient(135deg, var(--accent) 0%, #1d4ed8 55%, var(--purple) 130%);
  color: #fff; box-shadow: 0 10px 34px rgba(37, 99, 235, .35);
  position: relative; overflow: hidden;
}
.hero::after {
  content: ''; position: absolute; inset-inline-end: -60px; top: -60px;
  width: 220px; height: 220px; border-radius: 50%;
  background: rgba(255, 255, 255, .09);
}
.hero .eyebrow { font-size: 12px; opacity: .85; font-weight: 600; letter-spacing: .4px; }
.hero h3 { font-size: 22px; margin: 4px 0 2px; }
.hero .sub { font-size: 13.5px; opacity: .9; }
.hero-row { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 14px; font-size: 13px; }
.hero-row .kv { display: flex; align-items: center; gap: 6px; opacity: .95; }
.hero-progress { margin-top: 18px; }
.hero-progress .bar { height: 10px; background: rgba(255, 255, 255, .25); border-radius: 99px; overflow: hidden; }
.hero-progress .fill { height: 100%; background: #fff; border-radius: 99px; transition: width .6s ease; }
.hero-progress .row { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 6px; }
.hero-actions { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; position: relative; z-index: 1; }
.hero-actions .btn { background: rgba(255, 255, 255, .16); color: #fff; border-color: rgba(255, 255, 255, .35); backdrop-filter: blur(4px); }
.hero-actions .btn:hover { background: rgba(255, 255, 255, .28); }

/* quick access tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
.tile {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px 16px; text-align: center; box-shadow: var(--shadow);
  transition: all .16s; cursor: pointer; border-bottom-width: 3px;
}
.tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-bottom-color: var(--accent-2); }
.tile .t-icon {
  width: 50px; height: 50px; margin: 0 auto 10px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
}
.tile strong { display: block; font-size: 14.5px; }
.tile span { font-size: 12px; color: var(--text-3); }

/* badges */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 700; border-radius: 99px; padding: 3px 11px;
}
.badge.b-blue { background: var(--accent-soft); color: var(--accent-2); }
.badge.b-green { background: var(--ok-soft); color: var(--ok); }
.badge.b-amber { background: var(--warn-soft); color: var(--warn); }
.badge.b-red { background: var(--danger-soft); color: var(--danger); }
.badge.b-purple { background: var(--purple-soft); color: var(--purple); }
.badge.b-teal { background: var(--teal-soft); color: var(--teal); }
.badge.b-gray { background: var(--bg-soft); color: var(--text-2); border: 1px solid var(--border); }

/* list rows */
.row-item {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; border: 1px solid var(--border); border-radius: 14px;
  background: var(--bg-card); box-shadow: var(--shadow);
  transition: all .15s; cursor: pointer; margin-bottom: 10px;
}
.row-item:hover { border-color: var(--accent-2); transform: translateY(-1px); }
.row-icon {
  width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.row-body { flex: 1; min-width: 0; line-height: 1.5; }
.row-body strong { display: block; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-body .sub { font-size: 12.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-side { text-align: end; flex-shrink: 0; line-height: 1.5; }
.row-side .date { font-size: 11.5px; color: var(--text-3); display: block; margin-top: 3px; }
.mini-progress { height: 6px; border-radius: 99px; background: var(--bg-soft); border: 1px solid var(--border); overflow: hidden; margin-top: 7px; }
.mini-progress .fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; }

/* toolbar */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.toolbar .search { flex: 1; min-width: 200px; position: relative; }
.toolbar .search input {
  width: 100%; background: var(--bg-card); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 10px 42px 10px 14px; outline: none; box-shadow: var(--shadow);
}
html[dir="ltr"] .toolbar .search input { padding: 10px 14px 10px 42px; }
.toolbar .search svg { position: absolute; inset-inline-start: auto; inset-inline-end: 14px; top: 11px; color: var(--text-3); }
html[dir="ltr"] .toolbar .search svg { inset-inline-end: auto; inset-inline-start: 14px; }
.toolbar .search input:focus { border-color: var(--accent-2); box-shadow: 0 0 0 3px var(--accent-soft); }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  border: 1.5px solid var(--border); background: var(--bg-card); color: var(--text-2);
  border-radius: 99px; padding: 6px 15px; font-size: 13px; font-weight: 600; transition: all .14s;
}
.chip:hover { border-color: var(--accent-2); color: var(--accent-2); }
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* empty / loading / error states */
.empty {
  text-align: center; padding: 54px 20px; color: var(--text-2);
  border: 2px dashed var(--border); border-radius: var(--radius); background: var(--bg-card);
}
.empty .e-icon { font-size: 40px; margin-bottom: 10px; opacity: .9; }
.empty strong { display: block; font-size: 16px; color: var(--text); margin-bottom: 4px; }
.empty p { font-size: 13.5px; margin-bottom: 16px; }
.page-loading { display: flex; justify-content: center; padding: 80px 0; }
.spinner {
  width: 38px; height: 38px; border-radius: 50%;
  border: 3.5px solid var(--border); border-top-color: var(--accent);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-box {
  background: var(--danger-soft); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
  border-radius: var(--radius); padding: 18px; text-align: center;
}

/* skeleton */
.skel { border-radius: 10px; background: linear-gradient(90deg, var(--bg-soft) 25%, var(--bg-hover) 50%, var(--bg-soft) 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ============ modal ============ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(2, 6, 23, .55); backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; padding: 18px;
  animation: fadeIn .18s ease;
}
@keyframes fadeIn { from { opacity: 0; } }
.modal {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 20px; box-shadow: var(--shadow-lg);
  width: 100%; max-width: 640px; max-height: 90vh; display: flex; flex-direction: column;
  animation: popIn .22s cubic-bezier(.2, 1.2, .4, 1);
}
.modal.sm { max-width: 420px; }
.modal.lg { max-width: 780px; }
@keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(.98); } }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px 14px; border-bottom: 1px solid var(--border);
}
.modal-head h3 { font-size: 16.5px; font-weight: 800; }
.modal-body { padding: 20px 22px; overflow-y: auto; }
.modal-foot {
  display: flex; justify-content: flex-end; gap: 10px;
  padding: 14px 22px; border-top: 1px solid var(--border);
}

/* ============ toast ============ */
.toast-root {
  position: fixed; bottom: 20px; inset-inline-start: 50%; transform: translateX(-50%);
  z-index: 200; display: flex; flex-direction: column; gap: 9px; align-items: center; pointer-events: none;
}
html[dir="rtl"] .toast-root { transform: translateX(50%); }
.toast {
  background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
  border-radius: 13px; padding: 11px 20px; box-shadow: var(--shadow-lg);
  font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 9px;
  animation: toastIn .25s ease;
}
.toast.ok { border-inline-start: 4px solid var(--ok); }
.toast.err { border-inline-start: 4px solid var(--danger); }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px); } }

/* ============ details page ============ */
.detail-head { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
.detail-head .grow { flex: 1; min-width: 220px; }
.detail-head h2 { font-size: 22px; }
.detail-head .sub { color: var(--text-2); font-size: 13.5px; margin-top: 3px; }
.detail-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.kv-cell { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px; line-height: 1.5; }
.kv-cell .k { font-size: 11.5px; color: var(--text-3); font-weight: 600; }
.kv-cell .v { font-size: 14px; font-weight: 700; margin-top: 1px; word-break: break-word; }
.note-block { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 25%, transparent); border-radius: 12px; padding: 13px 16px; font-size: 13.5px; white-space: pre-wrap; }
.section-title { display: flex; align-items: center; justify-content: space-between; margin: 26px 0 13px; }
.section-title h3 { font-size: 16px; font-weight: 800; }

/* progress editor */
.progress-edit { display: flex; align-items: center; gap: 14px; }
.progress-edit input[type=range] { flex: 1; accent-color: var(--accent); height: 28px; }
.progress-edit .val { font-weight: 800; font-size: 16px; min-width: 48px; text-align: center; }

/* ============ checklist ============ */
.check-group { margin-bottom: 20px; }
.check-group h4 {
  font-size: 13.5px; font-weight: 800; color: var(--accent-2);
  margin-bottom: 9px; padding-bottom: 6px; border-bottom: 1px dashed var(--border);
}
.check-item {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 9px 11px; border-radius: 10px; transition: background .12s; cursor: pointer;
}
.check-item:hover { background: var(--bg-hover); }
.check-item input { margin-top: 5px; width: 17px; height: 17px; accent-color: var(--ok); flex-shrink: 0; cursor: pointer; }
.check-item.done .ci-text { text-decoration: line-through; color: var(--text-3); }
.ci-text { font-size: 13.8px; }
.ci-ref { font-size: 11px; color: var(--text-3); display: block; }
.check-progress-wrap { position: sticky; top: 68px; z-index: 5; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 13px 18px; box-shadow: var(--shadow); margin-bottom: 16px; }

/* ============ calculators ============ */
.calc-result {
  background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  border-radius: 13px; padding: 14px 18px; margin-top: 14px;
}
.calc-result .r-row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; gap: 12px; }
.calc-result .r-row + .r-row { border-top: 1px dashed color-mix(in srgb, var(--accent) 25%, transparent); }
.calc-result .r-label { font-size: 13px; color: var(--text-2); }
.calc-result .r-val { font-size: 16.5px; font-weight: 800; color: var(--accent-2); direction: ltr; }
.calc-note { font-size: 12.3px; color: var(--text-3); margin-top: 10px; line-height: 1.8; }
.formula { direction: ltr; text-align: left; font-family: ui-monospace, monospace; font-size: 13px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 9px; padding: 8px 13px; margin: 8px 0; color: var(--text-2); overflow-x: auto; }

/* ============ diagnostics ============ */
.diag-item { border: 1px solid var(--border); border-radius: 14px; background: var(--bg-card); margin-bottom: 11px; overflow: hidden; box-shadow: var(--shadow); }
.diag-q { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: transparent; padding: 15px 17px; text-align: start; color: var(--text); font-size: 14.3px; font-weight: 700; }
.diag-q:hover { background: var(--bg-hover); }
.diag-q .chev { margin-inline-start: auto; transition: transform .2s; color: var(--text-3); flex-shrink: 0; }
.diag-item.open .chev { transform: rotate(180deg); }
.diag-a { display: none; padding: 3px 18px 17px; border-top: 1px dashed var(--border); }
.diag-item.open .diag-a { display: block; }
.diag-a h5 { font-size: 12.5px; color: var(--accent-2); margin: 13px 0 5px; }
.diag-a ul { padding-inline-start: 20px; font-size: 13.5px; color: var(--text-2); }
.diag-a li { margin-bottom: 4px; }
.safety-banner {
  display: flex; gap: 11px; align-items: flex-start;
  background: var(--danger-soft); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
  color: var(--danger); border-radius: 13px; padding: 13px 16px; margin-bottom: 18px; font-size: 13.3px; font-weight: 600;
}

/* ============ knowledge ============ */
.kb-card { cursor: pointer; transition: all .15s; }
.kb-card:hover { transform: translateY(-2px); border-color: var(--accent-2); }
.kb-card h4 { font-size: 15px; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
.kb-card p { font-size: 13px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.kb-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.kb-article { font-size: 14.2px; line-height: 2; }
.kb-article h4 { font-size: 15px; color: var(--accent-2); margin: 18px 0 7px; }
.kb-article table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
.kb-article th, .kb-article td { border: 1px solid var(--border); padding: 7px 11px; text-align: start; }
.kb-article th { background: var(--bg-soft); font-weight: 700; }
.kb-article ul { padding-inline-start: 22px; }
mark { background: color-mix(in srgb, var(--warn) 35%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }

/* ============ charts ============ */
.chart-bars { display: flex; align-items: flex-end; gap: 10px; height: 130px; padding-top: 8px; }
.chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.chart-col .bar-v {
  width: 100%; max-width: 44px; border-radius: 8px 8px 4px 4px;
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
  transition: height .5s ease; min-height: 3px; position: relative;
}
.chart-col .bar-num { font-size: 12px; font-weight: 800; color: var(--accent-2); }
.chart-col .bar-lbl { font-size: 10.5px; color: var(--text-3); white-space: nowrap; }
.status-bars .sb-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.status-bars .sb-lbl { font-size: 12.3px; color: var(--text-2); width: 110px; flex-shrink: 0; }
.status-bars .sb-track { flex: 1; height: 9px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 99px; overflow: hidden; }
.status-bars .sb-fill { height: 100%; border-radius: 99px; transition: width .5s; }
.status-bars .sb-val { font-size: 12px; font-weight: 800; width: 22px; text-align: center; }

/* ============ due list ============ */
.due-item { display: flex; align-items: center; gap: 12px; padding: 11px 13px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; background: var(--bg-soft); }
.due-item.overdue { border-color: color-mix(in srgb, var(--danger) 40%, transparent); background: var(--danger-soft); }
.due-item.soon { border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: var(--warn-soft); }
.due-item .grow { flex: 1; min-width: 0; line-height: 1.45; }
.due-item strong { font-size: 13.5px; display: block; }
.due-item .d-sub { font-size: 11.8px; color: var(--text-2); }

/* ============ parts table ============ */
.parts-table { width: 100%; border-collapse: collapse; }
.parts-table th { text-align: start; font-size: 12px; color: var(--text-3); font-weight: 700; padding: 8px 12px; border-bottom: 2px solid var(--border); }
.parts-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); font-size: 13.5px; vertical-align: middle; }
.parts-table tr:hover td { background: var(--bg-hover); }
.parts-table tr { cursor: pointer; }
.parts-table .p-name { font-weight: 700; }
.parts-table .p-sub { font-size: 11.5px; color: var(--text-3); }
.qty-pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; }
.qty-dot { width: 9px; height: 9px; border-radius: 50%; }
.table-wrap { overflow-x: auto; }
@media (max-width: 720px) { .parts-table .hide-sm { display: none; } }

/* ============ print report ============ */
.print-sheet { display: none; }
@media print {
  body * { visibility: hidden; }
  .print-sheet, .print-sheet * { visibility: visible; }
  .print-sheet {
    display: block; position: absolute; inset: 0; padding: 24px;
    background: #fff; color: #000; font-size: 13px;
  }
  .print-sheet h1 { font-size: 19px; text-align: center; margin-bottom: 4px; }
  .print-sheet .ph-sub { text-align: center; font-size: 12px; color: #444; margin-bottom: 18px; }
  .print-sheet table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
  .print-sheet th, .print-sheet td { border: 1px solid #999; padding: 7px 10px; text-align: start; }
  .print-sheet th { background: #f0f0f0; width: 160px; }
  .print-sheet .sig-row { display: flex; gap: 40px; margin-top: 50px; }
  .print-sheet .sig { flex: 1; text-align: center; border-top: 1px solid #666; padding-top: 8px; font-size: 12px; }
}

/* timeline for services in project detail */
.timeline { position: relative; padding-inline-start: 22px; }
.timeline::before { content: ''; position: absolute; inset-inline-start: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
.tl-item { position: relative; margin-bottom: 14px; }
.tl-item::before {
  content: ''; position: absolute; inset-inline-start: -22px; top: 7px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--accent); border: 2.5px solid var(--bg-card); box-shadow: 0 0 0 2px var(--accent);
}
.tl-card { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 12px; padding: 12px 15px; }
.tl-card .tl-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 5px; }
.tl-card .tl-head strong { font-size: 13.8px; }
.tl-card p { font-size: 13px; color: var(--text-2); }

@media (max-width: 640px) {
  .content { padding: 14px 12px 80px; }
  /* stat cards: 2 columns on phones */
  .grid-4 { grid-template-columns: 1fr 1fr !important; gap: 10px; }

  .stat-icon { width: 40px; height: 40px; font-size: 18px !important; }
  .stat-value { font-size: 18px; }
  .stat-label { font-size: 11.5px; }
  /* toolbar: search full-width, chips scroll horizontally, button full width */
  .toolbar { gap: 8px; }
  .toolbar .search { flex-basis: 100%; min-width: 0; order: 1; }
  .toolbar .chip-row {
    order: 3; width: 100%; overflow-x: auto; flex-wrap: nowrap;
    padding-bottom: 3px; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .toolbar .chip-row::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; }
  .toolbar > .btn { order: 2; flex: 1; }
  /* hero */
  .hero { padding: 18px 16px; border-radius: 16px; }
  .hero h3 { font-size: 19px; }
  .hero-row { gap: 8px 14px; font-size: 12.3px; }
  .hero-actions .btn { flex: 1; justify-content: center; }
  /* list rows: stack side info under the body */
  .row-item { flex-wrap: wrap; padding: 12px 13px; gap: 8px 12px; }
  .row-body { flex: 1 1 calc(100% - 58px); }
  .row-side {
    width: 100%; display: flex; align-items: center; gap: 8px;
    justify-content: space-between; text-align: start; margin-top: 2px;
  }
  .row-side .date { margin-top: 0; }
  /* detail page actions */
  .detail-head .actions { width: 100%; }
  .detail-head .actions .btn { flex: 1; }
  /* modals become bottom sheets */
  .modal-overlay { padding: 0; align-items: flex-end; }
  .modal { max-width: 100% !important; max-height: 93vh; border-radius: 22px 22px 0 0; animation: sheetIn .25s ease; }
  @keyframes sheetIn { from { transform: translateY(48px); opacity: .5; } }
  .modal-body { padding: 16px 16px; }
  .modal-head { padding: 15px 16px 12px; }
  .modal-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); flex-wrap: wrap; }
  .modal-foot .btn { flex: 1; }
  /* charts & misc */
  .chart-bars { height: 105px; gap: 6px; }
  .status-bars .sb-lbl { width: 86px; font-size: 11.3px; }
  .tiles { gap: 10px; }
  .tile { padding: 14px 8px; }
  .tile strong { font-size: 13px; }
  .section-title { margin: 20px 0 10px; }
  .card { padding: 15px 14px; }
  .kb-article { font-size: 13.5px; }

  .icon-btn { width: 42px; height: 42px; }

  .field input, .field select, .field textarea { padding: 12px 13px; font-size: 16px; }

}
/* very narrow phones */

let LANG = localStorage.getItem('zlift_lang') || 'fa';
function t(key) { return (I18N[LANG] && I18N[LANG][key]) || I18N.fa[key] || key; }
function faNum(n) {
  if (LANG !== 'fa') return String(n);
  return String(n).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}
function fmtDate(ts) {
  const d = new Date(ts);
  try {
    return new Intl.DateTimeFormat(LANG === 'fa' ? 'fa-IR' : 'en-GB', { year: 'numeric', month: 'short', day: 'numeric' }).format(d);
  } catch (e) { return d.toLocaleDateString(); }
}
function fmtDateTime(ts) {
  const d = new Date(ts);
  try {
    return new Intl.DateTimeFormat(LANG === 'fa' ? 'fa-IR' : 'en-GB', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(d);
  } catch (e) { return d.toLocaleString(); }
}

const CALCULATORS = [
  {

    title: { fa: 'ظرفیت کابین و مساحت مجاز', en: 'Car capacity & allowed area' },
    desc: { fa: 'تبدیل ظرفیت به تعداد نفر و کنترل حداکثر مساحت کابین طبق EN 81-20', en: 'Capacity to persons and max car area per EN 81-20' },

    inputs: [
      { id: 'load', label: { fa: 'ظرفیت نامی (kg)', en: 'Rated load (kg)' }, value: 630 }

    compute(v) {
      const persons = Math.floor(v.load / 75);
      const table = [[100,.37],[180,.58],[225,.7],[300,.9],[375,1.1],[400,1.17],[450,1.3],[525,1.45],[600,1.6],[630,1.66],[675,1.75],[750,1.9],[800,2],[825,2.05],[900,2.2],[975,2.35],[1000,2.4],[1050,2.5],[1125,2.65],[1200,2.8],[1250,2.9],[1275,2.95],[1350,3.1],[1425,3.25],[1500,3.4],[1600,3.56],[2000,4.2],[2500,5]];
      let area = null;
      for (const [l, a] of table) { if (v.load <= l) { area = a; break; } }
      if (area === null) area = 5 + (v.load - 2500) * 0.16 / 100;
      return [
        { label: { fa: 'تعداد نفر', en: 'Persons' }, val: persons + (LANG === 'fa' ? ' نفر' : ' persons') },
        { label: { fa: 'حداکثر مساحت مجاز کابین', en: 'Max allowed car area' }, val: area.toFixed(2) + ' m²' }
      ];
    },

      { id: 'eff', label: { fa: 'بازده کل (٪)', en: 'Overall efficiency (%)' }, value: 60 }
    ],
    compute(v) {
      const p = ((1 - v.cb / 100) * v.q * 9.81 * v.v) / (1000 * (v.eff / 100));
      const geared = p, gearless = ((1 - v.cb / 100) * v.q * 9.81 * v.v) / (1000 * 0.8);

        { label: { fa: 'توان محاسبه‌شده', en: 'Calculated power' }, val: p.toFixed(2) + ' kW' },
        { label: { fa: 'پیشنهاد با حاشیه ~۱۵٪', en: 'Suggested with ~15% margin' }, val: (p * 1.15).toFixed(2) + ' kW' },

  },
  {

  },
  {
    id: 'c4',

    desc: { fa: 'کنترل ضریب اطمینان بکسل‌ها (حداقل ۱۲ طبق EN 81-20)', en: 'Check rope safety factor (min 12 per EN 81-20)' },
    formula: 'SF = (n × F_break) / ((P + Q) × g / roping)',
    inputs: [
      { id: 'n', label: { fa: 'تعداد بکسل', en: 'Number of ropes' }, value: 5 },
      { id: 'fb', label: { fa: 'نیروی گسیختگی هر بکسل (kN)', en: 'Breaking force per rope (kN)' }, value: 55 },

    id: 'c5',

  },
  {
    id: 'c6',
    title: { fa: 'هیدرولیک: دبی پمپ و توان', en: 'Hydraulic: pump flow & power' },
    desc: { fa: 'دبی لازم برای سرعت کابین و توان موتور پاوریونیت', en: 'Flow for car speed and unit motor power' },

    inputs: [
      { id: 'd', label: { fa: 'قطر پیستون (mm)', en: 'Ram diameter (mm)' }, value: 85 },
      { id: 'v', label: { fa: 'سرعت کابین (m/s)', en: 'Car speed (m/s)' }, value: 0.6, step: 0.1 },

      { id: 'rop', label: { fa: 'سیستم (1 مستقیم / 2 غیرمستقیم)', en: 'System (1 direct / 2 indirect)' }, value: 1 },

    },

  },
  {
    id: 'c7',

  },
  {
    id: 'c8',
    title: { fa: 'کابل و فیوز موتور', en: 'Motor cable & fuse sizing' },
    desc: { fa: 'جریان نامی موتور سه‌فاز و پیشنهاد سطح مقطع کابل', en: 'Three-phase motor current and cable suggestion' },
    formula: 'I = P / (√3 × U × cosφ × η)',
    inputs: [
      { id: 'p', label: { fa: 'توان موتور (kW)', en: 'Motor power (kW)' }, value: 7.5, step: 0.5 },
      { id: 'u', label: { fa: 'ولتاژ خط (V)', en: 'Line voltage (V)' }, value: 380 },

      { id: 'eff', label: { fa: 'بازده موتور (٪)', en: 'Motor efficiency (%)' }, value: 88 }
    ],
    compute(v) {
      const I = v.p * 1000 / (Math.sqrt(3) * v.u * v.pf * v.eff / 100);
      let cable = '4 mm²';
      if (I > 25) cable = '6 mm²';
      if (I > 32) cable = '10 mm²';
      if (I > 45) cable = '16 mm²';
      if (I > 62) cable = '25 mm²';
      if (I <= 18) cable = '2.5 mm²';
      const fuse = [10,16,20,25,32,40,50,63,80,100].find(f => f >= I * 1.25) || 125;
      return [
        { label: { fa: 'جریان نامی', en: 'Rated current' }, val: I.toFixed(1) + ' A' },

  }

const state = {
  token: localStorage.getItem('zlift_token') || null,
  user: null,
  projects: null,
  services: null,

  checklists: null,

};

/* ---------- api ---------- */
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch('/api' + path, {
    method: opts.method || 'GET',
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (res.status === 401 && !path.startsWith('/auth/')) {
    doLocalLogout();
    throw new Error('unauthorized');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || 'error'); e.code = data.error; e.status = res.status; throw e; }
  return data;
}

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = (type === 'ok' ? '✅' : '⚠️') + ' <span>' + esc(msg) + '</span>';
  $('#toastRoot').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }, 2600);
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

  document.documentElement.setAttribute('data-theme', th);
  $('#iconMoon').classList.toggle('hidden', th === 'dark');
  $('#iconSun').classList.toggle('hidden', th !== 'dark');
}
function applyLang() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = I18N[LANG].dir;
  $('#langLabel').textContent = LANG === 'fa' ? 'EN' : 'فا';
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });

/* ---------- modal ---------- */
function openModal(html, opts = {}) {
  closeModal();
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal-overlay" id="modalOverlay"><div class="modal ${opts.size || ''}">${html}</div></div>`;
  $('#modalOverlay').addEventListener('mousedown', e => { if (e.target.id === 'modalOverlay') closeModal(); });
  document.addEventListener('keydown', escClose);
}
function escClose(e) { if (e.key === 'Escape') closeModal(); }
function closeModal() { $('#modalRoot').innerHTML = ''; document.removeEventListener('keydown', escClose); }
function confirmDialog(title, msg, onYes) {
  openModal(`
    <div class="modal-head"><h3>⚠️ ${esc(title)}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body"><p style="font-size:14px;color:var(--text-2)">${esc(msg)}</p></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn btn-danger" id="confirmYes">${t('yesDelete')}</button>
    </div>`, { size: 'sm' });

}

/* ---------- data loading ---------- */
async function loadAll(force) {
  if (state.projects && !force) return;
  const [p, s, n, c, pa, st] = await Promise.all([
    api('/projects'), api('/services'), api('/notes'), api('/checklists'), api('/parts'), api('/settings')
  ]);
  state.projects = p.projects;
  state.services = s.services;
  state.notes = n.notes;
  state.checklists = c.checklists;
  state.parts = pa.parts;
  state.settings = st.settings;
}

/* service-due calculation */
function dueInfo(p) {
  if (!p.serviceIntervalDays) return null;
  const svc = state.services.filter(s => s.projectId === p.id && (s.serviceType === 'maintenance' || s.serviceType === 'repair'));
  const last = svc.length ? Math.max(...svc.map(s => s.date)) : p.createdAt;
  const next = last + p.serviceIntervalDays * 86400000;
  const days = Math.round((next - Date.now()) / 86400000);
  return { last, next, days, overdue: days < 0, soon: days >= 0 && days <= 7 };
}
function projName(id) { const p = (state.projects || []).find(x => x.id === id); return p ? p.name : '—'; }

/* ================= AUTH ================= */
let authMode = 'login';
function showAuth() {
  $('#authView').classList.remove('hidden');
  $('#appView').classList.add('hidden');
}
function doLocalLogout() {
  state.token = null; state.user = null;
  state.projects = state.services = state.notes = state.checklists = null;
  localStorage.removeItem('zlift_token');
  showAuth();
}
async function initAuth() {
  $('#tabLogin').onclick = () => setAuthMode('login');
  $('#tabRegister').onclick = () => setAuthMode('register');
  $('#authForm').onsubmit = async e => {
    e.preventDefault();
    const btn = $('#authSubmit'); btn.disabled = true;
    $('#authError').classList.add('hidden');
    try {
      const body = {
        username: $('#authUsername').value.trim(),
        password: $('#authPassword').value,
        name: $('#authName').value.trim()
      };
      const d = await api('/auth/' + authMode, { method: 'POST', body });
      state.token = d.token; state.user = d.user;
      localStorage.setItem('zlift_token', d.token);
      enterApp();
    } catch (err) {
      const map = { invalid_credentials: 'errInvalidCred', username_taken: 'errUserTaken', weak_password: 'errWeakPass', bad_username: 'errBadUser' };
      $('#authError').textContent = t(map[err.code] || 'errGeneric');
      $('#authError').classList.remove('hidden');
    } finally { btn.disabled = false; }
  };
}
function setAuthMode(m) {
  authMode = m;
  $('#tabLogin').classList.toggle('active', m === 'login');
  $('#tabRegister').classList.toggle('active', m === 'register');
  $('#nameField').classList.toggle('hidden', m === 'login');
  $('#authSubmit').textContent = m === 'login' ? t('loginBtn') : t('registerBtn');
}

/* ================= APP SHELL ================= */
function enterApp() {
  $('#authView').classList.add('hidden');
  $('#appView').classList.remove('hidden');
  $('#userName').textContent = state.user.name;
  $('#userAvatar').textContent = (state.user.name || '?').trim()[0] || '?';
  renderNav();
  navigate(state.route || '/dashboard');
}
const NAV = [
  { section: 'navMain' },
  { route: '/dashboard', key: 'dashboard', icon: 'dash' },
  { route: '/projects', key: 'projects', icon: 'proj' },
  { route: '/services', key: 'services', icon: 'svc' },
  { route: '/parts', key: 'parts', icon: 'box' },
  { section: 'navTools' },
  { route: '/checklists', key: 'checklists', icon: 'check' },
  { route: '/calculations', key: 'calculations', icon: 'calc' },
  { route: '/diagnostics', key: 'diagnostics', icon: 'diag' },
  { section: 'navKnowledge' },
  { route: '/knowledge', key: 'knowledge', icon: 'kb' },
  { route: '/notes', key: 'notes', icon: 'note' }
];
function renderNav() {
  const nav = $('#mainNav');
  nav.innerHTML = NAV.map(item => {
    if (item.section) return `<div class="nav-section">${t(item.section)}</div>`;
    const active = state.route === item.route || state.route.startsWith(item.route + '/');
    return `<button class="nav-item ${active ? 'active' : ''}" data-route="${item.route}">${IC[item.icon]}<span>${t(item.key)}</span></button>`;
  }).join('');
  nav.querySelectorAll('.nav-item').forEach(b => b.onclick = () => { navigate(b.dataset.route); closeSidebar(); });
}
function closeSidebar() { $('#sidebar').classList.remove('open'); $('#backdrop').classList.remove('show'); }

/* ================= ROUTER ================= */
function navigate(route) {
  state.route = route;
  location.hash = route;
  render();
}
window.addEventListener('hashchange', () => {
  const r = location.hash.slice(1) || '/dashboard';
  if (r !== state.route) { state.route = r; if (state.user) render(); }
});

async function render() {
  renderNav();
  const c = $('#content');
  const r = state.route;
  const titles = {
    '/dashboard': 'dashboard', '/projects': 'projects', '/services': 'services',
    '/parts': 'parts', '/checklists': 'checklists', '/calculations': 'calculations',
    '/diagnostics': 'diagnostics', '/knowledge': 'knowledge', '/notes': 'notes'
  };
  const baseRoute = '/' + r.split('/')[1];
  $('#pageTitle').textContent = t(titles[baseRoute] || 'dashboard');
  c.innerHTML = '<div class="page-loading"><div class="spinner"></div></div>';
  try {
    await loadAll();
    if (r === '/dashboard') renderDashboard();
    else if (r === '/projects') renderProjects();
    else if (r.startsWith('/projects/')) renderProjectDetail(r.split('/')[2]);
    else if (r === '/services') renderServices();
    else if (r === '/parts') renderParts();
    else if (r === '/checklists') renderChecklists();
    else if (r.startsWith('/checklists/')) renderChecklistDetail(r.split('/')[2]);
    else if (r === '/calculations') renderCalculations();
    else if (r === '/diagnostics') renderDiagnostics();
    else if (r === '/knowledge') renderKnowledge();
    else if (r === '/notes') renderNotes();
    else renderDashboard();
  } catch (e) {
    if (e.message === 'unauthorized') return;
    c.innerHTML = `<div class="error-box"><p style="font-weight:700;margin-bottom:10px">⚠️ ${t('loadError')}</p><button class="btn btn-primary" onclick="render()">${t('retry')}</button></div>`;
  }
}

    ['tKb', 'tKbSub', '/knowledge', 'kb', 'var(--danger-soft)', 'var(--danger)'],

  const dues = projects

    const e2 = new Date(d); e2.setMonth(e2.getMonth() + 1);

    <div class="grid-4" style="margin-top:18px">
      ${statCard('🏗️', 'var(--accent-soft)', stats.projects, 'stTotalProjects')}
      ${statCard('⚡', 'var(--warn-soft)', stats.active, 'stActive')}
      ${statCard('🔧', 'var(--teal-soft)', stats.services, 'stServices')}
      ${statCard('📅', 'var(--ok-soft)', stats.month, 'stMonth')}
    </div>
    <div class="grid-2" style="margin-top:16px">
      <div class="card">
        <div class="card-title">⏰ ${t('svcDue')}</div>
        ${dueHtml}
        ${low.length ? `<div class="due-item soon" style="margin-top:12px">
          <span style="font-size:19px">📦</span>
          <div class="grow"><strong>${t('stockAlert')}</strong>
          <span class="d-sub">${faNum(low.length)} ${t('stockAlertSub')}: ${low.slice(0, 3).map(x => esc(x.name)).join('، ')}${low.length > 3 ? ' …' : ''}</span></div>
          <button class="btn btn-ghost btn-sm" onclick="navigate('/parts')">${t('viewAll')}</button>
        </div>` : ''}
      </div>
      <div class="card">
        <div class="card-title">📈 ${t('monthlyChart')}</div>
        ${chartHtml}
      </div>
    </div>
    <div class="grid-2" style="margin-top:16px">
      <div class="card">
        <div class="card-title">📊 ${t('statusChart')}</div>
        ${statusHtml}
      </div>
      <div class="card">
        <div class="card-title">🔧 ${t('recentServices')} <button class="btn btn-ghost btn-sm" style="margin-inline-start:auto" onclick="navigate('/services')">${t('viewAll')}</button></div>
        ${recent.length ? recent.map(serviceRow).join('') : `<p style="font-size:13px;color:var(--text-3)">${t('noServices')}</p>`}
      </div>
    </div>
    <div class="section-title"><h3>${t('quickAccess')}</h3></div>
    <div class="tiles">${tiles}</div>
  `;
}

    <div class="stat-body"><div class="stat-value">${faNum(val)}</div><div class="stat-label">${t(key)}</div></div></div>`;

function renderChecklistDetail(idWithQuery) {
  const [tid, query] = idWithQuery.split('?');
  const params = new URLSearchParams(query || '');
  let selectedProject = params.get('project') || '';
  const tp = CHECKLIST_TEMPLATES.find(x => x.id === tid);
  const c = $('#content');
  if (!tp) { c.innerHTML = `<div class="empty"><strong>${t('notFound')}</strong></div>`; return; }
  const eligible = state.projects.filter(p => p.elevatorType === tp.type);
  if (selectedProject && !eligible.find(p => p.id === selectedProject)) selectedProject = '';

  function getInst() {
    return selectedProject ? state.checklists.find(x => x.projectId === selectedProject && x.templateId === tid) : null;
  }

  function draw() {
    const inst = getInst();
    const checked = inst ? inst.checked : {};
    const total = tp.groups.reduce((a, g) => a + g.items.length, 0);
    const done = Object.keys(checked).filter(k => checked[k]).length;
    const pct = total ? Math.round(done / total * 100) : 0;
    c.innerHTML = `
      <button class="btn btn-ghost btn-sm" onclick="navigate('/checklists')" style="margin-bottom:14px">${IC.back} ${t('checklists')}</button>
      <div class="detail-head">
        <div class="grow">
          <h2 style="font-size:19px">${tp.kind === 'install' ? '🏗️' : '🔧'} ${esc(tp.title[LANG] || tp.title.fa)}</h2>
          <div class="sub">${typeBadge(tp.type)}</div>
        </div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="field" style="margin-bottom:0">
          <label>${t('chSelectProject')}</label>
          <select id="chProject">
            <option value="">${t('chNoProject')}</option>
            ${eligible.map(p => `<option value="${p.id}" ${selectedProject === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
          </select>
        </div>
      </div>
      ${selectedProject ? `
      <div class="check-progress-wrap">
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:7px">
          <span>${t('chProgress')}</span><span>${faNum(done)}/${faNum(total)} — ${faNum(pct)}٪</span>
        </div>
        <div class="mini-progress" style="height:9px;margin:0"><div class="fill" style="width:${pct}%"></div></div>
      </div>` : ''}
      <div class="card">
        ${tp.groups.map(g => `
          <div class="check-group">
            <h4>${esc(g.title[LANG] || g.title.fa)}</h4>
            ${g.items.map(it => {
              const isOn = !!checked[it.id];
              return `<label class="check-item ${isOn ? 'done' : ''}">
                <input type="checkbox" data-item="${it.id}" ${isOn ? 'checked' : ''} ${selectedProject ? '' : ''} />
                <span><span class="ci-text">${esc(it[LANG] || it.fa)}</span>${it.ref ? `<span class="ci-ref">📖 ${esc(it.ref)}</span>` : ''}</span>
              </label>`;
            }).join('')}
          </div>`).join('')}
        <p class="calc-note">📖 ${t('standardRef')}</p>
      </div>`;

    $('#chProject').onchange = e => {
      selectedProject = e.target.value;
      history.replaceState(null, '', '#/checklists/' + tid + (selectedProject ? '?project=' + selectedProject : ''));
      draw();
    };

    const save = debounce(async () => {
      const inst2 = getInst();
      if (!inst2) return;
      try { await api('/checklists', { method: 'POST', body: { projectId: selectedProject, templateId: tid, checked: inst2.checked } }); }
      catch (e) { toast(t('errGeneric'), 'err'); }
    }, 500);

    c.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.onchange = async () => {
        if (!selectedProject) { // view-only visual toggle
          cb.closest('.check-item').classList.toggle('done', cb.checked);
          return;
        }
        let inst2 = getInst();
        if (!inst2) {
          inst2 = { id: 'tmp', projectId: selectedProject, templateId: tid, checked: {}, updatedAt: Date.now() };
          state.checklists.push(inst2);
          try {
            const d = await api('/checklists', { method: 'POST', body: { projectId: selectedProject, templateId: tid, checked: {} } });
            inst2.id = d.checklist.id;
          } catch (e) {}
        }
        inst2.checked[cb.dataset.item] = cb.checked;
        cb.closest('.check-item').classList.toggle('done', cb.checked);
        // update progress bar without full redraw
        const total2 = tp.groups.reduce((a, g) => a + g.items.length, 0);
        const done2 = Object.keys(inst2.checked).filter(k => inst2.checked[k]).length;
        const pct2 = Math.round(done2 / total2 * 100);
        const wrap = c.querySelector('.check-progress-wrap');
        if (wrap) {
          wrap.querySelector('.fill').style.width = pct2 + '%';
          wrap.querySelectorAll('span')[1].textContent = `${faNum(done2)}/${faNum(total2)} — ${faNum(pct2)}٪`;
        }
        save();
      };
    });
  }
  draw();
}

let _lsDB = null;
function _lsLoad() {
  if (_lsDB) return _lsDB;
  try { _lsDB = JSON.parse(localStorage.getItem('zlift_db')); } catch (e) { _lsDB = null; }
  if (!_lsDB || !_lsDB.users) { _lsDB = _lsSeed(); _lsSave(); }
  if (!_lsDB.parts) _lsDB.parts = _lsSeed().parts;
  if (!_lsDB.settings) _lsDB.settings = { company: 'Z Lift', phone: '', address: '' };
  return _lsDB;
}
function _lsSave() { try { localStorage.setItem('zlift_db', JSON.stringify(_lsDB)); } catch (e) {} }
function _lsErr(code, status) { const e = new Error(code); e.code = code; e.status = status || 400; return e; }

/* ---- OVERRIDES the server api() from app.js ---- */
async function api(path, opts = {}) {
  const db = _lsLoad();
  const method = (opts.method || 'GET').toUpperCase();
  const b = opts.body || {};
  const parts = path.split('?')[0].split('/').filter(Boolean);

  /* auth */
  if (path === '/auth/login' && method === 'POST') {
    const u = db.users.find(x => x.username === String(b.username || '').trim().toLowerCase());
    if (!u || u.password !== _lsHash(String(b.password || ''))) throw _lsErr('invalid_credentials', 401);
    const token = _lsUid() + _lsUid();
    db.sessions[token] = { userId: u.id, createdAt: Date.now() };
    _lsSave();
    return { token, user: { id: u.id, username: u.username, name: u.name, role: u.role } };
  }
  if (path === '/auth/register' && method === 'POST') {
    const username = String(b.username || '').trim().toLowerCase();
    if (!username || username.length < 3) throw _lsErr('bad_username');
    if (String(b.password || '').length < 6) throw _lsErr('weak_password');
    if (db.users.find(x => x.username === username)) throw _lsErr('username_taken', 409);
    const u = { id: _lsUid(), username, name: String(b.name || '').trim() || username, password: _lsHash(String(b.password)), role: 'technician', createdAt: Date.now() };
    db.users.push(u);
    const token = _lsUid() + _lsUid();
    db.sessions[token] = { userId: u.id, createdAt: Date.now() };
    _lsSave();
    return { token, user: { id: u.id, username: u.username, name: u.name, role: u.role } };
  }

  const sess = state.token && db.sessions[state.token];
  const me = sess ? db.users.find(u => u.id === sess.userId) : null;
  if (!me && !path.startsWith('/auth/')) { doLocalLogout(); throw _lsErr('unauthorized', 401); }

  if (path === '/auth/logout') { if (state.token) delete db.sessions[state.token]; _lsSave(); return { ok: true }; }
  if (path === '/auth/me') {
    if (!me) throw _lsErr('unauthorized', 401);
    return { user: { id: me.id, username: me.username, name: me.name, role: me.role } };
  }

  /* projects */
  if (path === '/projects' && method === 'GET') return { projects: [...db.projects].sort((a, c) => c.updatedAt - a.updatedAt) };
  if (path === '/projects' && method === 'POST') {
    if (!b.name || !String(b.name).trim()) throw _lsErr('name_required');
    const p = {
      id: _lsUid(), name: String(b.name).trim(), customer: String(b.customer || ''), phone: String(b.phone || ''),
      location: String(b.location || ''), elevatorType: b.elevatorType === 'hydraulic' ? 'hydraulic' : 'traction',
      capacityKg: +b.capacityKg || 0, persons: +b.persons || 0, floors: +b.floors || 0, stops: +b.stops || 0,
      speed: +b.speed || 0, controller: String(b.controller || ''), motor: String(b.motor || ''),
      status: b.status || 'contract', progress: Math.max(0, Math.min(100, +b.progress || 0)),
      serviceIntervalDays: +b.serviceIntervalDays || 0, notes: String(b.notes || ''),
      createdAt: Date.now(), updatedAt: Date.now()
    };
    db.projects.push(p); _lsSave();
    return { project: p };
  }
  if (parts[0] === 'projects' && parts[1]) {
    const p = db.projects.find(x => x.id === parts[1]);
    if (!p) throw _lsErr('not_found', 404);
    if (method === 'GET') return { project: p, services: db.services.filter(s => s.projectId === p.id), checklists: db.checklists.filter(c => c.projectId === p.id) };
    if (method === 'PUT') {
      ['name', 'customer', 'phone', 'location', 'elevatorType', 'controller', 'motor', 'status', 'notes'].forEach(f => { if (b[f] !== undefined) p[f] = String(b[f]); });
      ['capacityKg', 'persons', 'floors', 'stops', 'speed', 'serviceIntervalDays'].forEach(f => { if (b[f] !== undefined) p[f] = +b[f] || 0; });
      if (b.progress !== undefined) p.progress = Math.max(0, Math.min(100, +b.progress || 0));
      if (p.elevatorType !== 'hydraulic') p.elevatorType = 'traction';
      p.updatedAt = Date.now(); _lsSave();
      return { project: p };
    }
    if (method === 'DELETE') {
      db.projects = db.projects.filter(x => x.id !== p.id);
      db.services = db.services.filter(s => s.projectId !== p.id);
      db.checklists = db.checklists.filter(c => c.projectId !== p.id);
      _lsSave();
      return { ok: true };
    }
  }

  /* services */
  if (path === '/services' && method === 'GET') return { services: [...db.services].sort((a, c) => c.date - a.date) };
  if (path === '/services' && method === 'POST') {
    if (!b.projectId || !db.projects.find(x => x.id === b.projectId)) throw _lsErr('project_required');
    const s = {
      id: _lsUid(), projectId: b.projectId, date: +b.date || Date.now(),
      technician: String(b.technician || (me && me.name) || ''),
      serviceType: ['maintenance', 'repair', 'emergency', 'inspection'].includes(b.serviceType) ? b.serviceType : 'maintenance',
      problem: String(b.problem || ''), diagnosis: String(b.diagnosis || ''),
      workDone: String(b.workDone || ''), partsReplaced: String(b.partsReplaced || ''),
      finalStatus: ['ok', 'followup', 'outoforder'].includes(b.finalStatus) ? b.finalStatus : 'ok',
      createdAt: Date.now()
    };
    db.services.push(s); _lsSave();
    return { service: s };
  }
  if (parts[0] === 'services' && parts[1]) {
    const s = db.services.find(x => x.id === parts[1]);
    if (!s) throw _lsErr('not_found', 404);
    if (method === 'PUT') {
      ['technician', 'problem', 'diagnosis', 'workDone', 'partsReplaced'].forEach(f => { if (b[f] !== undefined) s[f] = String(b[f]); });
      if (b.projectId && db.projects.find(x => x.id === b.projectId)) s.projectId = b.projectId;
      if (b.date !== undefined) s.date = +b.date || s.date;
      if (b.serviceType && ['maintenance', 'repair', 'emergency', 'inspection'].includes(b.serviceType)) s.serviceType = b.serviceType;
      if (b.finalStatus && ['ok', 'followup', 'outoforder'].includes(b.finalStatus)) s.finalStatus = b.finalStatus;
      _lsSave();
      return { service: s };
    }
    if (method === 'DELETE') { db.services = db.services.filter(x => x.id !== s.id); _lsSave(); return { ok: true }; }
  }

  /* notes */
  if (path === '/notes' && method === 'GET') return { notes: [...db.notes].sort((a, c) => c.createdAt - a.createdAt) };
  if (path === '/notes' && method === 'POST') {
    if (!b.title || !String(b.title).trim()) throw _lsErr('title_required');
    const n = { id: _lsUid(), title: String(b.title).trim(), content: String(b.content || ''), tags: Array.isArray(b.tags) ? b.tags.map(String).slice(0, 10) : [], createdAt: Date.now() };
    db.notes.push(n); _lsSave();
    return { note: n };
  }
  if (parts[0] === 'notes' && parts[1]) {
    const n = db.notes.find(x => x.id === parts[1]);
    if (!n) throw _lsErr('not_found', 404);
    if (method === 'PUT') {
      if (b.title !== undefined) n.title = String(b.title);
      if (b.content !== undefined) n.content = String(b.content);
      if (Array.isArray(b.tags)) n.tags = b.tags.map(String).slice(0, 10);
      _lsSave();
      return { note: n };
    }
    if (method === 'DELETE') { db.notes = db.notes.filter(x => x.id !== n.id); _lsSave(); return { ok: true }; }
  }

  /* checklists */
  if (path === '/checklists' && method === 'GET') return { checklists: db.checklists };
  if (path === '/checklists' && method === 'POST') {
    if (!b.projectId || !b.templateId) throw _lsErr('bad_request');
    let c = db.checklists.find(x => x.projectId === b.projectId && x.templateId === b.templateId);
    if (!c) { c = { id: _lsUid(), projectId: b.projectId, templateId: String(b.templateId), checked: {}, updatedAt: Date.now() }; db.checklists.push(c); }
    if (b.checked && typeof b.checked === 'object') c.checked = b.checked;
    c.updatedAt = Date.now(); _lsSave();
    return { checklist: c };
  }

  /* parts */
  if (path === '/parts' && method === 'GET') return { parts: [...db.parts].sort((a, c) => a.name.localeCompare(c.name, 'fa')) };
  if (path === '/parts' && method === 'POST') {
    if (!b.name || !String(b.name).trim()) throw _lsErr('name_required');
    const part = { id: _lsUid(), name: String(b.name).trim(), category: String(b.category || 'عمومی'), unit: String(b.unit || 'عدد'), qty: +b.qty || 0, minQty: +b.minQty || 0, price: +b.price || 0, location: String(b.location || ''), note: String(b.note || ''), updatedAt: Date.now() };
    db.parts.push(part); _lsSave();
    return { part };
  }
  if (parts[0] === 'parts' && parts[1]) {
    const part = db.parts.find(x => x.id === parts[1]);
    if (!part) throw _lsErr('not_found', 404);
    if (method === 'PUT') {
      ['name', 'category', 'unit', 'location', 'note'].forEach(f => { if (b[f] !== undefined) part[f] = String(b[f]); });
      ['qty', 'minQty', 'price'].forEach(f => { if (b[f] !== undefined) part[f] = +b[f] || 0; });
      part.updatedAt = Date.now(); _lsSave();
      return { part };
    }
    if (method === 'DELETE') { db.parts = db.parts.filter(x => x.id !== part.id); _lsSave(); return { ok: true }; }
  }

  /* settings */
  if (path === '/settings' && method === 'GET') return { settings: db.settings };
  if (path === '/settings' && method === 'PUT') {
    ['company', 'phone', 'address'].forEach(f => { if (b[f] !== undefined) db.settings[f] = String(b[f]); });
    _lsSave();
    return { settings: db.settings };
  }

  throw _lsErr('not_found', 404);
}

init();
</script>
  <script>
    /* PWA: service worker + install prompt */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
    let _deferredInstall = null;
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      _deferredInstall = e;
      const btn = document.getElementById('installBtn');
      if (btn) btn.classList.remove('hidden');
    });
    function promptInstall() {
      if (!_deferredInstall) return;
      _deferredInstall.prompt();
      _deferredInstall.userChoice.finally(() => {
        _deferredInstall = null;
        const btn = document.getElementById('installBtn');
        if (btn) btn.classList.add('hidden');
      });
    }
    window.addEventListener('appinstalled', () => {
      const btn = document.getElementById('installBtn');
      if (btn) btn.classList.add('hidden');
    });
  </script>
