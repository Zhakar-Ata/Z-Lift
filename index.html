<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Z Lift" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>Z Lift — دستیار تکنسین آسانسور</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M10 8h12l-8 7h8L10 24l4-7h-6z' fill='white'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<style>
/* ============ Z Lift — styles ============ */
:root {
  --font: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
  --accent: #2563eb;
  --accent-2: #3b82f6;
  --accent-soft: rgba(37, 99, 235, .12);
  --ok: #16a34a;
  --ok-soft: rgba(22, 163, 74, .12);
  --warn: #d97706;
  --warn-soft: rgba(217, 119, 6, .14);
  --danger: #dc2626;
  --danger-soft: rgba(220, 38, 38, .12);
  --purple: #7c3aed;
  --purple-soft: rgba(124, 58, 237, .12);
  --teal: #0d9488;
  --teal-soft: rgba(13, 148, 136, .12);
  --radius: 16px;
  --radius-sm: 10px;
  --sidebar-w: 264px;
}
html[data-theme="light"] {
  --bg: #f1f5f9;
  --bg-card: #ffffff;
  --bg-soft: #f8fafc;
  --bg-hover: #eef2f7;
  --border: #e2e8f0;
  --text: #0f172a;
  --text-2: #475569;
  --text-3: #94a3b8;
  --shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 4px 16px rgba(15, 23, 42, .05);
  --shadow-lg: 0 8px 32px rgba(15, 23, 42, .14);
}
html[data-theme="dark"] {
  --bg: #0b1220;
  --bg-card: #131c2e;
  --bg-soft: #182339;
  --bg-hover: #1d2a44;
  --border: #253550;
  --text: #e6edf7;
  --text-2: #9fb0c9;
  --text-3: #64748b;
  --shadow: 0 1px 3px rgba(0, 0, 0, .35), 0 6px 20px rgba(0, 0, 0, .25);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, .5);
  --accent-soft: rgba(59, 130, 246, .18);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 14.5px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
html[dir="ltr"] body { letter-spacing: .1px; }
.hidden { display: none !important; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
a { color: var(--accent-2); text-decoration: none; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
::-webkit-scrollbar-track { background: transparent; }

/* ============ auth ============ */
.auth-wrap {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background:
    radial-gradient(700px 400px at 85% -10%, var(--accent-soft), transparent),
    radial-gradient(600px 400px at 0% 110%, var(--purple-soft), transparent),
    var(--bg);
}
.auth-card {
  width: 100%; max-width: 400px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 34px 30px 26px;
  box-shadow: var(--shadow-lg);
}
.auth-logo { text-align: center; margin-bottom: 22px; }
.auth-logo h1 { font-size: 26px; margin-top: 10px; letter-spacing: .5px; }
.auth-logo p { color: var(--text-2); font-size: 13px; }
.logo-badge {
  display: inline-flex; align-items: center; justify-content: center;
  filter: drop-shadow(0 6px 14px rgba(37, 99, 235, .35));
}
.auth-tabs {
  display: flex; background: var(--bg-soft); border: 1px solid var(--border);
  border-radius: 12px; padding: 4px; margin-bottom: 20px;
}
.auth-tabs button {
  flex: 1; border: 0; background: transparent; color: var(--text-2);
  padding: 9px; border-radius: 9px; font-size: 14px; font-weight: 600;
  transition: all .18s;
}
.auth-tabs button.active { background: var(--bg-card); color: var(--text); box-shadow: var(--shadow); }
.auth-error {
  background: var(--danger-soft); color: var(--danger);
  border-radius: var(--radius-sm); padding: 9px 13px; font-size: 13px; margin-bottom: 12px;
}
.auth-demo {
  margin-top: 18px; text-align: center; font-size: 12.5px; color: var(--text-3);
  border-top: 1px dashed var(--border); padding-top: 14px;
}
.auth-demo code {
  background: var(--bg-soft); border: 1px solid var(--border);
  padding: 2px 9px; border-radius: 7px; margin-inline-start: 6px; direction: ltr; display: inline-block;
}

/* ============ fields & buttons ============ */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; background: var(--bg-soft); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 13px; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent-2); box-shadow: 0 0 0 3px var(--accent-soft);
}
.field textarea { resize: vertical; min-height: 84px; }
.field .hint { font-size: 12px; color: var(--text-3); margin-top: 4px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.form-grid .span2 { grid-column: span 2; }
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } .form-grid .span2 { grid-column: span 1; } }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 1.5px solid transparent; border-radius: var(--radius-sm);
  padding: 9px 18px; font-size: 14px; font-weight: 600;
  transition: all .15s; white-space: nowrap;
}
.btn svg { flex-shrink: 0; }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(37, 99, 235, .3); }
.btn-primary:hover { background: var(--accent-2); transform: translateY(-1px); }
.btn-primary:disabled { opacity: .6; transform: none; cursor: wait; }
.btn-ghost { background: transparent; color: var(--text-2); border-color: var(--border); }
.btn-ghost:hover { background: var(--bg-hover); color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { filter: brightness(1.08); }
.btn-soft-danger { background: var(--danger-soft); color: var(--danger); }
.btn-soft-danger:hover { background: var(--danger); color: #fff; }
.btn-block { width: 100%; }
.btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-2); transition: all .15s; font-size: 13px; font-weight: 700;
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text); }

/* ============ app layout ============ */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--bg-card); border-inline-end: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
  z-index: 40;
}
.sidebar-head {
  display: flex; align-items: center; gap: 11px;
  padding: 20px 18px 16px; border-bottom: 1px solid var(--border);
}
.logo-text { display: flex; flex-direction: column; line-height: 1.35; }
.logo-text strong { font-size: 17px; letter-spacing: .4px; }
.logo-text span { font-size: 11px; color: var(--text-3); }
.sidebar-close { display: none; margin-inline-start: auto; }

.nav { flex: 1; overflow-y: auto; padding: 12px 12px; }
.nav-section { font-size: 11px; font-weight: 700; color: var(--text-3); margin: 14px 10px 6px; text-transform: uppercase; letter-spacing: .8px; }
.nav-item {
  display: flex; align-items: center; gap: 11px;
  width: 100%; border: 0; background: transparent; color: var(--text-2);
  padding: 10px 12px; border-radius: 11px; font-size: 14px; font-weight: 500;
  transition: all .14s; text-align: start; margin-bottom: 2px;
}
.nav-item svg { flex-shrink: 0; opacity: .85; }
.nav-item:hover { background: var(--bg-hover); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent-2); font-weight: 700; }
.sidebar-foot { border-top: 1px solid var(--border); padding: 12px; }
.user-chip { display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px;
}
.user-meta { flex: 1; min-width: 0; line-height: 1.35; }
.user-meta strong { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-meta span { font-size: 11.5px; color: var(--text-3); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 13px;
  padding: 14px 26px; position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.menu-btn { display: none; }
.page-title { font-size: 19px; font-weight: 800; flex: 1; }
.topbar-actions { display: flex; gap: 8px; }
.content { padding: 24px 26px 60px; max-width: 1180px; width: 100%; margin: 0 auto; }

.backdrop {
  display: none; position: fixed; inset: 0; z-index: 35;
  background: rgba(2, 6, 23, .5); backdrop-filter: blur(2px);
}
@media (max-width: 960px) {
  .sidebar {
    position: fixed; inset-inline-start: 0; top: 0; bottom: 0;
    transform: translateX(100%); transition: transform .25s ease;
    box-shadow: var(--shadow-lg);
  }
  html[dir="ltr"] .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0) !important; }
  .backdrop.show { display: block; }
  .menu-btn { display: inline-flex; }
  .sidebar-close { display: inline-flex; }
  .content { padding: 18px 14px 70px; }
  .topbar { padding: 12px 14px; }
}

/* ============ cards & grids ============ */
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px;
}
.card + .card { margin-top: 16px; }
.card-title { font-size: 16px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 9px; }
.card-title svg { color: var(--accent-2); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
@media (max-width: 1060px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } .grid-3 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }

/* stat card */
.stat-card { display: flex; align-items: center; gap: 14px; padding: 17px 18px; }
.stat-icon {
  width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.stat-body { line-height: 1.4; min-width: 0; }
.stat-value { font-size: 22px; font-weight: 800; }
.stat-label { font-size: 12.5px; color: var(--text-2); }

/* hero / latest project */
.hero {
  border-radius: 20px; padding: 24px;
  background: linear-gradient(135deg, var(--accent) 0%, #1d4ed8 55%, var(--purple) 130%);
  color: #fff; box-shadow: 0 10px 34px rgba(37, 99, 235, .35);
  position: relative; overflow: hidden;
}
.hero::after {
  content: ''; position: absolute; inset-inline-end: -60px; top: -60px;
  width: 220px; height: 220px; border-radius: 50%;
  background: rgba(255, 255, 255, .09);
}
.hero .eyebrow { font-size: 12px; opacity: .85; font-weight: 600; letter-spacing: .4px; }
.hero h3 { font-size: 22px; margin: 4px 0 2px; }
.hero .sub { font-size: 13.5px; opacity: .9; }
.hero-row { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 14px; font-size: 13px; }
.hero-row .kv { display: flex; align-items: center; gap: 6px; opacity: .95; }
.hero-progress { margin-top: 18px; }
.hero-progress .bar { height: 10px; background: rgba(255, 255, 255, .25); border-radius: 99px; overflow: hidden; }
.hero-progress .fill { height: 100%; background: #fff; border-radius: 99px; transition: width .6s ease; }
.hero-progress .row { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 6px; }
.hero-actions { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; position: relative; z-index: 1; }
.hero-actions .btn { background: rgba(255, 255, 255, .16); color: #fff; border-color: rgba(255, 255, 255, .35); backdrop-filter: blur(4px); }
.hero-actions .btn:hover { background: rgba(255, 255, 255, .28); }

/* quick access tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
.tile {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px 16px; text-align: center; box-shadow: var(--shadow);
  transition: all .16s; cursor: pointer; border-bottom-width: 3px;
}
.tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-bottom-color: var(--accent-2); }
.tile .t-icon {
  width: 50px; height: 50px; margin: 0 auto 10px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
}
.tile strong { display: block; font-size: 14.5px; }
.tile span { font-size: 12px; color: var(--text-3); }

/* badges */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 700; border-radius: 99px; padding: 3px 11px;
}
.badge.b-blue { background: var(--accent-soft); color: var(--accent-2); }
.badge.b-green { background: var(--ok-soft); color: var(--ok); }
.badge.b-amber { background: var(--warn-soft); color: var(--warn); }
.badge.b-red { background: var(--danger-soft); color: var(--danger); }
.badge.b-purple { background: var(--purple-soft); color: var(--purple); }
.badge.b-teal { background: var(--teal-soft); color: var(--teal); }
.badge.b-gray { background: var(--bg-soft); color: var(--text-2); border: 1px solid var(--border); }

/* list rows */
.row-item {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; border: 1px solid var(--border); border-radius: 14px;
  background: var(--bg-card); box-shadow: var(--shadow);
  transition: all .15s; cursor: pointer; margin-bottom: 10px;
}
.row-item:hover { border-color: var(--accent-2); transform: translateY(-1px); }
.row-icon {
  width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.row-body { flex: 1; min-width: 0; line-height: 1.5; }
.row-body strong { display: block; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-body .sub { font-size: 12.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-side { text-align: end; flex-shrink: 0; line-height: 1.5; }
.row-side .date { font-size: 11.5px; color: var(--text-3); display: block; margin-top: 3px; }
.mini-progress { height: 6px; border-radius: 99px; background: var(--bg-soft); border: 1px solid var(--border); overflow: hidden; margin-top: 7px; }
.mini-progress .fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; }

/* toolbar */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.toolbar .search { flex: 1; min-width: 200px; position: relative; }
.toolbar .search input {
  width: 100%; background: var(--bg-card); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 10px 42px 10px 14px; outline: none; box-shadow: var(--shadow);
}
html[dir="ltr"] .toolbar .search input { padding: 10px 14px 10px 42px; }
.toolbar .search svg { position: absolute; inset-inline-start: auto; inset-inline-end: 14px; top: 11px; color: var(--text-3); }
html[dir="ltr"] .toolbar .search svg { inset-inline-end: auto; inset-inline-start: 14px; }
.toolbar .search input:focus { border-color: var(--accent-2); box-shadow: 0 0 0 3px var(--accent-soft); }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  border: 1.5px solid var(--border); background: var(--bg-card); color: var(--text-2);
  border-radius: 99px; padding: 6px 15px; font-size: 13px; font-weight: 600; transition: all .14s;
}
.chip:hover { border-color: var(--accent-2); color: var(--accent-2); }
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* empty / loading / error states */
.empty {
  text-align: center; padding: 54px 20px; color: var(--text-2);
  border: 2px dashed var(--border); border-radius: var(--radius); background: var(--bg-card);
}
.empty .e-icon { font-size: 40px; margin-bottom: 10px; opacity: .9; }
.empty strong { display: block; font-size: 16px; color: var(--text); margin-bottom: 4px; }
.empty p { font-size: 13.5px; margin-bottom: 16px; }
.page-loading { display: flex; justify-content: center; padding: 80px 0; }
.spinner {
  width: 38px; height: 38px; border-radius: 50%;
  border: 3.5px solid var(--border); border-top-color: var(--accent);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-box {
  background: var(--danger-soft); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
  border-radius: var(--radius); padding: 18px; text-align: center;
}

/* skeleton */
.skel { border-radius: 10px; background: linear-gradient(90deg, var(--bg-soft) 25%, var(--bg-hover) 50%, var(--bg-soft) 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ============ modal ============ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(2, 6, 23, .55); backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; padding: 18px;
  animation: fadeIn .18s ease;
}
@keyframes fadeIn { from { opacity: 0; } }
.modal {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 20px; box-shadow: var(--shadow-lg);
  width: 100%; max-width: 640px; max-height: 90vh; display: flex; flex-direction: column;
  animation: popIn .22s cubic-bezier(.2, 1.2, .4, 1);
}
.modal.sm { max-width: 420px; }
.modal.lg { max-width: 780px; }
@keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(.98); } }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px 14px; border-bottom: 1px solid var(--border);
}
.modal-head h3 { font-size: 16.5px; font-weight: 800; }
.modal-body { padding: 20px 22px; overflow-y: auto; }
.modal-foot {
  display: flex; justify-content: flex-end; gap: 10px;
  padding: 14px 22px; border-top: 1px solid var(--border);
}

/* ============ toast ============ */
.toast-root {
  position: fixed; bottom: 20px; inset-inline-start: 50%; transform: translateX(-50%);
  z-index: 200; display: flex; flex-direction: column; gap: 9px; align-items: center; pointer-events: none;
}
html[dir="rtl"] .toast-root { transform: translateX(50%); }
.toast {
  background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
  border-radius: 13px; padding: 11px 20px; box-shadow: var(--shadow-lg);
  font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 9px;
  animation: toastIn .25s ease;
}
.toast.ok { border-inline-start: 4px solid var(--ok); }
.toast.err { border-inline-start: 4px solid var(--danger); }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px); } }

/* ============ details page ============ */
.detail-head { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
.detail-head .grow { flex: 1; min-width: 220px; }
.detail-head h2 { font-size: 22px; }
.detail-head .sub { color: var(--text-2); font-size: 13.5px; margin-top: 3px; }
.detail-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.kv-cell { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px; line-height: 1.5; }
.kv-cell .k { font-size: 11.5px; color: var(--text-3); font-weight: 600; }
.kv-cell .v { font-size: 14px; font-weight: 700; margin-top: 1px; word-break: break-word; }
.note-block { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 25%, transparent); border-radius: 12px; padding: 13px 16px; font-size: 13.5px; white-space: pre-wrap; }
.section-title { display: flex; align-items: center; justify-content: space-between; margin: 26px 0 13px; }
.section-title h3 { font-size: 16px; font-weight: 800; }

/* progress editor */
.progress-edit { display: flex; align-items: center; gap: 14px; }
.progress-edit input[type=range] { flex: 1; accent-color: var(--accent); height: 28px; }
.progress-edit .val { font-weight: 800; font-size: 16px; min-width: 48px; text-align: center; }

/* ============ checklist ============ */
.check-group { margin-bottom: 20px; }
.check-group h4 {
  font-size: 13.5px; font-weight: 800; color: var(--accent-2);
  margin-bottom: 9px; padding-bottom: 6px; border-bottom: 1px dashed var(--border);
}
.check-item {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 9px 11px; border-radius: 10px; transition: background .12s; cursor: pointer;
}
.check-item:hover { background: var(--bg-hover); }
.check-item input { margin-top: 5px; width: 17px; height: 17px; accent-color: var(--ok); flex-shrink: 0; cursor: pointer; }
.check-item.done .ci-text { text-decoration: line-through; color: var(--text-3); }
.ci-text { font-size: 13.8px; }
.ci-ref { font-size: 11px; color: var(--text-3); display: block; }
.check-progress-wrap { position: sticky; top: 68px; z-index: 5; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 13px 18px; box-shadow: var(--shadow); margin-bottom: 16px; }

/* ============ calculators ============ */
.calc-result {
  background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  border-radius: 13px; padding: 14px 18px; margin-top: 14px;
}
.calc-result .r-row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; gap: 12px; }
.calc-result .r-row + .r-row { border-top: 1px dashed color-mix(in srgb, var(--accent) 25%, transparent); }
.calc-result .r-label { font-size: 13px; color: var(--text-2); }
.calc-result .r-val { font-size: 16.5px; font-weight: 800; color: var(--accent-2); direction: ltr; }
.calc-note { font-size: 12.3px; color: var(--text-3); margin-top: 10px; line-height: 1.8; }
.formula { direction: ltr; text-align: left; font-family: ui-monospace, monospace; font-size: 13px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 9px; padding: 8px 13px; margin: 8px 0; color: var(--text-2); overflow-x: auto; }

/* ============ diagnostics ============ */
.diag-item { border: 1px solid var(--border); border-radius: 14px; background: var(--bg-card); margin-bottom: 11px; overflow: hidden; box-shadow: var(--shadow); }
.diag-q { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: transparent; padding: 15px 17px; text-align: start; color: var(--text); font-size: 14.3px; font-weight: 700; }
.diag-q:hover { background: var(--bg-hover); }
.diag-q .chev { margin-inline-start: auto; transition: transform .2s; color: var(--text-3); flex-shrink: 0; }
.diag-item.open .chev { transform: rotate(180deg); }
.diag-a { display: none; padding: 3px 18px 17px; border-top: 1px dashed var(--border); }
.diag-item.open .diag-a { display: block; }
.diag-a h5 { font-size: 12.5px; color: var(--accent-2); margin: 13px 0 5px; }
.diag-a ul { padding-inline-start: 20px; font-size: 13.5px; color: var(--text-2); }
.diag-a li { margin-bottom: 4px; }
.safety-banner {
  display: flex; gap: 11px; align-items: flex-start;
  background: var(--danger-soft); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
  color: var(--danger); border-radius: 13px; padding: 13px 16px; margin-bottom: 18px; font-size: 13.3px; font-weight: 600;
}

/* ============ knowledge ============ */
.kb-card { cursor: pointer; transition: all .15s; }
.kb-card:hover { transform: translateY(-2px); border-color: var(--accent-2); }
.kb-card h4 { font-size: 15px; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
.kb-card p { font-size: 13px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.kb-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.kb-article { font-size: 14.2px; line-height: 2; }
.kb-article h4 { font-size: 15px; color: var(--accent-2); margin: 18px 0 7px; }
.kb-article table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
.kb-article th, .kb-article td { border: 1px solid var(--border); padding: 7px 11px; text-align: start; }
.kb-article th { background: var(--bg-soft); font-weight: 700; }
.kb-article ul { padding-inline-start: 22px; }
mark { background: color-mix(in srgb, var(--warn) 35%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }

/* ============ charts ============ */
.chart-bars { display: flex; align-items: flex-end; gap: 10px; height: 130px; padding-top: 8px; }
.chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.chart-col .bar-v {
  width: 100%; max-width: 44px; border-radius: 8px 8px 4px 4px;
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
  transition: height .5s ease; min-height: 3px; position: relative;
}
.chart-col .bar-num { font-size: 12px; font-weight: 800; color: var(--accent-2); }
.chart-col .bar-lbl { font-size: 10.5px; color: var(--text-3); white-space: nowrap; }
.status-bars .sb-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.status-bars .sb-lbl { font-size: 12.3px; color: var(--text-2); width: 110px; flex-shrink: 0; }
.status-bars .sb-track { flex: 1; height: 9px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 99px; overflow: hidden; }
.status-bars .sb-fill { height: 100%; border-radius: 99px; transition: width .5s; }
.status-bars .sb-val { font-size: 12px; font-weight: 800; width: 22px; text-align: center; }

/* ============ due list ============ */
.due-item { display: flex; align-items: center; gap: 12px; padding: 11px 13px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; background: var(--bg-soft); }
.due-item.overdue { border-color: color-mix(in srgb, var(--danger) 40%, transparent); background: var(--danger-soft); }
.due-item.soon { border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: var(--warn-soft); }
.due-item .grow { flex: 1; min-width: 0; line-height: 1.45; }
.due-item strong { font-size: 13.5px; display: block; }
.due-item .d-sub { font-size: 11.8px; color: var(--text-2); }

/* ============ parts table ============ */
.parts-table { width: 100%; border-collapse: collapse; }
.parts-table th { text-align: start; font-size: 12px; color: var(--text-3); font-weight: 700; padding: 8px 12px; border-bottom: 2px solid var(--border); }
.parts-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); font-size: 13.5px; vertical-align: middle; }
.parts-table tr:hover td { background: var(--bg-hover); }
.parts-table tr { cursor: pointer; }
.parts-table .p-name { font-weight: 700; }
.parts-table .p-sub { font-size: 11.5px; color: var(--text-3); }
.qty-pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; }
.qty-dot { width: 9px; height: 9px; border-radius: 50%; }
.table-wrap { overflow-x: auto; }
@media (max-width: 720px) { .parts-table .hide-sm { display: none; } }

/* ============ print report ============ */
.print-sheet { display: none; }
@media print {
  body * { visibility: hidden; }
  .print-sheet, .print-sheet * { visibility: visible; }
  .print-sheet {
    display: block; position: absolute; inset: 0; padding: 24px;
    background: #fff; color: #000; font-size: 13px;
  }
  .print-sheet h1 { font-size: 19px; text-align: center; margin-bottom: 4px; }
  .print-sheet .ph-sub { text-align: center; font-size: 12px; color: #444; margin-bottom: 18px; }
  .print-sheet table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
  .print-sheet th, .print-sheet td { border: 1px solid #999; padding: 7px 10px; text-align: start; }
  .print-sheet th { background: #f0f0f0; width: 160px; }
  .print-sheet .sig-row { display: flex; gap: 40px; margin-top: 50px; }
  .print-sheet .sig { flex: 1; text-align: center; border-top: 1px solid #666; padding-top: 8px; font-size: 12px; }
}

/* timeline for services in project detail */
.timeline { position: relative; padding-inline-start: 22px; }
.timeline::before { content: ''; position: absolute; inset-inline-start: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
.tl-item { position: relative; margin-bottom: 14px; }
.tl-item::before {
  content: ''; position: absolute; inset-inline-start: -22px; top: 7px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--accent); border: 2.5px solid var(--bg-card); box-shadow: 0 0 0 2px var(--accent);
}
.tl-card { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 12px; padding: 12px 15px; }
.tl-card .tl-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 5px; }
.tl-card .tl-head strong { font-size: 13.8px; }
.tl-card p { font-size: 13px; color: var(--text-2); }

/* ============ MOBILE POLISH (v4) ============ */
@media (max-width: 640px) {
  .content { padding: 14px 12px 80px; }
  /* stat cards: 2 columns on phones */
  .grid-4 { grid-template-columns: 1fr 1fr !important; gap: 10px; }
  .stat-card { padding: 12px; gap: 10px; }
  .stat-icon { width: 40px; height: 40px; font-size: 18px !important; }
  .stat-value { font-size: 18px; }
  .stat-label { font-size: 11.5px; }
  /* toolbar: search full-width, chips scroll horizontally, button full width */
  .toolbar { gap: 8px; }
  .toolbar .search { flex-basis: 100%; min-width: 0; order: 1; }
  .toolbar .chip-row {
    order: 3; width: 100%; overflow-x: auto; flex-wrap: nowrap;
    padding-bottom: 3px; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .toolbar .chip-row::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; }
  .toolbar > .btn { order: 2; flex: 1; }
  /* hero */
  .hero { padding: 18px 16px; border-radius: 16px; }
  .hero h3 { font-size: 19px; }
  .hero-row { gap: 8px 14px; font-size: 12.3px; }
  .hero-actions .btn { flex: 1; justify-content: center; }
  /* list rows: stack side info under the body */
  .row-item { flex-wrap: wrap; padding: 12px 13px; gap: 8px 12px; }
  .row-body { flex: 1 1 calc(100% - 58px); }
  .row-side {
    width: 100%; display: flex; align-items: center; gap: 8px;
    justify-content: space-between; text-align: start; margin-top: 2px;
  }
  .row-side .date { margin-top: 0; }
  /* detail page actions */
  .detail-head .actions { width: 100%; }
  .detail-head .actions .btn { flex: 1; }
  /* modals become bottom sheets */
  .modal-overlay { padding: 0; align-items: flex-end; }
  .modal { max-width: 100% !important; max-height: 93vh; border-radius: 22px 22px 0 0; animation: sheetIn .25s ease; }
  @keyframes sheetIn { from { transform: translateY(48px); opacity: .5; } }
  .modal-body { padding: 16px 16px; }
  .modal-head { padding: 15px 16px 12px; }
  .modal-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); flex-wrap: wrap; }
  .modal-foot .btn { flex: 1; }
  /* charts & misc */
  .chart-bars { height: 105px; gap: 6px; }
  .status-bars .sb-lbl { width: 86px; font-size: 11.3px; }
  .tiles { gap: 10px; }
  .tile { padding: 14px 8px; }
  .tile strong { font-size: 13px; }
  .section-title { margin: 20px 0 10px; }
  .card { padding: 15px 14px; }
  .kb-article { font-size: 13.5px; }
  .check-progress-wrap { top: 62px; }
  /* bigger touch targets */
  .btn { padding: 11px 16px; min-height: 44px; }
  .btn-sm { min-height: 38px; padding: 8px 13px; }
  .icon-btn { width: 42px; height: 42px; }
  .nav-item { padding: 12px 12px; }
  .check-item input { width: 20px; height: 20px; }
  .field input, .field select, .field textarea { padding: 12px 13px; font-size: 16px; }
  /* 16px prevents iOS/Android zoom-on-focus */
}
/* very narrow phones */
@media (max-width: 360px) {
  .grid-4 { grid-template-columns: 1fr !important; }
  .tiles { grid-template-columns: 1fr 1fr; }
}
/* safe areas when installed as PWA (notch / gesture bar) */
@media (display-mode: standalone) {
  .topbar { padding-top: calc(12px + env(safe-area-inset-top)); }
  .sidebar-head { padding-top: calc(20px + env(safe-area-inset-top)); }
  .content { padding-bottom: calc(70px + env(safe-area-inset-bottom)); }
}
/* fallbacks for older Android WebView without color-mix() */
@supports not (color: color-mix(in srgb, red 50%, blue)) {
  .topbar { background: var(--bg); }
  .note-block, .safety-banner, .calc-result, .error-box,
  .due-item.overdue, .due-item.soon { border-color: var(--border); }
  .calc-result .r-row + .r-row { border-top-color: var(--border); }
}

/* ============ v5: 4-state checklist + diag flow ============ */
.check-item.ci-pass { background: var(--ok-soft); }
.check-item.ci-fail { background: var(--danger-soft); }
.check-item.ci-na { opacity: .65; }
.check-item { cursor: pointer; border: 1px solid transparent; }
.check-item.ci-pass, .check-item.ci-fail { border-color: var(--border); }
.check-item:active { transform: scale(.995); }

/* ============ v6: kill horizontal page scroll (off-canvas sidebar overflow) ============ */
html, body { overflow-x: hidden; max-width: 100%; }
.app, .main { overflow-x: clip; max-width: 100vw; }
.content { overflow-x: hidden; }
.row-item, .card, .due-item { max-width: 100%; }
.row-body, .row-body strong, .row-body .sub { min-width: 0; }
/* long persian titles in list rows: wrap instead of clip on mobile */
@media (max-width: 640px) {
  .row-body strong { white-space: normal; line-height: 1.5; }
  .row-body .sub { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
}

/* ---------- api ---------- */
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch('/api' + path, {
    method: opts.method || 'GET',
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (res.status === 401 && !path.startsWith('/auth/')) {
    doLocalLogout();
    throw new Error('unauthorized');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || 'error'); e.code = data.error; e.status = res.status; throw e; }
  return data;
}

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = (type === 'ok' ? '✅' : '⚠️') + ' <span>' + esc(msg) + '</span>';
  $('#toastRoot').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }, 2600);
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
/* wrap an async save handler: disables the button during the call and
   swallows double-clicks (duplicate-submission protection) */
function guard(btnSel, fn) {
  return async (...a) => {
    const b = $(btnSel);
    if (b && b.disabled) return;
    if (b) b.disabled = true;
    try { await fn(...a); }
    catch (e) { reportError(e, 'guard:' + btnSel); }
    finally { const b2 = $(btnSel); if (b2) b2.disabled = false; }
  };
}
/* central error handler */
function reportError(e, ctx) {
  try {
    console.error('[ZLift]', ctx || '', e);
    toast(t('errUnexpected'), 'err');
  } catch (e2) {}
}
window.addEventListener('error', ev => { try { console.error('[ZLift uncaught]', ev.message); } catch (e) {} });
window.addEventListener('unhandledrejection', ev => {
  try { console.error('[ZLift promise]', ev.reason); } catch (e) {}
  if (ev.preventDefault) ev.preventDefault();
});

/* ---------- UI back-stack (phone back button support) ----------
   Every overlay (modal / date picker / sidebar / diag step) registers a
   "layer". Pressing hardware back pops the top layer instead of leaving
   the app. Closing via UI removes the matching history entry. */
let uiStack = [];
let _ignorePop = 0;
function pushUiLayer(type, closeFn) {
  // opening a fresh first layer invalidates any stale compensating-back counters
  // (they belong to popstates that were lost to route changes — see race fix)
  if (uiStack.length === 0) _ignorePop = 0;
  uiStack.push({ type, close: closeFn });
  try { history.pushState({ zl: uiStack.length }, ''); } catch (e) {}
}
function popTaggedLayer(type) {
  // remove the topmost layer of this type that was closed via UI
  for (let i = uiStack.length - 1; i >= 0; i--) {
    if (uiStack[i].type === type) {
      const isTop = i === uiStack.length - 1;
      uiStack.splice(i, 1);
      if (isTop) { _ignorePop++; try { history.back(); } catch (e) {} }
      return true;
    }
  }
  return false;
}
window.addEventListener('popstate', () => {
  if (_ignorePop > 0) { _ignorePop--; return; }
  if (uiStack.length) {
    const layer = uiStack.pop();
    try { layer.close(); } catch (e) {}
  }
  // else: hash-route back — handled by the hashchange listener
});
/* safety net: if a modal/picker overlay exists but its stack entry was lost,
   clicking back must still close it (never trap the user) */
window.addEventListener('popstate', () => {
  setTimeout(() => {
    const hasOverlay = document.getElementById('modalOverlay') || document.getElementById('jdOverlay');
    if (hasOverlay && !uiStack.length) {
      _closeModalDom();
      if (typeof _closeJdateDom === 'function') _closeJdateDom();
    }
  }, 30);
});

/* ---------- modal ---------- */
function _closeModalDom() { $('#modalRoot').innerHTML = ''; document.removeEventListener('keydown', escClose); }
function openModal(html, opts = {}) {
  const hadModal = !!document.getElementById('modalOverlay');
  _closeModalDom();
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal-overlay" id="modalOverlay"><div class="modal ${opts.size || ''}">${html}</div></div>`;
  $('#modalOverlay').addEventListener('mousedown', e => { if (e.target.id === 'modalOverlay') closeModal(); });
  document.addEventListener('keydown', escClose);
  if (!hadModal) pushUiLayer('modal', _closeModalDom);
}
function escClose(e) { if (e.key === 'Escape') closeModal(); }
function closeModal() {
  const had = !!document.getElementById('modalOverlay');
  _closeModalDom();
  if (had) popTaggedLayer('modal');
}
function confirmDialog(title, msg, onYes) {
  openModal(`
    <div class="modal-head"><h3>⚠️ ${esc(title)}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>

}

async function loadAll(force) {
  if (state.projects && !force) return;
  const [p, s, n, c, pa, st, ds, cs, is_, tl, ph, inv, ct] = await Promise.all([
    api('/projects'), api('/services'), api('/notes'), api('/checklists'), api('/parts'), api('/settings'),
    api('/diagSessions'), api('/calcSaves'), api('/issues'), api('/tools'), api('/photos'), api('/invoices'), api('/contracts')
  ]);
  state.projects = p.projects;
  state.services = s.services;
  state.notes = n.notes;
  state.checklists = c.checklists;
  state.parts = pa.parts;
  state.settings = st.settings;
  state.diagSessions = ds.items;
  state.calcSaves = cs.items;
  state.issues = is_.items;
  state.tools = tl.items;
  state.photos = ph.items;
  state.invoices = inv.items;
  state.contracts = ct.items;
}

/* service-due calculation */
function dueInfo(p) {
  if (!p.serviceIntervalDays) return null;
  const svc = state.services.filter(s => s.projectId === p.id && (s.serviceType === 'maintenance' || s.serviceType === 'repair'));
  const last = svc.length ? Math.max(...svc.map(s => s.date)) : p.createdAt;
  const next = last + p.serviceIntervalDays * 86400000;
  const days = Math.round((next - Date.now()) / 86400000);
  return { last, next, days, overdue: days < 0, soon: days >= 0 && days <= 7 };
}
function projName(id) { const p = (state.projects || []).find(x => x.id === id); return p ? p.name : '—'; }
/* display target of a service: linked project name, or its own standalone customer/elevator */
function svcTarget(s) {
  if (s.projectId) { const p = (state.projects || []).find(x => x.id === s.projectId); if (p) return p.name; }
  return s.customer || s.elevatorInfo || '—';
}
function svcTargetSub(s) {
  if (s.projectId) return '';
  return s.elevatorInfo && s.customer ? s.elevatorInfo : '';
}

let authMode = 'login';
function showAuth() {
  $('#authView').classList.remove('hidden');
  $('#appView').classList.add('hidden');
}
function doLocalLogout() {
  flushUiLayers();
  state.token = null; state.user = null;
  state.projects = state.services = state.notes = state.checklists = null;
  localStorage.removeItem('zlift_token');
  showAuth();
}
async function initAuth() {
  $('#tabLogin').onclick = () => setAuthMode('login');
  $('#tabRegister').onclick = () => setAuthMode('register');
  $('#authForm').onsubmit = async e => {
    e.preventDefault();
    const btn = $('#authSubmit'); btn.disabled = true;
    $('#authError').classList.add('hidden');
    try {
      const body = {
        username: $('#authUsername').value.trim(),
        password: $('#authPassword').value,
        name: $('#authName').value.trim()
      };
      const d = await api('/auth/' + authMode, { method: 'POST', body });
      state.token = d.token; state.user = d.user;
      localStorage.setItem('zlift_token', d.token);
      enterApp();
    } catch (err) {
      const map = { invalid_credentials: 'errInvalidCred', username_taken: 'errUserTaken', weak_password: 'errWeakPass', bad_username: 'errBadUser' };
      $('#authError').textContent = t(map[err.code] || 'errGeneric');
      $('#authError').classList.remove('hidden');
    } finally { btn.disabled = false; }
  };
}
function setAuthMode(m) {
  authMode = m;
  $('#tabLogin').classList.toggle('active', m === 'login');
  $('#tabRegister').classList.toggle('active', m === 'register');
  $('#nameField').classList.toggle('hidden', m === 'login');
  $('#authSubmit').textContent = m === 'login' ? t('loginBtn') : t('registerBtn');
}

/* ================= APP SHELL ================= */
function checkBackupNag() {
  try {
    const last = +localStorage.getItem('zlift_last_backup') || 0;
    const snooze = +localStorage.getItem('zlift_backup_snooze') || 0;
    if (Date.now() < snooze) return;
    const days = last ? Math.floor((Date.now() - last) / 86400000) : 999;
    if (days < 7) return;
    setTimeout(() => {
      const txt = last ? faNum(days) + ' ' + t('backupNagMsg') : t('backupHint');
      openModal(`
        <div class="modal-head"><h3>💾 ${t('backupNagTitle')}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
        <div class="modal-body"><div class="note-block">⚠️ ${txt}</div></div>
        <div class="modal-foot">
          <button class="btn btn-ghost" onclick="localStorage.setItem('zlift_backup_snooze', String(Date.now() + 3 * 86400000));closeModal()">${t('backupNagLater')}</button>
          <button class="btn btn-primary" onclick="closeModal();openBackupModal()">💾 ${t('backupNagBtn')}</button>
        </div>`, { size: 'sm' });
    }, 1200);
  } catch (e) {}
}
function enterApp() {
  $('#authView').classList.add('hidden');
  $('#appView').classList.remove('hidden');
  checkBackupNag();
  $('#userName').textContent = state.user.name;
  $('#userAvatar').textContent = (state.user.name || '?').trim()[0] || '?';
  renderNav();
  navigate(state.route || '/dashboard');
}
const NAV = [
  { section: 'navMain' },
  { route: '/dashboard', key: 'dashboard', icon: 'dash' },
  { route: '/projects', key: 'projects', icon: 'proj' },
  { route: '/services', key: 'services', icon: 'svc' },
  { route: '/issues', key: 'issues', icon: 'alert' },
  { route: '/invoices', key: 'invoices', icon: 'bill' },
  { route: '/contracts', key: 'contracts', icon: 'doc' },
  { route: '/report', key: 'monthlyReport', icon: 'chart' },
  { route: '/parts', key: 'parts', icon: 'box' },
  { section: 'navTools' },
  { route: '/checklists', key: 'checklists', icon: 'check' },
  { route: '/calculations', key: 'calculations', icon: 'calc' },
  { route: '/diagnostics', key: 'diagnostics', icon: 'diag' },
  { route: '/vvvf', key: 'vvvf', icon: 'chip' },
  { route: '/standards', key: 'standards', icon: 'std' },
  { section: 'navKnowledge' },
  { route: '/knowledge', key: 'knowledge', icon: 'kb' },
  { route: '/tools', key: 'tools', icon: 'wrench' },
  { route: '/notes', key: 'notes', icon: 'note' }
];
function renderNav() {
  const nav = $('#mainNav');
  nav.innerHTML = NAV.map(item => {
    if (item.section) return `<div class="nav-section">${t(item.section)}</div>`;
    const active = state.route === item.route || state.route.startsWith(item.route + '/');
    return `<button class="nav-item ${active ? 'active' : ''}" data-route="${item.route}">${IC[item.icon]}<span>${t(item.key)}</span></button>`;
  }).join('');
  nav.querySelectorAll('.nav-item').forEach(b => b.onclick = () => { navigate(b.dataset.route); closeSidebar(); });
}
function _closeSidebarDom() { $('#sidebar').classList.remove('open'); $('#backdrop').classList.remove('show'); }
function closeSidebar() {
  const wasOpen = $('#sidebar').classList.contains('open');
  _closeSidebarDom();
  if (wasOpen) popTaggedLayer('sidebar');
}

/* ================= ROUTER ================= */
function flushUiLayers() {
  /* drop all overlay layers (modal / picker / sidebar / diag) without
     touching history — used on internal navigation & logout */
  if (!uiStack.length) return;
  uiStack = [];
  _closeModalDom();
  if (typeof _closeJdateDom === 'function') _closeJdateDom();
  _closeSidebarDom();
  diagSession = null;
}
function navigate(route) {
  flushUiLayers();
  state.route = route;
  location.hash = route;
  render();
}
window.addEventListener('hashchange', () => {
  const r = location.hash.slice(1) || '/dashboard';
  if (r !== state.route) {
    state.route = r;
    // route changed underneath any open overlays: close them & reset stack
    flushUiLayers();
    if (state.user) render();
  }
});

async function render() {
  renderNav();
  const c = $('#content');
  const r = state.route;
  const titles = {
    '/dashboard': 'dashboard', '/projects': 'projects', '/services': 'services',
    '/parts': 'parts', '/checklists': 'checklists', '/calculations': 'calculations',
    '/diagnostics': 'diagnostics', '/knowledge': 'knowledge', '/notes': 'notes',
    '/vvvf': 'vvvf', '/issues': 'issues', '/tools': 'tools', '/invoices': 'invoices', '/contracts': 'contracts', '/report': 'monthlyReport', '/standards': 'standards'
  };
  const baseRoute = '/' + r.split('/')[1];
  $('#pageTitle').textContent = t(titles[baseRoute] || 'dashboard');
  c.innerHTML = '<div class="page-loading"><div class="spinner"></div></div>';
  try {
    await loadAll();
    if (r === '/dashboard') renderDashboard();
    else if (r === '/projects') renderProjects();
    else if (r.startsWith('/projects/')) renderProjectDetail(r.split('/')[2]);
    else if (r === '/services') renderServices();
    else if (r === '/parts') renderParts();
    else if (r === '/checklists') renderChecklists();
    else if (r.startsWith('/checklists/')) renderChecklistDetail(r.split('/')[2]);
    else if (r === '/calculations') renderCalculations();
    else if (r === '/diagnostics') renderDiagnostics();
    else if (r === '/vvvf') renderVVVF();
    else if (r === '/issues') renderIssues();
    else if (r === '/invoices') renderInvoices();
    else if (r === '/contracts') renderContracts();
    else if (r === '/report') renderMonthlyReport();
    else if (r === '/tools') renderToolsPage();
    else if (r === '/knowledge') renderKnowledge();
    else if (r === '/standards') renderStandards();
    else if (r === '/notes') renderNotes();
    else renderDashboard();
  } catch (e) {
    if (e.message === 'unauthorized') return;
    c.innerHTML = `<div class="error-box"><p style="font-weight:700;margin-bottom:10px">⚠️ ${t('loadError')}</p><button class="btn btn-primary" onclick="render()">${t('retry')}</button></div>`;
  }
}

/* ================= DASHBOARD ================= */
function renderDashboard() {
  const c = $('#content');
  const projects = state.projects;
  const latest = projects[0];
  const stats = {
    projects: projects.length,
    active: projects.filter(p => p.status !== 'delivered').length,
    services: state.services.length,
    month: state.services.filter(s => s.date >= Date.now() - 30 * 86400000).length
  };
  const recent = state.services.slice(0, 4);

  const hero = latest ? `
    <div class="hero">
      <div class="eyebrow">📌 ${t('latestProject')} · ${t('lastUpdate')}: ${fmtDate(latest.updatedAt)}</div>
      <h3>${esc(latest.name)}</h3>
      <div class="sub">${esc(latest.customer)} — ${esc(latest.location)}</div>
      <div class="hero-row">
        <span class="kv">${latest.elevatorType === 'hydraulic' ? '🛢️ ' + t('hydraulic') : '⚙️ ' + t('traction')}</span>
        <span class="kv">🏢 ${faNum(latest.floors)} ${t('floorsUnit')}</span>
        <span class="kv">⚖️ ${faNum(latest.capacityKg)} kg</span>
        <span class="kv">👤 ${faNum(latest.persons)} ${t('personsUnit')}</span>
      </div>
      <div class="hero-progress">
        <div class="row"><span>${t(STATUS_META[latest.status].key)}</span><span>${faNum(latest.progress)}٪</span></div>
        <div class="bar"><div class="fill" style="width:${latest.progress}%"></div></div>
      </div>
      <div class="hero-actions">
        <button class="btn" onclick="navigate('/projects/${latest.id}')">${t('viewDetails')}</button>
        <button class="btn" onclick="openServiceForm(null,'${latest.id}')">${IC.plus} ${t('newService')}</button>
      </div>
    </div>` : `
    <div class="empty"><div class="e-icon">🏗️</div><strong>${t('noProjects')}</strong><p>${t('noProjectsSub')}</p>
    <button class="btn btn-primary" onclick="openProjectForm()">${IC.plus} ${t('newProject')}</button></div>`;

  const tiles = [
    ['tProjects', 'tProjectsSub', '/projects', 'proj', 'var(--accent-soft)', 'var(--accent-2)'],
    ['tServices', 'tServicesSub', '/services', 'svc', 'var(--teal-soft)', 'var(--teal)'],
    ['tChecklists', 'tChecklistsSub', '/checklists', 'check', 'var(--ok-soft)', 'var(--ok)'],
    ['tCalc', 'tCalcSub', '/calculations', 'calc', 'var(--purple-soft)', 'var(--purple)'],
    ['tDiag', 'tDiagSub', '/diagnostics', 'diag', 'var(--warn-soft)', 'var(--warn)'],
    ['tKb', 'tKbSub', '/knowledge', 'kb', 'var(--danger-soft)', 'var(--danger)'],
    ['tParts', 'tPartsSub', '/parts', 'box', 'var(--teal-soft)', 'var(--teal)']
  ].map(([k, sub, route, icon, bg, fg]) => `
    <div class="tile" onclick="navigate('${route}')">
      <div class="t-icon" style="background:${bg};color:${fg}">${IC[icon]}</div>
      <strong>${t(k)}</strong><span>${t(sub)}</span>
    </div>`).join('') + `
    <div class="tile" onclick="openTgChannel()" style="border-bottom-color:#2AABEE">
      <div class="t-icon" style="background:rgba(42,171,238,.14);color:#2AABEE">${IC.telegram}</div>
      <strong>${t('tgChannel')}</strong><span>${t('tgChannelSub')}</span>
    </div>`;

  /* service due list */
  const dues = projects
    .map(p => ({ p, d: dueInfo(p) }))
    .filter(x => x.d && (x.d.overdue || x.d.soon))
    .sort((a, b) => a.d.days - b.d.days);
  /* open follow-ups & out-of-order units */
  const openIssues = state.services
    .filter(s => s.finalStatus === 'followup' || s.finalStatus === 'outoforder')
    .slice(0, 4);
  const openIssueItems = state.issues.filter(i => !i.closed).slice(0, 4);
  const ctOverdue = state.contracts
    .map(ct => ({ ct, st: ctStats(ct) }))
    .filter(x => x.st.overdue > 0)
    .slice(0, 3);

  const dueHtml = (dues.length || openIssues.length || openIssueItems.length || ctOverdue.length) ? (
    dues.map(({ p, d }) => `
    <div class="due-item ${d.overdue ? 'overdue' : 'soon'}">
      <span style="font-size:19px">${d.overdue ? '🔴' : '🟡'}</span>
      <div class="grow">
        <strong>${esc(p.name)}</strong>
        <span class="d-sub">${t('lastService')}: ${fmtDate(d.last)} · ${d.overdue ? faNum(Math.abs(d.days)) + ' ' + t('daysOverdue') : faNum(d.days) + ' ' + t('daysLeft')}</span>
      </div>
      <button class="btn btn-primary btn-sm" onclick="openServiceForm(null,'${p.id}')">${t('logService')}</button>
    </div>`).join('') +
    openIssues.map(s => `
    <div class="due-item ${s.finalStatus === 'outoforder' ? 'overdue' : 'soon'}" onclick="openServiceView('${s.id}')" style="cursor:pointer">
      <span style="font-size:19px">${s.finalStatus === 'outoforder' ? '⛔' : '📌'}</span>
      <div class="grow">
        <strong>${esc(projName(s.projectId))}</strong>
        <span class="d-sub">${esc(s.problem || s.complaint || '—')}${s.followUpDate ? ' · ' + t('svcFollowUp') + ': ' + fmtDate(s.followUpDate) : ''}</span>
      </div>
      <span class="badge ${FINAL_META[s.finalStatus].cls}">${t(FINAL_META[s.finalStatus].key)}</span>
    </div>`).join('') +
    openIssueItems.map(i => {
      const m = ISSUE_META[i.kind] || ISSUE_META.open;
      return `
    <div class="due-item ${i.kind === 'open' ? 'overdue' : 'soon'}" onclick="openIssueForm('${i.id}')" style="cursor:pointer">
      <span style="font-size:19px">${m.icon}</span>
      <div class="grow">
        <strong>${esc(i.title)}</strong>
        <span class="d-sub">${i.projectId ? esc(projName(i.projectId)) + ' · ' : ''}${fmtDate(i.createdAt)}</span>
      </div>
      <span class="badge ${m.cls}">${t(m.key)}</span>
    </div>`;
    }).join('') +
    ctOverdue.map(({ ct, st }) => `
    <div class="due-item overdue" onclick="navigate('/contracts')" style="cursor:pointer">
      <span style="font-size:19px">📄</span>
      <div class="grow">
        <strong>${esc(ct.building)}</strong>
        <span class="d-sub">${faNum(st.overdue)} ${t('ctOverdueMonths')} · ${money(ct.amount * st.overdue)} ${t('rial')}</span>
      </div>
      <span class="badge b-red">${t('invUnpaid')}</span>
    </div>`).join('')
  ) : `<p style="font-size:13.5px;color:var(--ok);font-weight:600">${t('noDue')}</p>`;

  /* low stock */
  const low = state.parts.filter(x => x.qty <= x.minQty);

  /* monthly chart data — last 6 months */
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
    const start = d.getTime();
    const e2 = new Date(d); e2.setMonth(e2.getMonth() + 1);
    const cnt = state.services.filter(s => s.date >= start && s.date < e2.getTime()).length;
    const lbl = new Intl.DateTimeFormat(LANG === 'fa' ? 'fa-IR' : 'en-GB', { month: 'short' }).format(d);
    months.push({ lbl, cnt });
  }
  const maxCnt = Math.max(1, ...months.map(m => m.cnt));
  const chartHtml = `<div class="chart-bars">${months.map(m => `
    <div class="chart-col">
      <span class="bar-num">${m.cnt ? faNum(m.cnt) : ''}</span>
      <div class="bar-v" style="height:${Math.round(m.cnt / maxCnt * 100)}%"></div>
      <span class="bar-lbl">${m.lbl}</span>
    </div>`).join('')}</div>`;

  /* status distribution */
  const stColors = { contract: 'var(--text-3)', installing: 'var(--accent-2)', testing: 'var(--purple)', inspection: 'var(--warn)', maintenance: 'var(--teal)', delivered: 'var(--ok)' };
  const statusHtml = `<div class="status-bars">${Object.keys(STATUS_META).map(s => {
    const n = projects.filter(p => p.status === s).length;
    if (!n && !projects.length) return '';
    const pct = projects.length ? Math.round(n / projects.length * 100) : 0;
    return `<div class="sb-row"><span class="sb-lbl">${t(STATUS_META[s].key)}</span>
      <div class="sb-track"><div class="sb-fill" style="width:${pct}%;background:${stColors[s]}"></div></div>
      <span class="sb-val">${faNum(n)}</span></div>`;
  }).join('')}</div>`;

  c.innerHTML = `
    ${hero}
    <div class="grid-4" style="margin-top:18px">
      ${statCard('🏗️', 'var(--accent-soft)', stats.projects, 'stTotalProjects')}
      ${statCard('⚡', 'var(--warn-soft)', stats.active, 'stActive')}
      ${statCard('🔧', 'var(--teal-soft)', stats.services, 'stServices')}
      ${statCard('📅', 'var(--ok-soft)', stats.month, 'stMonth')}
    </div>
    <div class="grid-2" style="margin-top:16px">
      <div class="card">
        <div class="card-title">⏰ ${t('svcDue')}</div>
        ${dueHtml}
        ${low.length ? `<div class="due-item soon" style="margin-top:12px">
          <span style="font-size:19px">📦</span>
          <div class="grow"><strong>${t('stockAlert')}</strong>
          <span class="d-sub">${faNum(low.length)} ${t('stockAlertSub')}: ${low.slice(0, 3).map(x => esc(x.name)).join('، ')}${low.length > 3 ? ' …' : ''}</span></div>
          <button class="btn btn-ghost btn-sm" onclick="navigate('/parts')">${t('viewAll')}</button>
        </div>` : ''}
      </div>
      <div class="card">
        <div class="card-title">📈 ${t('monthlyChart')}</div>
        ${chartHtml}
      </div>
    </div>
    <div class="grid-2" style="margin-top:16px">
      <div class="card">
        <div class="card-title">📊 ${t('statusChart')}</div>
        ${statusHtml}
      </div>
      <div class="card">
        <div class="card-title">🔧 ${t('recentServices')} <button class="btn btn-ghost btn-sm" style="margin-inline-start:auto" onclick="navigate('/services')">${t('viewAll')}</button></div>
        ${recent.length ? recent.map(serviceRow).join('') : `<p style="font-size:13px;color:var(--text-3)">${t('noServices')}</p>`}
      </div>
    </div>
    <div class="section-title"><h3>${t('quickAccess')}</h3></div>
    <div class="tiles">${tiles}</div>
  `;
}
function statCard(emoji, bg, val, key) {
  return `<div class="card stat-card"><div class="stat-icon" style="background:${bg};font-size:21px">${emoji}</div>
    <div class="stat-body"><div class="stat-value">${faNum(val)}</div><div class="stat-label">${t(key)}</div></div></div>`;
}

  c.innerHTML = `
    <div class="toolbar">
      <div class="search">${IC.search}<input id="projSearch" placeholder="${t('searchProjects')}" value="${esc(projFilter.q)}" /></div>
      <div class="chip-row">
        <button class="chip ${projFilter.type === 'all' ? 'active' : ''}" data-t="all">${t('all')}</button>
        <button class="chip ${projFilter.type === 'traction' ? 'active' : ''}" data-t="traction">⚙️ ${t('traction')}</button>
        <button class="chip ${projFilter.type === 'hydraulic' ? 'active' : ''}" data-t="hydraulic">🛢️ ${t('hydraulic')}</button>
      </div>
      <select id="projStatusSel" style="background:var(--bg-card);border:1.5px solid var(--border);border-radius:12px;padding:9px 12px;color:inherit;outline:none">
        <option value="all">${t('statusFilter')}: ${t('all')}</option>
        ${Object.keys(STATUS_META).map(s2 => `<option value="${s2}" ${projFilter.status === s2 ? 'selected' : ''}>${t(STATUS_META[s2].key)}</option>`).join('')}
      </select>
      <select id="projSortSel" style="background:var(--bg-card);border:1.5px solid var(--border);border-radius:12px;padding:9px 12px;color:inherit;outline:none">
        <option value="newest" ${projFilter.sort === 'newest' ? 'selected' : ''}>${t('sortBy')}: ${t('sortNewest')}</option>
        <option value="name" ${projFilter.sort === 'name' ? 'selected' : ''}>${t('sortBy')}: ${t('sortName')}</option>
        <option value="progress" ${projFilter.sort === 'progress' ? 'selected' : ''}>${t('sortBy')}: ${t('sortProgress')}</option>
      </select>
      <button class="btn btn-primary" onclick="openProjectForm()">${IC.plus} ${t('newProject')}</button>
    </div>
    <div id="projList"></div>`;
  $('#projSearch').oninput = debounce(e => { projFilter.q = e.target.value; drawProjList(); }, 200);
  $$('.chip').forEach(ch => ch.onclick = () => { projFilter.type = ch.dataset.t; renderProjects(); });
  $('#projStatusSel').onchange = e => { projFilter.status = e.target.value; drawProjList(); };
  $('#projSortSel').onchange = e => { projFilter.sort = e.target.value; drawProjList(); };
  drawProjList();
}
function drawProjList() {
  const q = projFilter.q.trim().toLowerCase();
  let list = state.projects;
  if (projFilter.type !== 'all') list = list.filter(p => p.elevatorType === projFilter.type);
  if (projFilter.status !== 'all') list = list.filter(p => p.status === projFilter.status);
  if (q) list = list.filter(p => (p.name + ' ' + p.customer + ' ' + p.location + ' ' + p.controller + ' ' + p.motor).toLowerCase().includes(q));
  list = [...list];
  if (projFilter.sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name, 'fa'));
  else if (projFilter.sort === 'progress') list.sort((a, b) => b.progress - a.progress);
  const el = $('#projList');
  if (!state.projects.length) {
    el.innerHTML = `<div class="empty"><div class="e-icon">🏗️</div><strong>${t('noProjects')}</strong><p>${t('noProjectsSub')}</p><button class="btn btn-primary" onclick="openProjectForm()">${IC.plus} ${t('newProject')}</button></div>`;
    return;
  }
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="e-icon">🔍</div><strong>${t('notFound')}</strong><p>${t('notFoundSub')}</p></div>`;
    return;
  }
  el.innerHTML = list.map(p => `
    <div class="row-item" onclick="navigate('/projects/${p.id}')">
      <div class="row-icon" style="background:${p.elevatorType === 'hydraulic' ? 'var(--teal-soft)' : 'var(--accent-soft)'};font-size:20px">${p.elevatorType === 'hydraulic' ? '🛢️' : '⚙️'}</div>
      <div class="row-body">
        <strong>${esc(p.name)}</strong>
        <span class="sub">${esc(p.customer)} · ${esc(p.location)}</span>
        <div class="mini-progress"><div class="fill" style="width:${p.progress}%"></div></div>
      </div>
      <div class="row-side">
        ${statusBadge(p.status)}
        <span class="date">${faNum(p.floors)} ${t('floorsUnit')} · ${faNum(p.capacityKg)}kg · ${faNum(p.progress)}٪</span>
      </div>
    </div>`).join('');
}

      <button class="btn btn-primary" id="projSave">${p ? t('save') : t('create')}</button>
    </div>`, { size: 'lg' });
  $('#projSave').onclick = async () => {
    const name = $('#f_name').value.trim();
    if (!name) { toast(t('requiredName'), 'err'); return; }
    const body = {
      name, customer: $('#f_customer').value, phone: $('#f_phone').value, location: $('#f_location').value,
      elevatorType: $('#f_type').value, status: $('#f_status').value,
      capacityKg: +$('#f_cap').value, persons: +$('#f_persons').value, floors: +$('#f_floors').value,
      stops: +$('#f_stops').value, speed: +$('#f_speed').value, progress: +$('#f_progress').value,
      serviceIntervalDays: +$('#f_interval').value,
      controller: $('#f_controller').value, motor: $('#f_motor').value,
      drive: $('#f_drive').value, doorOperator: $('#f_doorop').value,
      roping: $('#f_roping').value, encoder: $('#f_encoder').value, brake: $('#f_brake').value,
      notes: $('#f_notes').value
    };
    const btn = $('#projSave'); btn.disabled = true;
    try {
      if (p) {
        const d = await api('/projects/' + p.id, { method: 'PUT', body });
        Object.assign(p, d.project);
        toast(t('saved'));
      } else {
        const d = await api('/projects', { method: 'POST', body });
        state.projects.unshift(d.project);
        toast(t('created'));
      }
      state.projects.sort((a, b) => b.updatedAt - a.updatedAt);
      closeModal(); render();
    } catch (e) { toast(t('errGeneric'), 'err'); btn.disabled = false; }
  };
}

function deleteProject(id) {
  confirmDialog(t('confirmDeleteTitle'), t('confirmDeleteMsg'), async () => {
    // optimistic
    const idx = state.projects.findIndex(p => p.id === id);
    const [removed] = state.projects.splice(idx, 1);
    closeModal();
    navigate('/projects');
    try {
      await api('/projects/' + id, { method: 'DELETE' });
      state.services = state.services.filter(s => s.projectId !== id);
      toast(t('deleted'));
    } catch (e) {
      state.projects.splice(idx, 0, removed);
      toast(t('errGeneric'), 'err'); render();
    }
  });
}

function drawSvcList() {
  const q = svcFilter.q.trim().toLowerCase();
  let list = state.services;
  if (svcFilter.projectId) list = list.filter(s => s.projectId === svcFilter.projectId);
  if (svcFilter.type !== 'all') list = list.filter(s => s.serviceType === svcFilter.type);
  if (q) list = list.filter(s => (svcTarget(s) + ' ' + (s.customer || '') + ' ' + (s.elevatorInfo || '') + ' ' + s.technician + ' ' + s.problem + ' ' + (s.complaint || '') + ' ' + s.diagnosis + ' ' + s.workDone + ' ' + s.partsReplaced).toLowerCase().includes(q));

function exportServicesCsv() {
  const head = [t('svcDate'), t('svcCustomer'), t('svcProject'), t('svcTechnician'), t('svcType'), t('svcProblem'), t('svcDiagnosis'), t('svcWork'), t('svcParts'), t('svcFinal')];
  const rows = state.services.map(s => [
    new Date(s.date).toISOString().slice(0, 10),
    s.customer || '', s.projectId ? projName(s.projectId) : '', s.technician,
    t(SVC_META[s.serviceType].key), s.problem, s.diagnosis, s.workDone, s.partsReplaced,
    t(FINAL_META[s.finalStatus].key)
  ]);
  const csvEsc = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const csv = '\ufeff' + [head, ...rows].map(r => r.map(csvEsc).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'zlift-services-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  toast(t('saved'));
}

function exportPartsCsv() {
  const head = [t('partName'), t('partCategory'), t('partUnit'), t('partQty'), t('partMin'), t('partPrice'), t('partLocation'), t('partNote')];
  const rows = state.parts.map(x => [x.name, x.category, x.unit, x.qty, x.minQty, x.price, x.location, x.note]);
  const csvEsc = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const csv = '\ufeff' + [head, ...rows].map(r => r.map(csvEsc).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'zlift-parts-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  toast(t('saved'));
}

function renderChecklistDetail(idWithQuery) {
  const [tid, query] = idWithQuery.split('?');
  const params = new URLSearchParams(query || '');
  let selectedProject = params.get('project') || '';
  const tp = CHECKLIST_TEMPLATES.find(x => x.id === tid);
  const c = $('#content');
  if (!tp) {
    c.innerHTML = `<div class="empty"><div class="e-icon">🔍</div><strong>${t('notFound')}</strong><p>${t('notFoundSub')}</p>
      <button class="btn btn-primary" onclick="navigate('/checklists')">${t('checklists')}</button></div>`;
    return;
  }
  const eligible = state.projects.filter(p => p.elevatorType === tp.type);
  if (selectedProject && !eligible.find(p => p.id === selectedProject)) selectedProject = '';

  function getInst() {
    return selectedProject ? state.checklists.find(x => x.projectId === selectedProject && x.templateId === tid) : null;
  }

  /* 4-state items: undefined/false=blank, true|'pass'=pass, 'fail'=fail, 'na'=N/A */
  const stateOf = v => v === true || v === 'pass' ? 'pass' : v === 'fail' ? 'fail' : v === 'na' ? 'na' : 'blank';
  const nextState = { blank: 'pass', pass: 'fail', fail: 'na', na: 'blank' };
  const stIcon = { blank: '⬜', pass: '✅', fail: '❗', na: '➖' };
  let viewChecked = {}; // for no-project view mode

  function counts(checked) {
    const total = tp.groups.reduce((a, g) => a + g.items.length, 0);
    let pass = 0, fail = 0, na = 0;
    tp.groups.forEach(g => g.items.forEach(it => {
      const s = stateOf(checked[it.id]);
      if (s === 'pass') pass++; else if (s === 'fail') fail++; else if (s === 'na') na++;
    }));
    const done = pass + fail + na;
    return { total, pass, fail, na, done, pct: total ? Math.round(done / total * 100) : 0 };
  }

  function draw() {
    const inst = getInst();
    const checked = inst ? inst.checked : viewChecked;
    const cn = counts(checked);
    const failedItems = [];
    tp.groups.forEach(g => g.items.forEach(it => { if (stateOf(checked[it.id]) === 'fail') failedItems.push(it); }));

    c.innerHTML = `
      <button class="btn btn-ghost btn-sm" onclick="navigate('/checklists')" style="margin-bottom:14px">${IC.back} ${t('checklists')}</button>
      <div class="detail-head">
        <div class="grow">
          <h2 style="font-size:19px">${tp.kind === 'install' ? '🏗️' : '🔧'} ${esc(tp.title[LANG] || tp.title.fa)}</h2>
          <div class="sub">${typeBadge(tp.type)} ${inst ? `<span class="badge b-gray">${t('chLastUpdate')}: ${fmtDateTime(inst.updatedAt)}</span>` : ''}</div>
        </div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="field" style="margin-bottom:0">
          <label>${t('chSelectProject')}</label>
          <select id="chProject">
            <option value="">${t('chNoProject')}</option>
            ${eligible.map(p => `<option value="${p.id}" ${selectedProject === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="check-progress-wrap">
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:7px;flex-wrap:wrap;gap:4px">
          <span>${t('chProgress')}</span>
          <span id="chStats">✅ ${faNum(cn.pass)} · ❗ ${faNum(cn.fail)} · ➖ ${faNum(cn.na)} — ${faNum(cn.pct)}٪</span>
        </div>
        <div class="mini-progress" style="height:9px;margin:0"><div class="fill" id="chFill" style="width:${cn.pct}%"></div></div>
        <div style="font-size:11.5px;color:var(--text-3);margin-top:7px">💡 ${t('chTapHint')}</div>
      </div>
      <div id="chFailedBox">${failedItems.length ? `
        <div class="card" style="border-inline-start:4px solid var(--danger);margin-bottom:14px">
          <div class="card-title" style="color:var(--danger);margin-bottom:8px">❗ ${t('chFailed')} (${faNum(failedItems.length)})</div>
          <ul style="padding-inline-start:20px;font-size:13.3px;color:var(--text-2)">${failedItems.map(it => `<li>${esc(it[LANG] || it.fa)}</li>`).join('')}</ul>
          ${selectedProject ? `<button class="btn btn-soft-danger btn-sm" style="margin-top:8px" onclick="chFailedToIssue('${tid}')">🔴 ${t('chFailToIssue')}</button>` : ''}
        </div>` : ''}</div>
      <div class="card">
        ${tp.groups.map(g => `
          <div class="check-group">
            <h4>${esc(g.title[LANG] || g.title.fa)}</h4>
            ${g.items.map(it => {
              const s = stateOf(checked[it.id]);
              return `<div class="check-item ci-${s}" data-item="${it.id}" role="button" tabindex="0" style="user-select:none">
                <span class="ci-state" style="font-size:17px;width:24px;text-align:center;flex-shrink:0">${stIcon[s]}</span>
                <span><span class="ci-text" style="${s === 'na' ? 'text-decoration:line-through;color:var(--text-3)' : s === 'fail' ? 'color:var(--danger);font-weight:600' : ''}">${esc(it[LANG] || it.fa)}</span>${it.ref ? `<span class="ci-ref">📖 ${esc(it.ref)}</span>` : ''}</span>
              </div>`;
            }).join('')}
          </div>`).join('')}
        <p class="calc-note">📖 ${t('standardRef')}</p>
      </div>`;

    window._chCtx = { tid, selectedProject, tp, getInst, viewChecked };
    $('#chProject').onchange = e => {
      selectedProject = e.target.value;
      history.replaceState(null, '', '#/checklists/' + tid + (selectedProject ? '?project=' + selectedProject : ''));
      draw();
    };

    const save = debounce(async () => {
      const inst2 = getInst();
      if (!inst2) return;
      try { await api('/checklists', { method: 'POST', body: { projectId: selectedProject, templateId: tid, checked: inst2.checked } }); }
      catch (e) { toast(t('errGeneric'), 'err'); }
    }, 500);

    async function cycle(el) {
      const itemId = el.dataset.item;
      let store;
      if (selectedProject) {
        let inst2 = getInst();
        if (!inst2) {
          inst2 = { id: 'tmp', projectId: selectedProject, templateId: tid, checked: {}, updatedAt: Date.now() };
          state.checklists.push(inst2);
          try {
            const d = await api('/checklists', { method: 'POST', body: { projectId: selectedProject, templateId: tid, checked: {} } });
            inst2.id = d.checklist.id;
          } catch (e) {}
        }
        store = inst2.checked;
        inst2.updatedAt = Date.now();
      } else {
        store = viewChecked;
      }
      const cur = stateOf(store[itemId]);
      const nxt = nextState[cur];
      if (nxt === 'blank') delete store[itemId];
      else store[itemId] = nxt;
      // update this row in place
      const s = nxt;
      el.className = 'check-item ci-' + s;
      el.querySelector('.ci-state').textContent = stIcon[s];
      const txt = el.querySelector('.ci-text');
      txt.style.cssText = s === 'na' ? 'text-decoration:line-through;color:var(--text-3)' : s === 'fail' ? 'color:var(--danger);font-weight:600' : '';
      // update stats
      const cn2 = counts(store);
      $('#chStats').textContent = `✅ ${faNum(cn2.pass)} · ❗ ${faNum(cn2.fail)} · ➖ ${faNum(cn2.na)} — ${faNum(cn2.pct)}٪`;
      $('#chFill').style.width = cn2.pct + '%';
      // update failed box
      const failed = [];
      tp.groups.forEach(g => g.items.forEach(it => { if (stateOf(store[it.id]) === 'fail') failed.push(it); }));
      $('#chFailedBox').innerHTML = failed.length ? `
        <div class="card" style="border-inline-start:4px solid var(--danger);margin-bottom:14px">
          <div class="card-title" style="color:var(--danger);margin-bottom:8px">❗ ${t('chFailed')} (${faNum(failed.length)})</div>
          <ul style="padding-inline-start:20px;font-size:13.3px;color:var(--text-2)">${failed.map(it => `<li>${esc(it[LANG] || it.fa)}</li>`).join('')}</ul>
          ${selectedProject ? `<button class="btn btn-soft-danger btn-sm" style="margin-top:8px" onclick="chFailedToIssue('${tid}')">🔴 ${t('chFailToIssue')}</button>` : ''}
        </div>` : '';
      if (selectedProject) save();
    }

    c.querySelectorAll('.check-item[data-item]').forEach(el => {
      el.onclick = () => cycle(el);
      el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cycle(el); } };
    });
  }
  draw();
}

async function chFailedToIssue(tid) {
  const ctx = window._chCtx;
  if (!ctx || ctx.tid !== tid || !ctx.selectedProject) return;
  const inst = ctx.getInst();
  const checked = inst ? inst.checked : ctx.viewChecked;
  const stOf = v => v === true || v === 'pass' ? 'pass' : v === 'fail' ? 'fail' : v === 'na' ? 'na' : 'blank';
  const failed = [];
  ctx.tp.groups.forEach(g => g.items.forEach(it => { if (stOf(checked[it.id]) === 'fail') failed.push(it.fa); }));
  if (!failed.length) return;
  try {
    const d = await api('/issues', { method: 'POST', body: {
      title: (ctx.tp.title.fa || '') + ' — ' + faNum(failed.length) + ' ' + t('chFailed'),
      kind: 'open',
      projectId: ctx.selectedProject,
      note: failed.map((f, i) => faNum(i + 1) + '. ' + f).join('\n'),
      closed: false
    } });
    state.issues.unshift(d.item);
    toast(t('created'));
  } catch (e) { reportError(e, 'chFailedToIssue'); }
}

function computeCalc(cal) {
  const vals = {};
  cal.inputs.forEach(inp => { vals[inp.id] = parseFloat($(`#calc_${cal.id}_${inp.id}`).value) || 0; });
  try {
    const rows = cal.compute(vals);
    $('#calcResult_' + cal.id).innerHTML = `<div class="calc-result">
      ${rows.map(r => `<div class="r-row"><span class="r-label">${esc(r.label[LANG] || r.label.fa || r.label)}</span><span class="r-val">${esc(r.val)}</span></div>`).join('')}

  } catch (e) {
    $('#calcResult_' + cal.id).innerHTML = `<div class="error-box" style="padding:10px;margin-top:10px">⚠️</div>`;
  }
}

function _diagStepBackDom() {
  /* called by hardware back: one step back, or exit flow at first step */
  if (!diagSession) return;
  if (!diagSession.path.length) { diagSession = null; }
  else { diagSession.current = diagSession.path.pop(); }
  renderDiagnostics();
}
function startDiagFlow(id) {
  const f = DIAG_FLOWS.find(x => x.id === id);
  if (!f) return;
  diagSession = { flowId: id, path: [], current: f.start };
  pushUiLayer('diag', _diagStepBackDom);
  renderDiagnostics();
  window.scrollTo(0, 0);
}
function diagAnswer(nodeId) {
  const f = DIAG_FLOWS.find(x => x.id === diagSession.flowId);
  if (!f || !f.nodes[nodeId]) return;
  diagSession.path.push(diagSession.current);
  diagSession.current = nodeId;
  pushUiLayer('diag', _diagStepBackDom);
  renderDiagnostics();
  window.scrollTo(0, 0);
}
function diagBack() {
  if (!diagSession) return;
  popTaggedLayer('diag');
  if (!diagSession.path.length) { diagSession = null; renderDiagnostics(); return; }
  diagSession.current = diagSession.path.pop();
  renderDiagnostics();
}
function diagExit() {
  while (popTaggedLayer('diag')) {}
  diagSession = null;
  renderDiagnostics();
}

    </div>

      <div class="row-icon" style="background:var(--warn-soft);font-size:22px;width:50px;height:50px">${f.icon || '🔩'}</div>
      <div class="grow">
        <h2 style="font-size:18px">${esc(f.symptom.fa)}</h2>

    el.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="e-icon">🔍</div><strong>${t('notFound')}</strong><p>${t('notFoundSub')}</p></div>`;
    return;
  }
  el.innerHTML = list.map(k => `
    <div class="card kb-card" onclick="openKbArticle('${k.id}')">
